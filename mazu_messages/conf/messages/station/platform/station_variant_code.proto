syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

message StationItem {
    optional string key               = 1;
    optional string value             = 2;
}

message StationVariantCodeInfo {
    enum SalesRegionTyp {
        INVALID_SALES_REGION = 0;
        CN = 1;
        EU = 2;
    }
    optional SalesRegionTyp sales_region                       = 1;  // sales region 
     
    enum StationGenerationTyp {
        INVALID_SWAP_GENERATION = 0;
        POWER_SWAP_STATION_1 = 1;
        POWER_SWAP_STATION_2 = 2;
        POWER_SWAP_STATION_3 = 3;
    }
    optional StationGenerationTyp swap_generation              = 2;  // station generation
    optional string swap_station_id                            = 3; // station id

    optional string swap_station_stage                         = 4; // station stage

    optional string swap_station_entrance_type                 = 5; // station entrance type

    optional double swap_station_platform_height               = 6; // station height

    optional string swap_station_platform_length               = 7; // station length

    optional string variant_config_path                        = 8; // variant config file path

    optional uint64 variant_config_time                        = 9; // variant config modified time

    repeated StationItem station_list                          = 10; // station_list
}




message StationVariantCode {
    optional bool is_variant_code_valid = 1; // 0 - invalid; 1 - valid
    optional StationVariantCodeInfo variant_code_info = 2; 

    optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
    optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts = 536870907;     // publish ptp timestamp, uint in nanosec
    optional string publisher_id = 536870909; // uuid of the publisher
    optional uint64 counter = 536870910;         // message counter
    optional uint64 publish_ts = 536870911;    // publish utc timestamp; unit : nanosecond

}