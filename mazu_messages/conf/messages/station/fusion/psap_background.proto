syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/perception/lidar_occupancy_grid.proto";

message BackGroundProb {

  message CellProb {
    message TopzProb {
      optional float z = 1;
      optional float prob = 2;
    }
    message TypeProb {
      optional LidarOccupancyGrid.LOGSemanticClass type = 1;
      optional float prob = 2;
    }
    optional float x = 1;
    optional float y = 2;
    optional float hit_prob = 3;
    repeated TopzProb topz_prob = 4;
    repeated TypeProb type_prob = 5;
  }
  optional uint64 timestamp = 1; // build timestamp
  repeated CellProb cells = 2;
  optional uint64 publish_ptp_ts = 536870907; // publish ptp timestamp, uint in nanosec
  optional string publisher_id = 536870909; // uuid of the publisher
  optional uint64 counter = 536870910;      // message counter
  optional uint64 publish_ts = 536870911; // publish timestamp; unit : nanosecond
}
