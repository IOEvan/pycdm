syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;

import "common/perf/sensor_ts_header.proto";
import "common/perception/lidar_failsafe.proto";

message Station_Lidar_FailSafeDetection{
    optional uint64 timestamp = 1;//Timestamp_Receive_Image
    optional Lidar_FailSafe failsafe_Lidar_Inside_Left = 2;    //for old station is QT, new station is robin
    optional Lidar_FailSafe failsafe_Lidar_Inside_Right = 3;   //for old station is QT, new station is robin
    optional Lidar_FailSafe failsafe_Lidar_Outside_Left = 4;   //for old station is QT, new station is falcon
    optional Lidar_FailSafe failsafe_Lidar_Outside_Right = 5;  //for old station is QT, new station is falcon
    optional Lidar_FailSafe failsafe_Robin_Outside_Left = 6;   //only new station
    optional Lidar_FailSafe failsafe_Robin_Outside_Right = 7;  //only new station
 
    optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts = 536870907;  // publish ptp timestamp, uint in nanosec
    optional string publisher_id = 536870909;    // uuid of the publisher
    optional uint64 counter = 536870910;         // message counter
    optional uint64 publish_ts = 536870911;      // publish utc timestamp; unit : nanosecond

}
