syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

import "common/lane_segment/lane_seg_event.proto";

message FeatureOperationInfo {
    repeated FeatureOperationPoint feature_operation_point = 1; // four points
    optional string raw_payload = 2; // raw event payload, for debug

    optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
    optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts = 536870907; // publish ptp timestamp, uint in nanosec
    optional string publisher_id = 536870909; // uuid of the publisher
    optional uint64 counter = 536870910;         // message counter
    optional uint64 publish_ts = 536870911;    // publish timestamp; unit : nanosecond
}

message FeatureOperationPoint{
    optional bool is_valid                       = 1; // set to true if car goes into event after offset start
    optional int32 offset_start                  = 2; // distance from current vehicle along the driving path ; if navigation is valid ,the route is along the path; else there is no route 
    optional int32 offset_end                    = 3;
    optional uint64 linkid                       = 4;
    optional int32 curr_laneidx                  = 5;

    optional EventCondition event_condition      = 6 ;
    repeated DrivingActionContext action_context = 7 ;
}
