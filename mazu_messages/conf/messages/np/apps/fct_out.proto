message RcvProtoPTPTimeOut{
   optional uint64 function_arb_out_ptp_ts          = 1;
   optional uint64 sd_map_ptp_ts                    = 2;
   optional uint64 nop_functionstatus_ptp_ts        = 3;
   optional uint64 nop_speedlimitvalue_ptp_ts       = 4;
   optional uint64 nop_vehicleout_ptp_ts            = 5;
   optional uint64 side_feature_ptp_ts              = 6;
   optional uint64 vision_illumnance_flag_ptp_ts    = 7;
   optional uint64 vision_road_detection_ptp_ts     = 8;
   optional uint64 vehicle_10ms_ptp_ts              = 9;
   optional uint64 vehicle_50ms_ptp_ts              = 10;
   optional uint64 ehy_lpp_outputs_ptp_ts           = 11;
   optional uint64 ehy_obf_outputs_ptp_ts           = 12;
   optional uint64 ehy_rme_road_outputs_ptp_ts      = 13;
   optional uint64 ehy_tpp_outputs_ptp_ts           = 14;
   optional uint64 ehy_tse_outputs_ptp_ts           = 15;
   optional uint64 ehy_tsi_outputs_ptp_ts           = 16;
   repeated uint64 reserved_ptp_ts                  = 99;
}

message esd_np_tld_fct{
   optional uint32 tld_valid= 1; //0：无效，1：有效
   optional uint32 tld_type = 2; //0：Unknown, 1：Left, 2：Right, 3：Straight, 5：U_Turn
   optional uint32 tld_color = 3; //0：Unknown, 1：Red, 2：Yellow, 3：Green
   optional uint32 tld_status = 4; //0：常亮，1：闪烁
   optional uint32 tld_timer = 5; //65535表示无效值
}

message esd_np_feature_fct{
    repeated esd_np_line_fct esd_np_Line_fct=1;
    repeated esd_np_object_fct esd_np_Object_fct=2;
    optional esd_np_path_fct  esd_np_Path_fct =3;
    optional esd_np_alc_fct esd_np_Alc_fct=4;
    optional esd_np_tld_fct esd_tld_fct = 5;
}

message esd_np_line_fct{
    optional uint64 esd_np_line_role_fct      = 1;   // LD_Track_ID
    optional uint64 esd_np_line_ld_level_fct  = 2; //highlight level 0~3
    optional uint64 esd_np_line_ldw_level_fct = 3;

}
message esd_np_object_fct{
    optional uint64 esd_np_obj_id_fct   =1; ////  1 ~ 2 ^ 20（1048576)
    optional uint64 esd_np_obj_level_fct=2;//highlight level  0~5
    optional uint64 esd_np_obj_da_fct   =3; //drive assist level 0~5
    optional uint64 esd_np_obj_elk_fct  =4;//0 normal 1 oncoming 2 overtaking 3 reserved
}
message esd_np_path_fct{
    optional float esd_np_path_c0_fct =1;
    optional float esd_np_path_c1_fct =2;
    optional float esd_np_path_c2_fct =3;
    optional float esd_np_path_c3_fct =4;
    optional float esd_np_path_c4_fct =5;
    optional float esd_np_path_c5_fct =6;
    optional float esd_np_path_end_fct=7;
    optional bool esd_np_enable_fct   =8;// 1 enable 0  not enable
}
message esd_np_alc_fct{
    optional uint64 esd_np_alc_crossing_fct    =1;  // reserved
    optional uint64 esd_np_alc_sts_fct         =2;//0~9
    optional uint32 esd_laneChngIntent_fct     =3;//0-none 1-left 2-right
    optional bool   esd_crossed_left_lane_fct  =4;//ego car crosses the lane
    optional bool   esd_crossed_right_lane_fct =5; //ego car crosses the lane
}

message DriveAssistToAdhmi{
   optional uint32 DAmain_to_ADinfo =1;
   optional uint32 DAmain_to_WTI =2;
}
message ManualDriveToAdhmi {
       optional uint32  MD_to_ADinfo = 1;
       optional  uint32 MD_to_WTI = 2;
}

message FctOut{
   required AhcOut Ahc                              = 1;
   required LatCtrlOut LatCtrl                      = 2;
   optional LonCtrlOut LonCtrl                      = 3;
   optional HwaOut Hwa                              = 4;
   optional LdwOut Ldw                              = 5;
