syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";
import "np/apps/parking/par_base.proto";

message CruiseStateMachine {
    enum SystemMode {
        REVERSE_ASSIT = 0;
        BEATEN_TRACK = 1;
    }
    
    enum BeatenParkState {
        PARK_UNKNOWN = 0;
        PARK_IN = 1;
        PARK_OUT = 2;
    }
    
    enum SystemState {
        IDLE = 0;
        TRAJECTORY_RECORD = 1;
        AUTO_CRUISE = 2;
    }
    
    enum TrajFileState {
        NORMAL = 0;
        SAVE_TRAJECTORY = 1;
        CLEAR_TRAJECTORY = 2;
    };
    optional SystemMode mode = 1;
    optional BeatenParkState beaten_park_state = 2;
    optional SystemState system_state = 3;
    optional TrajFileState traj_file_state = 4;

    optional SensorTSHeader sensor_original_ts = 536870906; // sensor original ts
    optional string publisher_id = 536870909;      // uuid of the publisher
    optional uint64 publish_ptp_ts = 536870907;    // publish ptp timestamp, uint in nanosec
    optional uint64 counter = 536870910;           // message counter
    optional uint64 publish_ts = 536870911;        // publish timestamp; unit : nanosecond
}
