syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/perception/lidar_occupancy_grid.proto";


message LidarOccupancyGridOutput{
    message LidarGridPoint{
        optional float x = 1;
        optional float y = 2;
        optional float ground_z = 3;
        optional float max_z = 4;
        optional float min_z = 5;
        optional uint32 num_pts = 6;
        optional float timestamp = 7;
        optional LidarOccupancyGrid.LOGSemanticClass type = 8;
    }

  optional uint64 timestamp = 1; // build timestamp
  repeated LidarGridPoint lidar_grid_points = 2;
  optional uint64 publish_ptp_ts = 536870907; // publish ptp timestamp, uint in nanosec
  optional string publisher_id = 536870909; // uuid of the publisher
  optional uint64 counter = 536870910;      // message counter
  optional uint64 publish_ts = 536870911; // publish timestamp; unit : nanosecond
}
