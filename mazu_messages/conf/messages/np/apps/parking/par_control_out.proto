syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

import "common/vehicle_out/ads_actu.proto";
import "np/apps/parking/par_base.proto";

enum ControlStatus {
    CONTROL_NONE = 0;
    // No error, returns on success.
    CONTROL_OK = 1;
    // Control module error codes start from here.
    CONTROL_ERROR = 2;
    CONTROL_INIT_ERROR = 3;
    CONTROL_COMPUTE_ERROR = 4;
    CONTROL_FINISHED=5;

    CONTROL_PSAP_OK=6;
    CONTROL_PSAP_FORWARD=7;
    CONTROL_PSAP_BACKWARD=8;
}

enum ControlEstopType {
    ESTOP_TYPE_NONE = 0;
    ESTOP_TYPE_FROM_PLANNING         = 1;
    ESTOP_TYPE_LOCALIZATION_JUMP     = 2;
    ESTOP_TYPE_VEH_USS_COLLISION_CHK = 3;
    ESTOP_TYPE_Rsrvd4                = 4;
    ESTOP_TYPE_Rsrvd5                = 5;
    ESTOP_TYPE_Rsrvd6                = 6;
}

message ParkingControlSts {
  optional ControlStatus control_status = 1;
  optional LngLwSpdCtrlIf long_control_out = 2;  // vcu llc output
  optional LatCtrlIf lat_control_out = 3;

  optional NodeInfo node_info=4;

  optional uint64 timestamp = 5; // unit: nanosecond

  optional LngctrlCmfrtIf long_control_vlc_out = 6;  // vcu vlc output

  optional ControlEstopType control_estop_type = 7;

  optional VehRwsCtrlIf lat_control_rws_out = 8;  // eps rws output

  optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
  optional uint64 publish_ptp_ts = 536870907;     // publish ptp timestamp, uint in nanosec
  optional string publisher_id = 536870909; // uuid of the publisher
  optional uint64 counter = 536870910; // message counter
  optional uint64 publish_ts = 536870911; // publish utc timestamp; unit : nanosecond
}
