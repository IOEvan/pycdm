syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

import "np/apps/ehy_target_base.proto";

message TcaTarget{
  repeated TgtObj tca_obj = 1; // CA object at host lane
  optional uint32 valid_tgt_num = 2;
  repeated TgtObj tca_obj_left = 3; // CA object at left lane
  repeated TgtObj tca_obj_right = 4; // CA object at right lane
}

message PedTarget{
  repeated TgtObj obj_host = 1; // pedestrain at host lane
  repeated TgtObj obj_left = 2; // pedestrain at left lane
  repeated TgtObj obj_right = 3; // pedestrain at right lane
}

message EHYTsiOutputs{
  repeated TgtObj tsi_obj = 1;//40
  repeated TgtObj rm_tsi_out = 2;//40
  optional TcaTarget tca_out = 3;
  optional uint32 tsi_status = 4; //
  optional bool tsi_flg_cipvlost = 5;
  optional bool tsi_ego_lane_changed = 6;
  optional uint32 svc_frnt_obstacle_status = 7;
  optional PedTarget ped_out = 8;
  repeated uint32 bsd_hmi_id = 9; // vision ID of bsd objects
  repeated uint32 lca_hmi_id = 10; // vision ID of lca objects
  
  optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
  optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
  optional uint64 publish_ptp_ts = 536870907;     // publish ptp timestamp, uint in nanosec
  optional string publisher_id = 536870909; // uuid of the publisher
  optional uint64 counter = 536870910;         // message counter
  optional uint64 publish_ts = 536870911;    // publish utc timestamp; unit : nanosecond
}
