syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

import "np/apps/ehy_obf_outputs.proto";

message LineInfo{
  optional Role role         = 1;
  optional uint32 id           = 2;
  optional uint32 ori_track_id = 3;

  optional float c0            = 4;    // unit:m   in SAE coordinate, right is positive
  optional float c1            = 5;
  optional float c2            = 6;
  optional float c3            = 7;
  optional float start         = 8;
  optional float end           = 9;

  repeated Point3D points        = 10;  // 200m

  enum Role{
    LDRole_Unknown = 0;
    LDRole_Host_Left = 1;
    LDRole_Host_Right = 2;
    LDRole_Adjacent_Left_Left = 3;
    LDRole_Adjacent_Left_Right = 4;
    LDRole_Adjacent_Right_Left = 5;
    LDRole_Adjacent_Right_Right = 6;
  }
}

message ObjectInfo{
  optional uint32 id           = 1;
  optional uint32 ori_track_id = 2;
  repeated Point3D points        = 3;
}

message RoadModelOutputs{
  optional uint64 timestamp       = 1;         //Timestamp_Receive_Image
  repeated LineInfo LineInfos     = 2;
  repeated ObjectInfo ObjectInfos = 3;


  optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
  optional uint64 publish_ptp_ts = 536870907; // publish ptp timestamp, uint in nanosec
  optional string publisher_id = 536870909;   // uuid of the publisher
  optional uint64 counter = 536870910;        // message counter
  optional uint64 publish_ts = 536870911;     // publish utc timestamp; unit : nanosecond

}
