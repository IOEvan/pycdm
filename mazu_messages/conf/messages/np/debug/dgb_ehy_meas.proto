syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages.debug;
// import "common/perf/sensor_ts_header.proto";

import "np/apps/dlb_evd_msmt.proto";
import "np/apps/dlb_hmi_msmt.proto";
import "np/apps/dlb_obf_msmt.proto";
import "np/apps/dlb_rme_msmt.proto";
import "np/apps/dlb_tsi_msmt.proto";

message EHYDebugMeas{
    
	optional DLBEVDDebugMeas dlb_evd_msmt = 1;
	optional DLBHMIDebugMeas dlb_hmi_msmt = 2;
	optional DLBOBFDebugMeas dlb_obf_msmt = 3;
	optional DLBRMEDebugMeas dlb_rme_msmt = 4;
	optional DLBTSIDebugMeas dlb_tsi_msmt = 5;

	// optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
	optional uint64 publish_ptp_ts = 536870907;     // publish ptp timestamp, uint in nanosec
	optional string publisher_id = 536870909; // uuid of the publisher
	optional uint64 counter = 536870910; // message counter
	optional uint64 publish_ts = 536870911;    // publish utc timestamp; unit : nanosecond
}
