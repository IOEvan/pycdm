message ParEnvSemanticMapDebug {
    optional int32 module_state = 1;
    optional bool vehicle_state_valid = 2;
    optional bool uss_instance_valid = 3;
    optional bool svc_instance_valid = 4;

    optional FeatureType feature_type = 5;
    optional FeatureStatus feature_state = 6;
    optional float latest_location_odom_x = 7;
    optional float latest_location_odom_y = 8;
    optional float latest_location_odom_theta = 9;
    optional float latest_location_psap_x = 10;
    optional float latest_location_psap_y = 11;
    optional float latest_location_psap_theta = 12;

    optional uint32 slot_num = 13;
    optional uint32 slot_corner_valid_num = 14;
    optional uint32 slot_parkstop_valid_num = 15;
    optional uint32 slot_curb_valid_num = 16;
    optional ParEnvSlotObjectResult left_corner = 17;
    optional ParEnvSlotObjectResult right_corner = 18;
    optional ParEnvSlotObjectResult curb_or_parkstop = 19;

    repeated ParEnvSlotAssembyResult slot_results = 20;
}

message ParEnvCollisionData {
    optional float crash_distance = 1;
    optional float obj_distance = 2;
    optional float uss_region_distance = 3;
    optional float center_x = 4;    // when collision dis < 0.9, then show 4-9
    optional float center_y = 5;
    optional float center_yaw = 6;
    optional ParEnvObjectPoint crash_pt1 = 7;
    optional ParEnvObjectPoint crash_pt2 = 8;
    optional uint32 path_index = 9;
}

message ParEnvCollisionCheckerDebug {
    optional bool is_load_config = 1;
    optional float wheel_curve = 2;
    optional bool is_larger_outlines = 3;
    optional ParEnvCollisionData forward_dst = 4;
    optional ParEnvCollisionData backward_dst = 5;
    optional ParEnvCollisionData direct_forward_dst = 6;
    optional ParEnvCollisionData direct_backward_dst = 7;
    optional uint64 reserved_0 = 100;
    optional uint64 reserved_1 = 101;
    optional uint64 reserved_2 = 102;
    optional uint64 reserved_3 = 103;
    optional float reserved_4 = 104;
    optional float reserved_5 = 105;
    optional float reserved_6 = 106;
    optional float reserved_7 = 107;
    optional bool reserved_8 = 108;
    optional bool reserved_9 = 109;
    optional string reserved_10 = 110;
}

message ParEnvSlotsGenerateDebug {
    optional float ego_x = 1;
    optional float ego_y = 2;
    optional float ego_yaw = 3;
    optional uint32 uss_slots_size = 4;
    optional uint32 svc_slots_size = 5;
    optional uint32 planning_return_slots_size = 6;
    optional uint32 planning_slots_size = 7;
    optional uint32 bind_slots_size = 8;
    optional uint32 hmi_slots_size = 9;
    optional ParkSlot psap_slot = 10; // when in psap mode, show 10-14
    optional psapMapObject psap_hmi = 11;
    optional float psap_ad_pose_x = 12; // AD_Pose based on O1, for SVC coordinate transform
    optional float psap_ad_pose_y = 13;
    optional float psap_ad_pose_yaw = 14;
    optional uint32 planning_ok_slots_size = 15; // when in sapa mode, show
    optional uint32 track_slot_index = 16;
    optional ParkSlot sapa_guidance_slot = 17; // only show in sapa preguidance/guidance stage
    optional bool guidance_slot_planning_ok = 18;
    optional float guidance_slot_size_x = 19;
    optional float guidance_slot_size_y = 20;
    optional bool is_guidance_slot_narrow = 21;
    optional uint64 reserved_0 = 100;
    optional uint64 reserved_1 = 101;
    optional uint64 reserved_2 = 102;
    optional uint64 reserved_3 = 103;
    optional float reserved_4 = 104;
    optional float reserved_5 = 105;
    optional float reserved_6 = 106;
    optional float reserved_7 = 107;
    optional bool reserved_8 = 108;
    optional bool reserved_9 = 109;
    optional string reserved_10 = 110;
}

