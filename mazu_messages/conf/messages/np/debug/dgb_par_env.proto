syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages.debug;
// import "common/perf/sensor_ts_header.proto";

import "common/perception/svc_functional.proto";
import "common/vehicle_in/veh_upa.proto";
import "common/vehicle_in/pwrswapstn_info.proto";
import "common/vehicle_out/psap_ui_results_eth.proto";
import "np/apps/parking/par_base.proto";
import "np/apps/parking/par_location.proto";
import "np/apps/parking/par_state_machine.proto";
import "np/apps/parking/par_semantic_map.proto";

message ParEnvInputData {
    optional bool is_received = 1;
    optional uint64 counter = 2;
    optional uint64 timestamp = 3;
    optional uint64 elapsed_time = 4;  // from last received frame
}

message ParEnvInputUssState {
    optional UsSDWStsType_e sdw_status = 1;
    optional APAStsType_e apa_status = 2;
    optional MapObjStsType_e map_obj_statue = 3;
    optional UpaSysStsType_e upa_sys_status = 4;
    optional USSMode_e  uss_mode = 5;
}

message ParEnvInputDebug {
    optional ParEnvInputData vehicle_10 = 1;
    optional ParEnvInputData vehicle_50 = 2;
    optional ParEnvInputData svc = 3;
    optional ParEnvInputData location = 4;
    optional ParEnvInputData state_machine = 5;
    optional ParEnvInputData planning_result = 6;
    optional ParEnvInputData psap_station = 7;
    optional ParEnvInputUssState uss_state = 8;
    optional SVCDetectionStatus svc_state = 9;
    optional ParFusedLocation location_info = 10;
    optional StateMachine state_machine_info = 11;
    optional uint32 planning_slot_size = 12;
    optional PsapStationInfo psap_station_info = 13;
    optional uint64 reserved_0 = 100;
    optional uint64 reserved_1 = 101;
    optional uint64 reserved_2 = 102;
    optional uint64 reserved_3 = 103;
    optional float reserved_4 = 104;
    optional float reserved_5 = 105;
    optional float reserved_6 = 106;
    optional float reserved_7 = 107;
    optional bool reserved_8 = 108;
    optional bool reserved_9 = 109;
    optional string reserved_10 = 110;
}

message ParEnvSystemDebug {
    optional NodeInfo env_app_info = 1;
    optional bool psap_mode = 2;
    optional uint64 psap_process_time = 3;
    optional bool sapa_mode = 4;
    optional uint64 sapa_process_time = 5;
    optional uint64 obj_map_process_time = 6;
    optional uint64 collision_checker_process_time = 7;
    optional uint64 slots_process_time = 8;
    optional uint64 semantic_map_process_time = 9;
    optional uint64 ego_gear = 10;
    optional float ego_speed = 11;
    optional float ego_steering = 12;
    optional bool ego_is_standstill = 13;
    optional uint64 reserved_0 = 100;
    optional uint64 reserved_1 = 101;
    optional uint64 reserved_2 = 102;
    optional uint64 reserved_3 = 103;
    optional float reserved_4 = 104;
    optional float reserved_5 = 105;
    optional float reserved_6 = 106;
    optional float reserved_7 = 107;
    optional bool reserved_8 = 108;
    optional bool reserved_9 = 109;
    optional string reserved_10 = 110;
}

enum ParEnvObjectType_e {
    kParEnvNone = 0;
    kParEnvPoint = 1;
    kParEnvSegment = 2;
    kParEnvPolygon = 3;
}

enum ParEnvObjectSource_e {
    kParEnvUncertain = 0;
    kParEnvUss = 1;
    kParEnvSvc = 2;
    kParEnvFused = 3;
    kParEnvReserve2 = 4;
}

message ParEnvObjectPoint {
    optional float x = 1;
    optional float y = 2;
}

message ParEnvObjectSegment {
    optional ParEnvObjectPoint pt1 = 1;
    optional ParEnvObjectPoint pt2 = 2;
}

message ParEnvObjectPolygon {
    repeated ParEnvObjectPoint pts = 1;
}

message ParEnvObjectInfo {
    optional ParEnvObjectType_e type = 1;
    optional ParEnvObjectSource_e src = 2;
    optional ParEnvObjectPoint pt = 3;
    optional ParEnvObjectSegment line = 4;
    optional ParEnvObjectPolygon polygon = 5;
}

message ParEnvAssociationInfo {
    optional int32 index1 = 1;
    optional int32 index2 = 2;
    optional ParEnvObjectInfo obj1 = 3;
    optional ParEnvObjectInfo obj2 = 4;
    optional int32 reserve1 = 5;
    optional int32 reserve2 = 6;
}

message ParEnvSlotObjectResult {
    optional uint32 slot_id = 1;
    optional float project_x_margin = 2;
    optional float project_y_margin = 3;
    optional ParEnvObjectInfo object_x_margin = 4;
    optional ParEnvObjectInfo object_y_margin = 5;
}

message ParEnvSlotAssembyResult {
    optional ParEnvSlotObjectResult left_corner = 1;
    optional ParEnvSlotObjectResult right_corner = 2;
    optional ParEnvSlotObjectResult curb_or_parkstop = 3;
}

message ParEnvObjectMapDebug {
    optional int32 module_state = 1;
    optional bool vehicle_state_valid = 2;
    optional bool uss_instance_valid = 3;
    optional bool uss_instance_frame_updated = 4;
    optional bool svc_instance_valid = 5;
    optional bool svc_instance_frame_updated = 6;
    optional bool is_psap_left = 7;
    optional FeatureType feature_type = 8;
    optional FeatureStatus feature_state = 9;

    optional float latest_location_odom_x = 10;
    optional float latest_location_odom_y = 11;
    optional float latest_location_odom_theta = 12;
    optional float latest_location_psap_x = 13;
    optional float latest_location_psap_y = 14;
    optional float latest_location_psap_theta = 15;

    optional uint32 uss_valid_input_num = 16;
