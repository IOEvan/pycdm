message ParEnvDebug {
    optional ParEnvInputDebug input_debug = 1;
    optional ParEnvSystemDebug system_debug = 2;
    optional ParEnvObjectMapDebug object_map_debug = 3;
    optional ParEnvSemanticMapDebug  semantic_map_debug = 4;
    optional ParEnvCollisionCheckerDebug collision_checker_debug = 5;
    optional ParEnvSlotsGenerateDebug slots_generate_debug = 6;
    optional ParEnvReserved env_reserved_debug = 7;

    // optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts = 536870907;     // publish ptp timestamp, uint in nanosec
    optional string publisher_id = 536870909;   // uuid of the publisher
    optional uint64 counter = 536870910;        // message counter
    optional uint64 publish_ts = 536870911;     // publish utc timestamp; unit : nanosecond
}
