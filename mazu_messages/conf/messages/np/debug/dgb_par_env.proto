    optional uint32 uss_increase_num = 27;

    optional uint32 fs_input_num = 28;
    optional uint32 fs_valid_num = 29;
    optional uint32 fs_timesync_state = 30;
    optional float fs_timesync_reserve = 31;
    optional uint32 fs_current_pts_num = 32;
    optional uint32 fs_reserve_type1_num = 33;
    optional uint32 fs_reserve_type2_num = 34;
    optional uint32 fs_reserve_type3_num = 35;
    optional uint32 fs_reserve_type4_num = 36;
    optional uint32 fs_reserve_type5_num = 37;

    optional uint32 od_input_num = 38;
    optional uint32 od_valid_num = 39;
    optional uint32 od_timesync_state = 40;
    optional float od_timesync_reserve = 41;
    optional uint32 od_current_object_num = 42;
    optional uint32 od_fused_objects_num = 43;
    optional uint32 od_associated_num = 44;
    repeated ParEnvAssociationInfo od_pairing = 45;
    optional uint32 od_reserve_type1_num = 46;
    optional uint32 od_reserve_type2_num = 47;
    optional uint32 od_reserve_type3_num = 48;
    optional uint32 od_reserve_type4_num = 49;
    optional uint32 od_reserve_type5_num = 50;

    repeated ParEnvAssociationInfo fusion_result = 51;

    optional uint32 roi_filtered_num = 52;
    repeated ParEnvObjectSegment roi_filtered_segments = 53;
    repeated ParEnvObjectPoint roi_filtered_points = 54;
    optional float uss_debug_float_reserve1 = 55;
    optional float uss_debug_float_reserve2 = 56;
