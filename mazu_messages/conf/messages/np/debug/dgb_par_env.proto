    optional float svc_debug_float_reserve8 = 82;
    optional float svc_debug_float_reserve9 = 83;
    optional float svc_debug_float_reserve10 = 84;
    optional int32 svc_debug_int32_reserve1 = 85;
    optional int32 svc_debug_int32_reserve2 = 86;
    optional int32 svc_debug_int32_reserve3 = 87;
    optional int32 svc_debug_int32_reserve4 = 88;
    optional int32 svc_debug_int32_reserve5 = 89;
