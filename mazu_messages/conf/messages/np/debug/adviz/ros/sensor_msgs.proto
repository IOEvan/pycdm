syntax = "proto2";

option cc_enable_arenas = true;

import "np/debug/adviz/ros/std_msgs.proto";

package ros.sensor_msgs;

message Image {
  optional ros.std_msgs.Header header = 1;
  optional uint32 height = 2;
  optional uint32 width = 3;
  optional string encoding = 4;
  optional int32 is_bigendian = 5; // originally uint8
  optional uint32 step = 6;
  optional bytes data = 7;
}

message LaserScan {
  optional ros.std_msgs.Header header = 1;
  optional float angle_min = 2;
  optional float angle_max = 3;
  optional float angle_increment = 4;
  optional float time_increment = 5;
  optional float scan_time = 6;
  optional float range_min = 7;
  optional float range_max = 8;
  repeated float ranges = 9;
  repeated float intensities = 10;
}

message PointField {
  // uint8 INT8 = 1
  // uint8 UINT8 = 2
  // uint8 INT16 = 3
  // uint8 UINT16 = 4
  // uint8 INT32 = 5
  // uint8 UINT32 = 6
  // uint8 FLOAT32 = 7
  // uint8 FLOAT64 = 8
  optional string name = 1;
  optional uint32 offset = 2;
  optional int32 datatype = 3;  // originally uint8
  optional uint32 count = 4;
}


message NavSatStatus {
  // int8 STATUS_NO_FIX = -1
  // int8 STATUS_FIX = 0
  // int8 STATUS_SBAS_FIX = 1
  // int8 STATUS_GBAS_FIX = 2
  optional sint32 status = 1; // originally int8
  // uint16 SERVICE_GPS = 1
  // uint16 SERVICE_GLONASS = 2
  // uint16 SERVICE_COMPASS = 4
  // uint16 SERVICE_GALILEO = 8
  optional int32 service = 2; // originally uint16
}