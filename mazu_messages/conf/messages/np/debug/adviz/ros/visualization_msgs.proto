syntax = "proto2";

option cc_enable_arenas = true;

import "np/debug/adviz/ros/builtins.proto";
import "np/debug/adviz/ros/geometry_msgs.proto";
import "np/debug/adviz/ros/std_msgs.proto";

package ros.visualization_msgs;

message Marker {
  // uint8 ARROW = 0
  // uint8 CUBE = 1
  // uint8 SPHERE = 2
  // uint8 CYLINDER = 3
  // uint8 LINE_STRIP = 4
  // uint8 LINE_LIST = 5
  // uint8 CUBE_LIST = 6
  // uint8 SPHERE_LIST = 7
  // uint8 POINTS = 8
  // uint8 TEXT_VIEW_FACING = 9
  // uint8 MESH_RESOURCE = 10
  // uint8 TRIANGLE_LIST = 11
  // uint8 ADD = 0
  // uint8 MODIFY = 0
  // uint8 DELETE = 2
  // uint8 DELETEALL = 3
  optional ros.std_msgs.Header header = 1;
  optional string ns = 2;
  optional int32 id = 3;
  optional int32 type = 4;
  optional int32 action = 5;
  optional ros.geometry_msgs.Pose pose = 6;
  optional ros.geometry_msgs.Vector3 scale = 7;
  optional ros.std_msgs.ColorRGBA color = 8;
  optional ros.Duration lifetime = 9;
  optional bool frame_locked = 10;
  repeated ros.geometry_msgs.Point points = 11;
  repeated ros.std_msgs.ColorRGBA colors = 12;
  optional string text = 13;
  optional string mesh_resource = 14;
  optional bool mesh_use_embedded_materials = 15;
}

message ImageMarker {
  // uint8 CIRCLE = 0
  // uint8 LINE_STRIP = 1
  // uint8 LINE_LIST = 2
  // uint8 POLYGON = 3
  // uint8 POINTS = 4
  // uint8 ADD = 0
  // uint8 REMOVE = 1
  optional ros.std_msgs.Header header = 1;
  optional string ns = 2;
  optional int32 id = 3;
  optional int32 type = 4;
  optional int32 action = 5;
  optional ros.geometry_msgs.Point position = 6;
  optional float scale = 7;
  optional ros.std_msgs.ColorRGBA outline_color = 8;
  optional int32 filled = 9; // originally uint8
  optional ros.std_msgs.ColorRGBA fill_color = 10;
  optional ros.Duration lifetime = 11;
  repeated ros.geometry_msgs.Point points = 12;
  repeated ros.std_msgs.ColorRGBA outline_colors = 13;
}


