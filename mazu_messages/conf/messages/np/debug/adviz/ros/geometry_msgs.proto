syntax = "proto2";

option cc_enable_arenas = true;

import "np/debug/adviz/ros/std_msgs.proto";

package ros.geometry_msgs;

message Point {
  optional double x = 1;
  optional double y = 2;
  optional double z = 3;
}

message Point32 {
  optional float x = 1;
  optional float y = 2;
  optional float z = 3;
}

message Quaternion {
  optional double x = 1;
  optional double y = 2;
  optional double z = 3;
  optional double w = 4;
}

message Pose {
  optional Point position = 1;
  optional Quaternion orientation = 2;
}

message PoseStamped {
  optional ros.std_msgs.Header header = 1;
  optional Pose pose = 2;
}

message Vector3 {
  optional double x = 1;
  optional double y = 2;
  optional double z = 3;
}

message Transform {
  optional Vector3 translation = 1;
  optional Quaternion rotation = 2;
}

message TransformStamped {
  optional ros.std_msgs.Header header = 1;
  optional string child_frame_id = 2;
  optional Transform transform = 3;
}

message Polygon {
  repeated Point32 points = 1;
}