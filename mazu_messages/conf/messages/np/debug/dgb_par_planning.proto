syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages.debug;
// import "common/perf/sensor_ts_header.proto";

import "np/apps/parking/par_base.proto";
import "np/apps/parking/par_planning.proto";
import "np/apps/parking/par_location.proto";

message ReplanDbgOut {
    optional ParPoint replan_start_pt = 1;
    optional ParPoint replan_end_pt = 2;
    optional float replan_start_pt_theta = 3;
    optional float replan_end_pt_theta = 4;
    optional string replan_reason = 5;
    optional bool is_replan_fail = 6;
    optional string failed_segment = 7;
    optional string failed_point = 8;
    enum ReplanFailReason {
        ReplanFailReason_Unknown = 0;
        ReplanFailReason_OutBound = 1;
        ReplanFailReason_CollisionCheckFailed = 2;
        ReplanFailReason_PointAXLarge = 3;
        ReplanFailReason_PointBAngleWrong = 4;
        ReplanFailReason_Cnt4Collide = 5;
        ReplanFailReason_RadiusBCTooSmall = 6;
        ReplanFailReason_RadiusBCTooLarge = 7;
    }
    optional ReplanFailReason fail_reason = 9;
    enum ExceedWhichBound {
        ExceedWhichBound_Unknown = 0;
        ExceedWhichBound_Outside = 1;
        ExceedWhichBound_InsideLeft = 2;
        ExceedWhichBound_InsideRight = 3;
    }
    optional ExceedWhichBound exceeded_bound = 10;
    enum CollisionPoint {
        CollisionPoint_Unknown = 0;
        CollisionPoint_FrontLeft = 1;
        CollisionPoint_RearLeft = 2;
        CollisionPoint_FrontRight = 3;
        CollisionPoint_RearRight = 4;
    }
    optional CollisionPoint collide_pt = 11;
}

message TrajCropDbgOut {
    optional ParPoint traj_start_pt = 1;
    optional ParPoint traj_end_pt = 2;
    optional float traj_start_pt_theta = 3;
    optional float traj_end_pt_theta = 4;
    optional string traj_segment = 5;
    optional float cur_index = 6;
    optional bool is_start_cropped = 7;
    optional bool is_end_cropped = 8;
    optional bool is_estop = 9;
    enum CropReason {
        CropReason_Unknown = 0;
        CropReason_WalkOver = 1;
        CropReason_InCollision = 2;
        CropReason_LocationChange = 3;
    }
    optional CropReason crop_reason = 10;
    optional ParLocation curr_location = 11;
}

message InputSignalDbgOut {
    optional bool has_state_machine = 1;
    optional bool has_veh10ms = 2;
    optional bool has_veh50ms = 3;
    optional bool has_location = 4;
    optional bool has_collision_dst = 5;
    optional bool has_obj_map = 6;
    optional bool has_ads = 7;
}

message OutputSignalDbgOut {
    optional bool exist_geo_traj = 1;
    optional bool exist_cropped_traj = 2;
    optional bool exist_tx_traj = 3;
    optional ParkingTrajectory geo_traj = 4;
    optional ParkingTrajectory cropped_traj = 5;
    optional ParkingTrajectory tx_traj = 6;
}

message ParkingFinishDbgOut {
    optional bool is_finish = 1;
    optional ParPoint finished_pt = 2;
    optional float finished_pt_theta = 3;
    enum FinishError {
        FinishError_Unknown = 0;
        FinishError_ControlNotReached = 1;
        FinishError_ControlWentTooFar = 2;
        FinishError_OnLeftSide = 3;
        FinishError_OnRightSide = 4;
    }
    optional FinishError finish_error = 4;
}

message ParkingStatusDbgOut {
    optional ParPoint cur_pt = 1;
    optional float cur_pt_theta = 2;
    enum PlanningAppStatus {
        PlanningAppStatus_Unknown = 0;
        PlanningAppStatus_NoNewTraj = 1;
        PlanningAppStatus_HasNewTraj = 2;
        PlanningAppStatus_Finished = 3;
        PlanningAppStatus_Reset = 4;
    }
    optional PlanningAppStatus status = 3;
}

