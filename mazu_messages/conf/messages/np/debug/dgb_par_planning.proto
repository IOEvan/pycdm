message PlanningDebugOut {
    optional ReplanDbgOut dbg_replan = 1;
    optional TrajCropDbgOut dbg_traj_crop = 2;
    optional InputSignalDbgOut dbg_input_sig = 3;
    optional OutputSignalDbgOut dbg_output_sig = 4;
    optional ParkingFinishDbgOut dbg_finish = 5;
    optional ParkingStatusDbgOut dbg_status = 6;
    optional ReservedPlanningDbgOut dbg_planning_rsvd = 7;
    optional ParkingSlotInfoDbgOut dbg_planning_slot_info = 8;

    // optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts = 536870907;     // publish ptp timestamp, uint in nanosec
    optional string publisher_id = 536870909;   // uuid of the publisher
    optional uint64 counter = 536870910;        // message counter
    optional uint64 publish_ts = 536870911;     // publish utc timestamp; unit : nanosecond
}

message ParkingSlotInfoDbgOut {
    optional ParPoint curb_internal_pt1 = 1;
    optional ParPoint curb_internal_pt2 = 2;
    optional ParPoint wall_internal_pt1 = 3;
    optional ParPoint wall_internal_pt2 = 4;
    optional ParPoint left_corner_pt1 = 5;
    optional ParPoint left_corner_pt2 = 6;
    optional ParPoint right_corner_pt1 = 7;
    optional ParPoint right_corner_pt2 = 8;
    optional ParPoint dbg_planning_reserved_9 = 9;
    optional ParPoint dbg_planning_reserved_10 = 10;
    optional ParPoint dbg_planning_reserved_11 = 11;
    optional ParPoint dbg_planning_reserved_12 = 12;
}