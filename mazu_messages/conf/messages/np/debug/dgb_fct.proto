}

enum FuncSts  {                   // status 	of function
  OFF      = 0;                   // app not loaded // not in BL07X
  LOADED   = 1;                   // app loaded, but not doing anything
  CHECKING = 2;                   // app loaded and conducting self-checks
  STANDBY  = 3;                   // app loaded, no inhibit, within ODD
  RUNNING  = 4;                   // function running
};

enum FuncArbReqSts_e  {           // status 	of function
  REQ_OFF      = 0;                   // app not loaded // not in BL07X
  REQ_LOADED   = 1;                   // app loaded, but not doing anything
  REQ_CHECKING = 2;                   // app loaded and conducting self-checks
  REQ_STANDBY  = 3;                   // app loaded, no inhibit, within ODD
  REQ_RUNNING  = 4;                   // function running
};

enum FuncArbSts_e  {                   // status 	of function
  FUNC_OFF      = 0;                   // app not loaded // not in BL07X
  FUNC_LOADED   = 1;                   // app loaded, but not doing anything
  FUNC_CHECKING = 2;                   // app loaded and conducting self-checks
  FUNC_STANDBY  = 3;                   // app loaded, no inhibit, within ODD
  FUNC_RUNNING  = 4;                   // function running
};

enum ELKFAMSts_e  {                   // status 	of function
  eFAMChecking  = 0;                   // app not loaded // not in BL07X
  eFAMStdby     = 1;                   // app loaded, but not doing anything
  eFAMActv      = 2;                   // app loaded and conducting self-checks
};

