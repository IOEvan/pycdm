syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

import "common/localization/geometry.proto";

// Map offset
message MapOffset {
    optional LocVector3 position = 1;  
    optional LocQuaternion orientation = 2;  // orientation of the sensor in the local ENU frame.
}

// Prior Height
message PriorHeightResult {
  optional float prior_height = 1;
  optional uint32 source = 2; // 0：invalid，1：Cloud height，2：Strong Semantic Height，3：Topo Height
}

// Match Info
message LidarMapMatchInfo {
  reserved 9;
  optional int32 measure_stauts = 1; // 0-Normal, 1-FewerAssociatedPair ...
  optional int32 measure_cells_count = 2; 
  optional int32 valid_associated_pair_count = 3;
  optional int32 match_iteration_count = 4;
  optional float confidence = 5;
  optional bytes extended_info = 6;
  optional int32 valid_associated_horizon_pairs = 7;
  optional int32 valid_associated_vertical_pairs = 8;
  optional int32 locally_map_status = 10; // 0:Normal, 1:non-map-covered areas for significant range
  optional int32 locally_loc_status = 11; // 0:Normal, 1:not stable, 2: failed for significant range
  optional int32 request_dlb_upload = 12; //0:false, 1: true
  optional int32 reset_type = 13; //0:do nothing, 1: xyz, 2:xy, 3:x, 4:y, 5:z
}

message LidarMapConsistCheckResult {
    optional uint64 id = 1;
    optional uint64 result = 2;  // 0-unknonw 1-consistent 2-inconsistent
    optional uint64 reason = 3;  
}

message SE3Pose {
  /// Timestamps.
  optional uint64 timestamp_us     = 1;  // global timestamp in nanosecond, maybe UTC time
  optional uint64 timestamp_ptp_ns = 2;  // ptp timestamp in nanosecond

  // Message Header.
  optional int32 status = 3;    // 0-invalid, 1-valid.
  optional int32 type = 4;      // 0-HDMapMatch, 1-LidarMapMatch, 2-SemanticMatch.
  optional string frame = 5;    // e.g. "eq4", "pandar128"
  optional string message = 6;  // Reserved message. e.g. version or debug info.

  // SE3 pose.
  optional LocVector3 position = 7;        // Longitude [deg], latitude [deg], and Height [m].
  optional LocQuaternion orientation = 8;  // orientation of the sensor in the local ENU frame.

  // Covariance
  repeated double covariance = 9;  // 6x6 covariance matrix in order of [position, orientation]. [column-major]

  optional float confidence = 10;  // Reserved confidence value in [0.0f, 1.0f].

  // Map zone information
  enum MapZoneInfo {
    GENERAL = 0;
    PSP = 1;              // power swap pilot
    HD_NAVIGATION = 2;    // Charging point navigation
    HD_PILOT = 3;         // Charging point pilot
    AVP = 4;              // AVP
  }
  optional MapZoneInfo map_zone_info = 11; 

  // Auxiliary Map Matching Info
  message AuxiliaryParkingInfo {
    optional int32 is_in_map_area = 1;      // Whether in low-speed localization area
    optional int32 lidar_mm_status = 2;     // Lidar map matching status
    optional int32 svc_mm_status = 3;       // SVC map matching status
    optional string station_id = 4; // device id of power swap station (PS) or charging station (CS), example PS-NIO-e087aa69-3e64310e
    optional string map_id = 5; // UID of parking-lot (Downtown) or service station (in Highway), example  PK-Downtown-0bd281f1-e4e50d69
  }
  optional AuxiliaryParkingInfo auxiliary_parking_info = 12;  
  optional MapOffset map_offset = 13; 
  optional LocVector3 map_origin = 14;

  optional LidarMapMatchInfo lidar_match_info = 15;    
  repeated LidarMapConsistCheckResult lidar_map_consist_check_results = 16;
  optional int32 global_floor_id = 17;
  optional float cross_layer_proportion = 18;
  optional PriorHeightResult prior_height = 19;

  message ReLocInfo{
    optional int32 module_status = 1; // = 0 normal operation
                                      // 1 non-triggered;
    optional int32 result_status = 2; // = 0 success
                                      // 1 Failed due to out-of-distance;
                                      // 2 Failed due to out-of-time;
                                      // 3 Failed due to hdmap covered;
                                      // 4 Failed due to lack of perception;
    optional int32 trigger_reason = 3; // Modules that issue triggers
    optional string module_type = 4; // Defaults to "reloc_info"
    optional uint64 trigger_time_ptp = 5; // trigger time, Globally defined ptp time. [nano second]
    optional uint64 success_time_ptp = 6; // success time, Globally defined ptp time. [nano second]
    optional LocVector3 trigger_position = 7; // trigger_position, Longitude [degree], latitude [degree], and altitude [m].
    optional LocQuaternion trigger_quaternion = 8; // trigger_quaternion, 3 DoFs attitude under local ENU frame, expressed using quaternion.
    optional LocVector3 position = 9; // Longitude [degree], latitude [degree], and altitude [m].
    optional LocQuaternion quaternion = 10; // 3 DoFs attitude under local ENU frame, expressed using quaternion.
  }
  optional ReLocInfo reloc_info = 20;

  optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin 
  optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
  optional uint64 publish_ptp_ts   = 536870907;  // publish ptp timestamp, uint in nanosecond
  optional uint64 publish_ts       = 536870911;  // publish utc timestamp, unit in nanosecond
  optional string publisher_id     = 536870909;  // uuid of the publisher
  optional uint64 counter          = 536870910;  // message counter
}
