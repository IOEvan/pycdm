syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;

message LocQuaternion {
  optional double x = 1;
  optional double y = 2;
  optional double z = 3;
  optional double w = 4;
}

// Rotation order: R = R_z{yaw} * R_y{pitch} * R_x{roll}
message LocEulerAngle {
  optional double roll = 1;  // Rotation angle around the x-axis. [radian]
  optional double pitch = 2; // Rotation angle around the y-axis. [radian]
  optional double yaw = 3;   // Rotation angle around the z-axis. [radian] [counterclockwise positive]
}

message LocVector3 {
  optional double x = 1;
  optional double y = 2;
  optional double z = 3;
}