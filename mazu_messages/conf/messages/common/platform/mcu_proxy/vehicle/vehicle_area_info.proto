syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";


enum VehicleLocType {
    //运营商信息（车辆实际所在地）
    VEHICLE_LOC_TYPE_UNKNOWN = 0;
    VEHICLE_LOC_TYPE_CN = 1;
    VEHICLE_LOC_TYPE_EU = 2;
    VEHICLE_LOC_TYPE_UAE = 3;
}

enum FirmwareLocType {
    //版本信息（车辆销售目标所在地）与variant config一致
    FIRMWARE_LOC_TYPE_UNKNOWN = 0;
    FIRMWARE_LOC_TYPE_CN = 1;
    FIRMWARE_LOC_TYPE_EU = 2;
    FIRMWARE_LOC_TYPE_UAE = 3;
}

enum CertsLocType {
    //证书（数据上传的链路）
    CERTS_LOC_TYPE_UNKNOWN = 0;
    CERTS_LOC_TYPE_CN = 1;
    CERTS_LOC_TYPE_EU = 2;
    CERTS_LOC_TYPE_UAE = 3;
}

message VehicleAreaInfoDetail {
    optional VehicleLocType vehicle_area_info = 1; //运营商信息（车辆实际所在地
    optional FirmwareLocType firmware_area_info = 2; //版本信息（车辆销售目标所在地）
    optional CertsLocType certs_area_info = 3; //证书（数据上传的链路）

    optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin   
    optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts = 536870907;     // publish ptp timestamp, uint in nanosec
    optional string publisher_id = 536870909; // uuid of the publisher
    optional uint64 counter = 536870910;         // message counter
    optional uint64 publish_ts = 536870911;    // publish utc timestamp; unit : nanosecond


}
