syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

message VehicleId {
    optional bool is_vid_valid = 1; // 0 - invalid; 1 - valid
    optional string vid = 2; // the vehicle id cannot be get when certs is not installed
}

enum VeicleCertsType {
    DevCerts = 0; // develop environment certs
    TestCerts = 1; // test environment certs
    StgCerts = 2; // stg environment certs
    ProdCerts = 3; // production environment certs
}

message VehicleCerts {
    optional bool is_certs_installed = 1; // 0 - not installed; 1 - installed
    optional VeicleCertsType certs_type = 2; // vehicle certs type; vid is different under different certs for the same vehicle
}

message VehicleIdentifierResp {
    optional VehicleCerts vehicle_certs = 1;
    optional VehicleId  vehicle_id = 2;

    optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin   
    optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts = 536870907;     // publish ptp timestamp, uint in nanosec
    optional string publisher_id = 536870909; // uuid of the publisher
    optional uint64 counter = 536870910;         // message counter
    optional uint64 publish_ts = 536870911;    // publish utc timestamp; unit : nanosecond

}