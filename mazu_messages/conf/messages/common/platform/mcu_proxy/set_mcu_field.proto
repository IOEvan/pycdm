syntax = "proto2";

option cc_enable_arenas = true;
import "common/platform/mcu_proxy/mcu_field_common.proto";
import "common/platform/mcu_proxy/mcu_proxy_common.proto";
package nio.ad.messages;

message SetMcuFieldReq {
  optional TargetMcu target_mcu = 1;  // target mcu(MCU1 or MCU2)
  optional FieldType field_type = 2;
  optional Fields fields = 3;
}

message SetMcuFieldResp {
  optional TargetMcu target_mcu = 1;
  optional FieldType field_type = 2;
  optional ErrorCode error_code = 3;
}
