syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

message PowerSwapBookEvent {
  required string power_swap_station_uid = 1;
  optional double lon = 2;
  optional double lat = 3;
  optional uint32 power_swap_station_type = 4; //0-未知类型，1-一代站，2-二代站
  optional uint32 service_area_avail_status_co = 5; //区分未开站伴生/功能
}
message PowerSwapBookCancelEvent {
  required string power_swap_station_uid = 1;
  optional double lon = 2;
  optional double lat = 3;
  optional uint32 power_swap_station_type = 4; //0-未知类型，1-一代站，2-二代站
  optional uint32 service_area_avail_status_co = 5; //区分未开站伴生/功能
}
message PowerSwapOrderSuccessEvent {
  required string power_swap_station_uid = 1;
  optional double lon = 2;
  optional double lat = 3;
  optional uint32 queue_number = 4; // number of user waiting before us
  optional double predict_waiting_time = 5;
  optional uint32 power_swap_station_type = 6; //0-未知类型，1-一代站，2-二代站
  optional uint32 service_area_avail_status_co = 7; //区分未开站伴生/功能
}
message PowerSwapOrderFailEvent {
  enum FailReason {
    UNKNOWN = 0;
  }
  required string power_swap_station_uid = 1;
  optional double lon = 2;
  optional double lat = 3;
  optional FailReason fail_reason = 4;
  optional uint32 power_swap_station_type = 5; //0-未知类型，1-一代站，2-二代站
  optional uint32 service_area_avail_status_co = 6;//区分未开站伴生/功能
}
message PowerSwapOrderPreCallEvent {
  required string power_swap_station_uid = 1;
  optional double lon = 2;
  optional double lat = 3;
  optional uint32 queue_number = 4; // number of user waiting before us
  optional double predict_waiting_time = 5;  
  optional uint32 power_swap_station_type = 6; //0-未知类型，1-一代站，2-二代站  
  optional uint32 service_area_avail_status_co = 7;  //区分未开站伴生/功能
}
message PowerSwapOrderCallEvent {
  required string power_swap_station_uid = 1;
  optional double lon = 2;
  optional double lat = 3;
  optional uint32 power_swap_station_type = 4; //0-未知类型，1-一代站，2-二代站
  optional uint32 service_area_avail_status_co = 5;//区分未开站伴生/功能
}
message PowerSwapOrderOverDueEvent {
  required string power_swap_station_uid = 1;
  optional double lon = 2;
  optional double lat = 3;
  optional uint32 power_swap_station_type = 4; //0-未知类型，1-一代站，2-二代站
  optional uint32 service_area_avail_status_co = 5;//区分未开站伴生/功能
}
message PowerSwapOrderCancelEvent {
  enum CancelReason {
    USER_CANCEL = 0;
    TIMEOUT = 1;
  }
  required string power_swap_station_uid = 1;
  optional double lon = 2;
  optional double lat = 3;
  optional CancelReason cancel_reason = 4;
  optional uint32 power_swap_station_type = 5; //0-未知类型，1-一代站，2-二代站
  optional uint32 service_area_avail_status_co = 6;//区分未开站伴生/功能
}
message PowerSwapRouteProgressEvent {
  required string power_swap_station_uid = 1;
  optional double lon = 2;
  optional double lat = 3;
  optional uint32 power_swap_station_type = 4; //0-未知类型，1-一代站，2-二代站
  optional double route_distance_to_power_swap_station = 5; // unit: m，距离可能不精确，只能做粗略判断
  optional uint32 service_area_avail_status_co = 6;//区分未开站伴生/功能
}
message PowerSwapServiceAreaAvailableStatus {
  optional string power_swap_station_uid = 1;
  optional uint32 service_area_avail_status = 2;
  optional uint32 service_area_unavail_reason = 3;
}

message PowerSwapServiceAreaDriveAwayStatus {
  enum DriveAwayAction {
    INIT = 0;
    DRIVE_AWAY_ACTION = 1;
    NO_DRIVE_AWAY_ACTION = 2;
  }
  optional string power_swap_station_uid = 1;
  optional DriveAwayAction service_area_drive_away_action = 2;
  optional uint32 service_area_avail_status_co = 3;//区分未开站伴生/功能
}

message PowerSwapOrderConnectionAreaAvailableEvent {
  required string power_swap_station_uid = 1;
  optional double lon = 2;
  optional double lat = 3;
  optional uint32 power_swap_station_type = 4; //0-未知类型，1-一代站，2-二代站
  optional uint32 service_area_avail_status_co = 5;//区分未开站伴生/功能
  optional float station_front_space_parallel_dir_dst = 6; // d2
  optional float station_front_space_perpendicular_dir_dst = 7; // d1
}

message PowerSwapPilotEvent {
  optional uint64 timestamp = 1;   // in ns
  oneof event {
    PowerSwapBookEvent book_event = 2;
    PowerSwapBookCancelEvent cancel_book_event = 3;
    PowerSwapOrderSuccessEvent confirm_event = 4;
    PowerSwapOrderFailEvent fail_event = 5;
    PowerSwapOrderPreCallEvent pre_call_event = 6;
    PowerSwapOrderCallEvent call_event = 7;
    PowerSwapOrderOverDueEvent over_due_event = 8;
    PowerSwapOrderCancelEvent cancel_event = 9;
    PowerSwapRouteProgressEvent route_progress_event = 10;
    PowerSwapServiceAreaAvailableStatus service_area_available_status = 11;
    PowerSwapServiceAreaDriveAwayStatus service_area_drive_away_status = 12;
    PowerSwapOrderConnectionAreaAvailableEvent  connect_event = 13; // 新增：二次叫号前允许前往换电站定位框或衔接区
  }

  optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
  optional uint64 publish_ptp_ts = 536870907; // publish ptp timestamp, uint in nanosec
  optional string publisher_id = 536870909;  // uuid of the publisher
  optional uint64 counter = 536870910;       // message counter
  optional uint64 publish_ts = 536870911;    // publish utc timestamp; unit : nanosecond
}
