syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

message NopChassisControl {		// broadcast cycle time: 20ms
    optional float nop_vlc_tar_acceleration = 1;
    optional bool nop_vlc_drive_off_req = 2;
    optional bool nop_vlc_decel_to_stop_req = 3;
    optional float nop_vlc_max_jerka = 4;
    optional float nop_vlc_min_jerka = 5;
    optional float nop_pinion_angle_request= 6;
    optional uint32 psp_llc_ControlModeRequest = 7;
    optional float psp_llc_StopDistance = 8;
    optional float psp_llc_TargetSpeed = 9;
    optional uint32 psp_llc_TargetGearRequest = 10;
    optional uint32 psp_llc_FunctionSelection = 11;
    optional uint32 psp_llc_FunctionState = 12;
    optional uint32 psp_llc_ShutdownModeRequest = 13;

    repeated float reserved             = 99;
    
    optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin     
    optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts   = 536870907;   //publish ptp timestamp, uint in nanosec
    optional string publisher_id	= 536870909;	// uuid of the publisher  
    optional uint64 counter 	= 536870910;	// message counter
    optional uint64 publish_ts 	= 536870911;	// publish timestamp; unit : nanosecond
}

