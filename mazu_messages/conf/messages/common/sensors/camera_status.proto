syntax = "proto2"; 
option cc_enable_arenas = true;
       // the first line of a proto message
package nio.ad.messages; 
import "common/perf/sensor_ts_header.proto";

message CameraStatus{

        optional CamStatus front120_Status     =1;
        optional CamStatus front30_Status      =2;
        optional CamStatus rear_Status         =3;
        optional CamStatus dms_Status          =4;
        optional CamStatus svc_front_Status    =5;
        optional CamStatus svc_rear_Status     =6;
        optional CamStatus svc_left_Status     =7;
        optional CamStatus svc_right_Status    =8;
        optional CamStatus side_fl_Status      =9;
        optional CamStatus side_fr_Status      =10;
        optional CamStatus side_rl_Status      =11;
        optional CamStatus side_rr_Status      =12;
        optional CamStatus front120_sharing_Status      =13;
       
        enum CamStatus{
            off                 = 0; 
            initializing        = 1;
            standby             = 2;
            streaming           = 3;
            calibration         = 4;
            streaming_in_fault  = 5;
            fault_shutdown      = 6;
            overtemp_shutdown   = 7;
            resetting           = 8;
            }

        optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin 
        optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
        optional uint64 publish_ptp_ts = 536870907; //publish ptp timestamp, uint in nanosec
        optional string publisher_id = 536870909; // uuid of the publisher
        optional uint64 counter = 536870910;         // message counter
        optional uint64 publish_ts = 536870911;    // publish timestamp; unit : nanosecond
} 