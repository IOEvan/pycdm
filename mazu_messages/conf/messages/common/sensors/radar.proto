syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;

import "common/sensors/radar_u360_tracker.proto";
import "common/sensors/radar_road_boundary.proto";
import "common/sensors/radar_status.proto";
import "common/sensors/radar_detection.proto";

message HeaderInfo {
  required uint64 fusion_timestamp = 1;
  required uint32 fusion_index = 2;
  repeated uint64 radar_timestamp = 3;     // Five radar timestamp to this fusion look;
  repeated uint32 radar_lookIndex = 4;
}

message View {
    // required ViewHeader header = 1;
    required HeaderInfo header = 1;
    required ViewSource source = 2;   // for radar source = 2;

    // fusion tracks;
    required FusionTrack fusion_tracker = 3;

    // ACC and AEB target selection tracker ID;
    required TargetSelection sel_tar = 4;

    // radar fused barriers;
    required RoadBoundary road_boundary = 5;

    // radar detections;
    required RadarDetections rad_dets = 6;

    // Radar faults reporting;
    required RadarFaultStatus rads_fail = 7;

    enum ViewSource {
      VIEWSOURCE_VISION = 0;//the view is generated from vision detection
      VIEWSOURCE_LIDAR = 1;//the view is generated from lidar detection
      VIEWSOURCE_RADAR = 2;//the view is generated from radar detection, in this case, radar is the source.
      VIEWSOURCE_USS = 3;//the view is generated from USS detection
      VIEWSOURCE_SVC = 4;//the view is generated from surrond view camera detection
      VIEWSOURCE_FUSION = 5;//the view is generated by fusing views from different sensors
    };
}


