syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

message MrrAlignmentState {
  optional float mrr_align_hori_ang    = 1;                 // Radar horizontal misalignment angle; unit: rad
  optional uint32 mrr_align_hori_qf_   = 2;                 // Radar horizontal misalignment angle quality factor
  optional float mrr_align_vert_ang    = 3;                 // Radar vertical misalignment angle; unit: rad
  optional uint32 mrr_align_vert_qf    = 4;                 // Radar vertical misalignment angle quality facotr
  optional uint32 mrr_align_hori_sts   = 5;                 // Radar horizontal misalignment status
  optional uint32 mrr_align_hori_state = 6;                 // Radar horizontal misalignment state
  optional uint32 mrr_align_vert_sts   = 7;                 // Radar vertical misalignment status
  optional uint32 mrr_align_vert_state = 8;                 // Radar vertical misalignment state
}

message SrrAlignmentState {
  optional float srr_align_hori_ang    = 1;                 // Radar horizontal misalignment angle; unit: rad
  optional uint32 srr_align_hori_qf_   = 2;                 // Radar horizontal misalignment angle quality factor
  optional float srr_align_vert_ang    = 3;                 // Radar vertical misalignment angle; unit: rad
  optional uint32 srr_align_vert_qf    = 4;                 // Radar vertical misalignment angle quality facotr
  optional uint32 srr_align_hori_sts   = 5;                 // Radar horizontal misalignment status
  optional uint32 srr_align_hori_state = 6;                 // Radar horizontal misalignment state
  optional uint32 srr_align_vert_sts   = 7;                 // Radar vertical misalignment status
  optional uint32 srr_align_vert_state = 8;                 // Radar vertical misalignment state
}

message RadarAlignmentMessages {
  optional MrrAlignmentState mrr_align    = 1;               // MRR alignment status message
  optional SrrAlignmentState srr_fl_align = 2;               // SRR-FL alignment status message
  optional SrrAlignmentState srr_fr_align = 3;               // SRR-FR alignment status message
  optional SrrAlignmentState srr_rl_align = 4;               // SRR-RL alignment status message
  optional SrrAlignmentState srr_rr_align = 5;               // SRR-RR alignment status message

  optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin 
  optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
  optional uint64 publish_ptp_ts = 536870907;     // publish ptp timestamp, uint in nanosec
  optional string publisher_id = 536870909; // uuid of the publisher
  optional uint64 counter    = 536870910;                    // message counter
  optional uint64 publish_ts = 536870911;                    // publish utc timestamp; unit : nanosecond
}