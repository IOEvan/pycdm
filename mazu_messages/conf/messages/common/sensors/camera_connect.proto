syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;

message CameraConnectReq {
  required string consumer_name = 1;    // The name of the consumer which is requesting to connect.
  repeated string cameras = 2;    // The list of the cameras which the consumer wants to receive frames from.
  repeated uint32 status = 3;    // The list of the camera status.
}

message CameraConnectRes {
  required bool success = 1; // The flags to show which values are valid in this GPS frame.
  optional string producer_name = 2;    // The name of the producer which is reponsing to connect.
  repeated string cameras = 3;    // The list of the cameras which the producer responses.
  repeated uint32 status = 4;    // The list of the camera status.
}

message CameraDisconnectReq {
  required string consumer_name = 1;    // The name of the consumer which is requesting to disconnect 
  repeated string cameras = 2;    // The list of the cameras which the consumer wants to receive frames from.
  repeated uint32 status = 3;    // The list of the camera status.
}

message CameraDisconnectRes {
  required bool success = 1; // The flags to show which values are valid in this GPS frame.
  optional string producer_name = 2;    // The name of the producer which is reponsing to disconnect.
  repeated string cameras = 3;    // The list of the cameras which the producer responses.
  repeated uint32 status = 4;    // The list of the camera status.
}
