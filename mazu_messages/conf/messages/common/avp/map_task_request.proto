syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

message MapTaskRequest {
    enum TaskType {
        IN_CAR_MAPPING = 0;
        AVP_MAPPING = 1;
        AO = 2;
        VIEW = 3; //reserved
        DLB = 4;
	HDMAP_ISSUE = 5;
    }

    message MapTaskProperty {   
        optional TaskType type = 1;
        optional string   result_file_paths = 2;  // 
        optional uint64   max_file_size     = 3;  // file size
        optional uint64   max_file_count    = 4;  // file count
        optional string   mapping_config    = 5;
    }

    enum ActionType {
        MAPPING_START = 0;
        MAPPING_END = 1;
        MAPPING_CANCEL = 2;
    }    

    optional uint64 timestamp_utc_ns = 1; // Globally defined utc tiem. [nano sec]
    optional uint64 timestamp_ptp_ns = 2; // Globally defined ptp time. [nano second]

    optional string task_id        = 3;   
    optional string map_id         = 4;  // power station id
    optional ActionType action     = 5;  // start, cancel, delete...    
    optional MapTaskProperty prop  = 6; // task prop

    optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
    optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts = 536870907;   // publish ptp timestamp, uint in nanosec
    optional string publisher_id   = 536870909;     // uuid of the publisher
    optional uint64 counter        = 536870910;          // message counter
    optional uint64 publish_ts     = 536870911;       // publish utc timestamp; unit : nanosecond
    
}
