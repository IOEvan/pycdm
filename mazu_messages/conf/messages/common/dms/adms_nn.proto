syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";
import "common/dms/dms_feature.proto";
import "common/perception/multisource_object.proto";
import "np/apps/ehy_obf_outputs.proto";

message ADMSPredPostProcess{
    optional bool cutin_status                    = 1;
    optional bool crash_status                    = 2;
    optional bool keep_in_ego_lane                = 3;
    optional float crash_time                     = 4;
    optional uint32 lane_chg_sts                  = 5;
}

message ADMSObjPred{
    optional uint32 id                            = 1;
    optional DynObject.ObjClass obj_class         = 2;
    repeated PredictionTrajectory pred_traj       = 3;
    optional ADMSPredPostProcess post_process_res = 4;
}

message ADMSNN {
    optional float ttc_res                                       = 1;
    optional bool ttc_is_risk                                    = 2;
    optional uint32 ttc_risk_trigger_reason                      = 3;
    optional float ttc_threshold                                 = 4;
    optional uint32 ttc_risk_obj_id                              = 5;
    repeated ADMSObjPred obj_preds                               = 6;

    optional uint64 nn_start_time                                = 101;
    optional DMS_TopicTime rec_ehy_obf                           = 102;
    optional DMS_TopicTime rec_veh10ms                           = 103;
    optional DMS_TopicTime rec_dms_result                        = 104;
    optional DMS_TopicTime rec_road_det                          = 105;

    optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin 
    optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts    = 536870907; // publish ptp timestamp unit : nanosecond
    optional string publisher_id      = 536870909; // uuid of the publisher
    optional uint64 counter           = 536870910; // message counter
    optional uint64 publish_ts        = 536870911; // publish timestamp; unit : nanosecond
}