syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

message CdmObjectInfo {
    optional int32 id                           = 1;
    optional float threshold                    = 2;
    repeated float embedding                    = 3;
}

message CdmImageInfo {
    optional int32  id                          = 1;
    optional float  threshold                   = 2;
    optional string data_format                 = 3;        // ".png", ".jpg"
    optional bytes  data                        = 4;        // imencode data
}

message CdmTaskInfo {
    optional string model_name                  = 1;
    optional int32  sensor_id                   = 2;
    repeated CdmObjectInfo object_info          = 3;
    repeated CdmImageInfo image_info            = 4;
    map<string, bytes> extend_info              = 5;
    map<string, bytes> debug_info               = 6;

    optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
    optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts              = 536870907;
    optional string publisher_id                = 536870909;
    optional uint64 counter                     = 536870910;
    optional uint64 publish_ts                  = 536870911;
}
