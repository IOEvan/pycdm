    optional TagInfo      np_pcep_od            = 101;
    optional TagInfo      np_pcep_lane          = 102;
    optional TagInfo      np_pcep_tsr           = 103;
    optional TagInfo      np_pcep_ahc           = 104;
    optional TagInfo      np_pcep_failsafe      = 105;
    optional TagInfo      np_pcep_tld           = 106;
    optional TagInfo      np_pcep_lidar         = 107;
    optional TagInfo      np_ehy                = 108;
    optional TagInfo      np_ctrl               = 109;
    optional TagInfo      np_map                = 110;
    optional TagInfo      np_other              = 149;
    optional TagInfo      np_l2_acc             = 151;
    optional TagInfo      np_l2_lks             = 152;
    optional TagInfo      np_l2_alc             = 153;
    optional TagInfo      np_l2_iacctsr         = 154;
    optional TagInfo      np_l2_other           = 199;
    // AEB TAG
    optional TagInfo      aeb_pcep_od           = 201;
    optional TagInfo      aeb_pcep_lidar        = 202;
    optional TagInfo      aeb_ehy               = 203;
    optional TagInfo      aeb_ctrl              = 204;
    optional TagInfo      aeb_other             = 249;
    optional TagInfo      aeb_l2_other          = 299;
    // reserve
    repeated TagNP        tag_np                = 501;
    repeated TagAEB       tag_aeb               = 502;
    //
    optional RoadTopology road_topology         = 701;
    optional InteRaction  interaction           = 702;
    optional EgoManever   egomaneuver           = 703;
    optional Environment  environment           = 704;
    optional Actors       actors                = 705;
    // reserve
    map<string, bytes>    extend_info           = 901;
    map<string, bytes>    debug_info            = 902;

    optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
    optional SensorTSHeader sensor_original_ts  = 536870906;     // sensor original ts
    optional uint64 publish_ptp_ts              = 536870907;     // publish ptp timestamp, uint in nanosec
    optional string publisher_id                = 536870909;     // uuid of the publisher
    optional uint64 counter                     = 536870910;     // message counter
    optional uint64 publish_ts                  = 536870911;     // publish utc timestamp; unit : nanosecond
}