syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

message KvPair {
    optional string key = 1;
    optional string value = 2;
}

message CdmUploadInfo {
    optional string event_name      = 1;    // 事件名称，对应的事件名称，翻车，撞车，安全气囊弹出。用户接管
    optional string rules_trig      = 2;    // which rules trig 哪一个规则触发了
    optional double latitude        = 3;    // GNSS
    optional double longitude       = 4;    // GNSS
    optional int32 priority         = 5;    // 事件优先级
    optional string event_tag       = 6;    // 规则触发上传meta
    repeated KvPair extra_info      = 7;    // extra info
}

message CdmReportInfo {
    optional string uuid                = 1;    // cdm app fill this
    optional string adc_version         = 2;    // global version of the vehicle//BL061
    optional string cdm_version         = 3;    // cdm app version //cdm_v061.1.1
    optional uint64 utc_nano_timestamp  = 4;    // utc nano timestamp
    optional uint64 ptp_nano_timestamp  = 5;    // ptp nano timestamp
    optional string vehicle_id          = 6;    // 车辆id
    optional string vehicle_type        = 7;    // 车型
    repeated string rules_info          = 8;    // 车辆装载哪些规则和版本号rules_name and rules_version ”rule1,version0.0.1“
    repeated string models_info         = 9;    // 车辆装载哪些模型和版本号models_name and models_version ”model1,version0.0.
    optional CdmUploadInfo upload_info     = 10;   // 事件内容描述 ,如果上电传软件版本为空
    optional string coapp_name          = 11;   //coapp中的名字
    optional string coapp_version       = 12;   //coapp的版本号
    optional string app_uuid            = 13;   //app的uuid
    optional string build_date          = 14;   //build的时间
    optional string psap_uuid           = 15;   // cdm app fill this
    optional string device_type         = 16;   // vehicle/station
    optional string station_generation  = 17;   // generaion_1/generaion_2/generaion_3
    optional string station_id          = 18;
    optional string station_stage       = 19;

    optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
    optional SensorTSHeader sensor_original_ts  = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts              = 536870907;
    optional string publisher_id                = 536870909;
    optional uint64 counter                     = 536870910;
    optional uint64 publish_ts                  = 536870911;
}

