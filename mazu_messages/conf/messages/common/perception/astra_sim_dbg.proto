        INTERSECTION = 400;

        TURN = 500;

        ROUNDABOUT = 600;
        ROUNDABOUT_PREPARE = 601;
        ROUNDABOUT_ONGOING = 602;
        ROUNDABOUT_LEAVING = 603;
        ROUNDABOUT_COMPLETE = 604;
        ROUNDABOUT_LANE_CHANGE = 605;
        ROUNDABOUT_LC_PREPARE_LEFT = 606;
        ROUNDABOUT_LC_PREPARE_RIGHT = 607;
        ROUNDABOUT_LC_ONGOING_LEFT = 608;
        ROUNDABOUT_LC_ONGOING_RIGHT = 609;
        ROUNDABOUT_LC_CANCEL = 610;
        ROUNDABOUT_LC_COMPLETE = 611;
    }

    optional uint64 timestamp = 1;
    optional string debug_string = 2;
    optional bool is_in_noa_state = 3;
    optional PathLCType lc_type = 4;
    optional bool is_navi_path_lc = 5;
    optional InternalState current_state = 6;
    optional AstraPlannerAgents.InternalStateMachineState state = 12;
    optional PathSemantic turn_type = 7;
    optional bool is_navi_path_uturn = 8;
    optional bool is_roundabout_scene = 9;
    optional bool is_navi_path_exit_roundabout_right = 10;
    optional bool is_traj_backward = 11;
    
    enum DAAlcCommandType {
        NO_REQUEST         = 0;   //default
        LANE_CHANGE_LEFT   = 1;
        LANE_CHANGE_RIGHT  = 2;
        LANE_CHANGE_CANCEL = 3;
    }
    enum LcTriggerSourceType {
        NONE = 0;                 //default
        LEVER_TRRIGER = 1;
        AUTO_TRIGGER = 2;
    }
    optional uint32 da_nad_sts = 13;
    optional DAAlcCommandType alc_command = 14;
    optional DAAlcCommandType last_alc_command = 15;
    optional PathLCType lever_lc_type = 16;
    optional PathLCType last_lc_type = 17;
    optional bool lever_lc_get_gap_flag = 18;
    optional LcTriggerSourceType lc_trigger_source = 19;
    optional bool lc_complete_suppression_t_flag = 20;
    optional bool lc_cancel_suppression_t_flag = 21;
}

message ScenarioRecognition {
    message ScenarioDescription {
        message StaticDescription {
            optional uint32 static_env_tag = 1;
            optional int64 id = 2;
            optional float dist_to_entry = 3;
            optional float dist_to_exit = 4;
            optional uint32 filtered = 5;
        }
        message DynamicDescription {
            optional int64 id = 1;
            optional float dist = 2;
            optional uint32 interaction_tag = 3;
            optional uint32 filtered = 4;
        }
        message TrafficDescription {
            optional uint32 traffic_tag = 1;
            optional float dist_to_entry = 2;
            optional float dist_to_exit = 3;
            optional uint32 filtered = 4;
        }
        message EgoBehaviorDescription {
            optional uint32 ego_desc = 1;
            optional uint32 filtered = 2;
        }
        // desc. static road envrionment
        repeated StaticDescription static_desc = 1;
        // desc. ego status
        repeated EgoBehaviorDescription ego_desc = 2;
        // desc. dynamic objects which maybe interactive with ego(single)
        repeated DynamicDescription dynamic_desc = 3;
        // desc. traffic flow grouped by dynamic objects
        repeated TrafficDescription traffic_desc = 4;
    }
    message ScenarioTags {
        optional uint32 tag_id = 1;
        optional uint32 source = 2;
    }
    optional ScenarioDescription scenario_desc = 1;
    repeated ScenarioTags scenario_tags = 2;
    repeated ScenarioTags filtered_scenario_tags = 3;
    repeated ScenarioTags ppl_scenario_tags = 4;        // all scenarios associated to publish_info
    optional ScenarioTags agent_post_scenario_tag = 5;  // scenario associated to agent_post
    optional ScenarioTags pnc_path_scenario_tag = 6;    // scenario associated to pnc_path
}

message AstraSimLaneChangeDeciderDebug {
    optional CoordinateDebug coordinate_debug = 1;
    optional GapSelectorDebug gap_selector_debug = 2;
    optional PathSolutionDebug path_solution_debug = 3;
}

message CoordinateDebug {
    message ObjectOnCurve {
        optional int64 id = 1;
        optional float s_min = 2;
        optional float s_max = 3;
        optional float l_min = 4;
        optional float l_max = 5;
        optional float v_s = 6;
        optional float v_l = 7;
        optional float heading = 8;
        optional uint64 timestamp = 9;
    }
    message LinePoint {
        optional float x = 1;
        optional float y = 2;
    }
    optional string coordinate_debug_string = 1;
    map<int64, ObjectOnCurve> object_on_curve_map = 2;
    repeated int64 target_lane_obj_ids = 3;
    repeated int64 original_lane_obj_ids = 4;
    optional bool has_cross_line = 5;
    optional int64 divide_line_id = 6;
    repeated LinePoint divide_line = 7;
}

message GapSelectorDebug {
    message GapCandidate {
        optional int32 front_id = 1;
        optional int32 back_id = 2;
        optional int32 yield_id = 3;
        optional int32 overtake_id = 4;
        message MotionBound {
            optional double time_stamp = 1;
            optional double curr_motion_hard_upper_bound = 2;
            optional double curr_motion_hard_lower_bound = 3;
            optional double curr_motion_soft_upper_bound = 4;
            optional double curr_motion_soft_lower_bound = 5;
            optional double tgt_motion_hard_upper_bound = 6;
            optional double tgt_motion_hard_lower_bound = 7;
            optional double tgt_motion_soft_upper_bound = 8;
            optional double tgt_motion_soft_lower_bound = 9;
        }
        repeated MotionBound motion_bounds = 5;
        optional double gap_solution_cost = 6;
        message GapSolutionMotion {
            optional double time_stamp = 1;
            optional double acc = 2;
            optional double speed = 3;
            optional double s = 4;
        }
        repeated GapSolutionMotion gap_solution_motion = 7;
        optional double start_t = 8;
    }
    repeated GapCandidate gap_candidates = 1;
    optional string gap_selector_debug_string = 2;
    optional uint32 lc_phase_flg = 3;
}

message PathSolutionDebug {
    message SearchGridNode {
        optional int32 layer_index = 1;
        optional int32 node_index = 2;
        // SL coordinate
        optional double s = 3;
        optional double l = 4;
        // car coordinate
        optional double x = 5;
        optional double y = 6;
    }
    message GapInfo {
        optional int32 front_id = 1;
        optional int32 back_id = 2;
        optional int32 yield_id = 3;
        optional int32 overtake_id = 4;
        optional double start_t = 5;
        repeated GapSelectorDebug.GapCandidate.GapSolutionMotion gap_solution_motion = 6;
        optional double cost = 7;
    }

    message CostPoint {
        optional double cost = 1;
        optional double s = 2;
        optional double l = 3;
    }
    message CostMatrix {
        message Row {
            repeated CostPoint cost_point = 1;
        }
        repeated Row rows = 1;
    }
    message CollisionCostMapDebug {
        optional string debug_message = 1;
        optional double sampling_t_step = 2;
        repeated CostMatrix collision_cost_map = 3;
    }

    message SearchGrid {
        message SearchGridRow {
            repeated SearchGridNode nodes = 1;
            optional double left_l = 2;
            optional double right_l = 3;
        }
        repeated SearchGridRow rows = 1;
        optional double start_s = 2;
        optional double end_s = 3;
    }

    message Path {
        repeated SearchGridNode path = 1;
        optional double cost = 2;
    }
    message PathSearchCandidateDebug {
        optional string debug_message = 1;
        optional GapInfo gap = 2;
        repeated Path path_debug = 3;
        optional int32 choosen_path_index = 4;
    }

    optional string debug_message = 1;
    optional SearchGrid search_grid = 2;
    optional CollisionCostMapDebug collision_cost_map_debug = 3;
    repeated PathSearchCandidateDebug path_search_result_debug = 4;
    optional int32 choosen_candidate_index = 5;
}
