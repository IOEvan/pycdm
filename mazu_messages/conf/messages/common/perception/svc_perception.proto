syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

import "common/perception/svc_free_space.proto";
import "common/perception/svc_objects.proto";
import "common/perception/svc_slots.proto";
import "common/perception/svc_power_swap.proto";
import "common/perception/svc_functional.proto";

message SVCPerception{
  optional SlotResult slots = 1;
  optional SVCObjResult objects = 2;
  optional SVCFreeSpace freespace = 3;
  optional PSAPResult psap_results = 4;
  optional SVCDetectionStatus svc_det_status = 5;
  optional uint64 timestamp = 6; // sensor time

  optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
  optional uint64 publish_ptp_ts = 536870907;    // publish ptp timestamp, uint in nanosec
  optional string publisher_id = 536870909;      // uuid of the publisher
  optional uint64 counter = 536870910;           // message counter
  optional uint64 publish_ts = 536870911;        // publish utc timestamp; unit : nanosecond
}