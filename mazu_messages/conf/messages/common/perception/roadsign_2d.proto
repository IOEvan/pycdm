syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";
import "common/perception/vision_road_sign.proto";

message Roadmarker{
  optional RoadSignClass RoadSign_Class = 1;
  repeated Point_2d RoadSign_2DList = 2;
  optional float RoadSign_Confidence = 3;
  optional RoadSignColor RoadSign_Color = 4;
  optional uint32 sensor_id = 5; //SENSOR_CAMERA_FW = 0,SENSOR_CAMERA_FN = 1,SENSOR_CAMERA_RN = 2,
                                //SENSOR_CAMERA_FL = 3,SENSOR_CAMERA_FR = 4,SENSOR_CAMERA_RR = 5,
                                //SENSOR_CAMERA_RL = 6, SENSOR_CAMERA_SFW = 7, SENSOR_CAMERA_SRCW = 8,
                                //SENSOR_CAMERA_SLW = 9, SENSOR_CAMERA_SRW = 10, SENSOR_LIDAR_FRONT = 11

  optional float RoadSign_Value = 6;
  optional float RoadSign_Heading = 7;
  optional uint32 RoadSign_Visible = 8; //0 = unknown，1 = full_visible,2=partial_visible，3=unvisible；
  optional float RoadSign_Visible_conf = 9; // visible_conf,0-1
  
  enum RoadSignClass{
      RoadSignClass_Unknown = 0;
      RoadSignClass_StopLine = 100;
      RoadSignClass_YieldLine_Solid = 101;
      RoadSignClass_YieldLine_Dash = 102;
      RoadSignClass_RoadArrow = 200;
      RoadSignClass_RoadArrow_Left = 201;
      RoadSignClass_RoadArrow_Right = 202;
      RoadSignClass_RoadArrow_Left_Right = 203;
      RoadSignClass_RoadArrow_Straight = 204;
      RoadSignClass_RoadArrow_Straight_Right = 205;
      RoadSignClass_RoadArrow_Straight_Left = 206;
      RoadSignClass_RoadArrow_Only_Turn = 207;
      RoadSignClass_RoadArrow_Left_Turn = 208;
      RoadSignClass_RoadArrow_Straight_Turn = 209;
      RoadSignClass_RoadArrow_Left_Merge = 210;
      RoadSignClass_RoadArrow_Right_Merge = 211;
      RoadSignClass_RoadArrow_Forbid_Sign = 212;
      RoadSignClass_RoadArrow_Forbid_Only_Sign = 213;
      RoadSignClass_RoadArrow_Forbid_Left_Sign = 214;
      RoadSignClass_RoadArrow_Forbid_Right_Sign = 215;
      RoadSignClass_RoadArrow_Forbid_Straight_Sign = 216;
      RoadSignClass_RoadArrow_Forbid_Turn_Sign = 217;
      RoadSignClass_RoadArrow_Forbid_Left_Merge_Sign = 218;
      RoadSignClass_RoadArrow_Forbid_Right_Merge_Sign = 219;
      RoadSignClass_RoadArrow_Forbid_Left_And_Turn_Sign = 220;
      RoadSignClass_ZebraCross = 300;
      RoadSignClass_NoParkingArea = 400;
      RoadSignClass_SlowZone = 500;
      RoadSignClass_SpeedBump = 600;
      RoadSignClass_PolePillar = 700;
      RoadSignClass_LimitSpd_Max = 801;
      RoadSignClass_LimitSpd_Min = 802;
      RoadSignClass_TextPattern = 900;
  }

  enum RoadSignColor{
      RoadSignColor_Unknown = 0;
      RoadSignColor_White = 1;
      RoadSignColor_Yellow  = 2;
      RoadSignColor_Red = 3;
      RoadSignColor_Green = 4;
      RoadSignColor_Reserve = 5;
  }
  
}

message Point_2d {
  optional float RM_Point_x = 1; // x_pixel in the picture
  optional float RM_Point_y = 2; // y_pixel in the picture
}

message RoadmarkerList{
  optional uint64 timestamp = 1;//Timestamp_Receive_Image
  repeated Roadmarker roadmarker = 2; //for onemodel NN 2d
  repeated VisionRoadSign roadsign_3d = 3; //for BEV NN 3d

  optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
  optional uint64 publish_ptp_ts = 536870907;     // publish ptp timestamp, uint in nanosec
  optional string publisher_id = 536870909; // uuid of the publisher
  optional uint64 counter = 536870910;         // message counter
  optional uint64 publish_ts = 536870911;    // publish utc timestamp; unit : nanosecond
}
