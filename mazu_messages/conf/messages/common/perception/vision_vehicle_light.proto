syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";


message VehicleLight{
    optional uint32 VL_ID = 1;
    optional uint32 VL_Num_Of_Vehicles = 2;
    optional uint32 VL_Brightness = 3;
    optional VLType VL_Type = 4;
    optional float VL_Width = 5;
    optional float VL_Width_STD = 6;
    optional float VL_Height = 7;
    optional float VL_Height_STD = 8;
    optional float VL_Top_Angle = 9;
    optional float VL_Bottom_Angle = 10;
    optional float VL_Right_Angle = 11;
    optional float VL_Left_Angle = 12;
    optional float VL_Top_Angle_Velocity = 13;
    optional float VL_Bottom_Velocity_Angle = 14;
    optional float VL_Right_Velocity_Angle = 15;
    optional float VL_Left_Velocity_Angle = 16;
    optional float VL_Confidnece = 17;
    optional bool VL_Is_SingleBar = 18;
    optional bool VL_Is_New = 19;

    enum VLType{
        VLType_Unknown = 0;
    }
}

message VehicleLightDetection{
    optional uint64 timestamp = 1;//Timestamp_Receive_Image
    repeated VehicleLight vehiclelight = 2;

    optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts = 536870907;     // publish ptp timestamp, uint in nanosec
    optional string publisher_id = 536870909; // uuid of the publisher
    optional uint64 counter = 536870910;         // message counter
    optional uint64 publish_ts = 536870911;    // publish utc timestamp; unit : nanosecond
}