syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";


message FreeSpaceEuclidean{
    optional uint32 FSP_Obs_ID = 1;
    optional FSPLaneAssginmentEuclidean FSP_Lane_Assginment = 2;
    optional float FSP_x = 3;
    optional float FSP_y = 4;
    optional FSPClassificationTypeEuclidean FSP_Classification_Type = 5;
    optional float FSP_Height = 6;
    optional float FSP_z = 7;
    optional FSPMobilityStatusEuclidean FSP_Mobility_Status = 8;
    optional float FSP_Existence_Prob = 9;

    enum FSPLaneAssginmentEuclidean{
        FSPLaneAssginment_Unknown = 0;
        FSPLaneAssginment_Host = 1;  //Host lane
        FSPLaneAssginment_Right = 2; // Right lane
        FSPLaneAssginment_Left = 3; //Left lane
        FSPLaneAssginment_Right_Right = 4; //Right right lane
        FSPLaneAssginment_Left_Left = 5; //Left left lane
    }

    enum FSPClassificationTypeEuclidean{
        FSPClassificationType_Unknown = 0;
    }

    enum FSPMobilityStatusEuclidean{
        FSPMobilityStatus_Unknown = 0;
        FSPMobilityStatus_Moving = 1;
        FSPMobilityStatus_Stationary = 2;
    }

}

enum FreeSpaceSourceEuclidean{
        kFreeSpaceVisionEuclidean = 0;
        kFreeSpaceLidarEuclidean = 1;
        kFreeSpaceFusionEuclidean = 2;
    }

message FreeSpaceDetectionEuclidean{
    optional uint64 timestamp = 1;//Timestamp_Receive_Image
    repeated FreeSpaceEuclidean freespace = 2;
    optional FreeSpaceSourceEuclidean source = 3; 

    optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts = 536870907;  // publish ptp timestamp, uint in nanosec
    optional string publisher_id = 536870909;    // uuid of the publisher
    optional uint64 counter = 536870910;         // message counter
    optional uint64 publish_ts = 536870911;      // publish utc timestamp; unit : nanosecond
}
