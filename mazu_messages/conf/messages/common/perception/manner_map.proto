message MannerScene {
    enum SceneType {
        UNKOWN_SCENE = 1;
        JUNCTION_SCENE = 2; // 路口，暂不区分具体类型
        T_JUNCTION_SCENE = 3 [deprecated = true];
        VRU_JUNCTION_SCENE = 4; // 暂无输出
        MAIN_AUX_ROAD_SCENE = 5; // 主辅路场景
        ROUNDABOUT_SCENE = 6; // 环岛场景
        RIGHT_LANE_SCENE = 7; // 右转专用道场景
        Y_SPLIT_SCENE = 8 [deprecated = true];
    }

    enum SplitType {
        T_SPLIT = 1; // 丁字型分叉
        Y_SPLIT = 2; // Y型分叉
        FORK_SPLIT = 3; // 卜型分叉
        F_SPLIT = 4; // F型分叉
    }

    message SplitInfo {
        optional SplitType split_type = 1;
        // 相对于驶入stub方向，驶出stub方向的角度（出角），单位为弧度，逆时针，-pi ~ pi
        optional float main_drive_out_split_angle_relative_drive_in = 2;
        // 相对于驶入stub方向，自车不行驶的分支路驶出stub方向的角度（出角），单位为弧度，逆时针，-pi ~ pi
        repeated float sub_split_angle_relative_drive_in = 3;
    }

    message UTurnInfo {
      // 定义见 https://nio.feishu.cn/wiki/Wit6wAaJLinupekoMVkcsgspnFK
      enum UTurnType {
        UNKOWN_UTURN = 0;
        JUNCTION_UTURN = 1;
        OPENING_UTURN = 2;
        YELLOW_DASH_UTURN = 3;
        MAINROAD_DASH_UTURN = 4;
      }

      optional UTurnType uturn_type = 1;
    }

    message MergeInfo {
      enum MergeFromDirection {
        FROM_LEFT = 1;
        FROM_RIGHT = 2;
      };

      optional MergeFromDirection merge_from_direction = 1;
    }

    message SceneGeometry {
        repeated MannerPoint_3D polygon_points = 1; // SceneArea
        optional RoadSceneArea.GoalRegion.GoalRegionInterface interface = 2; // SceneRegion，目前仅支持主辅路
        // Distance Info
        optional double distance_to_center = 3; // 无感知观测的情况下，纯sd给出
        optional double distance_to_entry = 4;
        optional double distance_to_exit = 5;
        optional MannerPoint_3D shape_point_with_traffic_light = 6;

        // 待转区作为路口的附属目标表征
        message WaitZoneAttatchment {
          // waitzone entry与junction entry相同  不再重复输出
          optional double distance_to_exit = 1;
          // optional uint32 ego_inner_flag = 2;  // reseved
        }

        optional WaitZoneAttatchment waitzone_attachment = 7;  //星光1.2 只支持单待行区输出
        // 分叉信息参考文档 https://nio.feishu.cn/wiki/Wit6wAaJLinupekoMVkcsgspnFK
        optional SplitInfo split_info = 8;
        optional UTurnInfo uturn_info = 9;
        optional MergeInfo merge_info = 10;
    }

    enum TurnDirection {
        UNKNOWN_DIRECTION = 0;
        STRAIGHT = 1;
        LEFT = 2;
        RIGHT = 3;
        TURN_AROUND_LEFT = 4;
        TURN_AROUND_RIGHT = 5;
    }

    optional uint32 id = 1;
    optional SceneType type = 2;
    
    optional SceneGeometry geometry = 3; // 绑定后的几何信息
    optional bool is_controlled_by_traffic_light = 4;
    optional TurnDirection turn_direction = 5;
}

message MannerSceneInfo {
  repeated MannerScene manner_scene = 1;
}

message MannerSpaceInfo {
  message MannerSpace {
    enum Type {
      // physical
      CURB = 1; // 路沿类形成的静态障碍物

      // legal
      GUIDE_AREA = 1001; // 导流带
      VIRTUAL_REVERSE = 1002; // 虚拟反向分割线形成的反向区域，用于无车道线观测的场景
      SOLID_SOLID_YELLOW_LINE_REVERSE = 1003; // 暂时不使用
      SOLID_YELLOW_LINE_REVERSE = 1004; // 黄实线（包括单黄、双黄）形成的反向区域，泛指双向不可跨越的反向空间
      DASH_YELLOW_LINE_REVERSE = 1005;  // 黄虚线（包括单黄、双黄）形成的反向区域，泛指双向可跨越的反向空间
      MULTI_LINE_REVERSE = 1006; // 暂时不使用
      SOLID_DASH_YELLOW_LINE_REVERSE = 1007; // 左实右虚双黄线形成的反向区域，泛指自车可以跨越到反向，但是反向车辆不可跨越过来的反向空间
      DASH_SOLID_YELLOW_LINE_REVERSE = 1008; // 左虚右实双黄线形成的反向区域，泛指自车不可以跨越到反向，但是反向车辆可跨越过来的反向空间
    }

    optional Type type = 1;
    repeated MannerPoint_3D polygon_points = 2; // 多边形，逆时针，首尾点不重复
    repeated MannerPoint_3D polyline_points = 3; // 线
    optional uint32 id = 4;

    optional OnRouteProperty.RouteDirection direction = 5;   // space相对path方向
  }
  repeated MannerSpace spaces = 1;
}

