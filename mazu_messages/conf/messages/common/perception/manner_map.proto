syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";
import "common/perception/tld_raw.proto";
import "common/map_engine/fence_odd_list.proto";
import "common/perception/nav_input.proto";

message MannerPoint_3D {
  optional float Point_x = 1;
  optional float Point_y = 2;
  optional float Point_z = 3;
  optional float Point_Score = 4;
}

message CenterLine {
  message PointProperty {
    message Property {
      enum Source {
        UNDEFINED = 0;
        ROAD_AREA = 1;
        DYNAMIC_OD = 2;
        CENTERLINE = 3;
      }
      
      enum Type {
        DEFAULT_POINT = 0; // use as low weight
        TLD_STOP_POINT = 1;
        ENTRANCE_GOAL_POINT = 2; // 与NaviGoalRegion配合，截面级别的强约束
        FORBICAL_CENTER_POINT = 3; // 强制居中，点级别的强约束
        CRUISE_CENTER_POINT = 4; 
        LANE_CHANGE_POINT = 5;
      }
      
      optional Source source = 1;
      optional Type type = 2;
    }
      
    repeated Property properties = 1;
  }
  
  optional uint32 id = 1;     // id of centerline
  repeated MannerPoint_3D points = 2;   // Geometric path points x,y,z. shape 3xN.
                                  // the sequence of points is the dirction of the centerline.
                                  // First point is not last point.
  optional float confidence = 3;  // confidence of centerline
  repeated PointProperty point_properties = 4; // same size with points, refer https://nio.feishu.cn/wiki/CcbmwrnyTieTVOkN4CtcA13gnWc
}

message OnRouteProperty {    
  enum RouteDirection{    
      Invalid = 0;
      Route_Left = 1;
      Route_Right = 2;
  }

  optional uint32 on_route_flag = 1; // 1 on route   0 not on route
  optional RouteDirection  route_direction = 2;
}

message LaneBoundary {
  optional uint32 id = 1; // boundary index id/track_id
  repeated MannerPoint_3D points = 2;   // geometric path
  message LinePointProperty {
    enum LDType {
        LDType_Unknown = 0;
        LDType_Solid = 1;
        LDType_Dash = 2;
        LDType_Solid_Dash = 3;
        LDType_Dash_Solid = 4;
        LDType_Solid_Solid = 5;
        LDType_Dash_Dash = 9;
        LDType_Deceleration_Dash = 6;
        LDType_Deceleration_Solid = 7;
        LDType_Guide = 8;
        // value from 0 - 9.
        LDType_Serrate = 10;
        LDType_Composite = 11;
        LDType_Parking_Space_Entrace = 12;
    }

    enum LDColor {
        LDColor_Unknown = 0;  // unavailable
        LDColor_White = 1;
        LDColor_Yellow = 2;
        LDColor_Orange = 3;  // unavailable
        LDColor_Blue = 4;    // unavailable
        LDColor_Others = 5;
        LDColor_Green = 6;
        LDColor_Yellow_White = 7;
        LDColor_White_Yellow = 8;
    }
    optional LDType LD_Type = 1;
    optional LDColor LD_Color = 2;
    optional uint32 LD_TypeConfidence = 3;
    optional uint32 LD_ColorConfidence = 4;
  }
  repeated LinePointProperty properties = 3;  // Geometric path type and colors. 
  repeated uint32 confidence = 4; // Geometric path confidence. shape P.
                                  // Value range of confidence is (0 ~ 100)
  optional float score = 5; // LaneBoundary score
  optional OnRouteProperty on_route_property = 6;

  
}

message SpecialPoint {
  optional uint32 id = 1;
  optional MannerPoint_3D point = 2;

  enum LDSpecialPointType{
        LDSpecialPointType_Unknown = 0;
        LDSpecialPointType_Type = 1;
        LDSpecialPointType_Color = 2;
        LDSpecialPointType_Merge = 3;
        LDSpecialPointType_Split = 4;
  }
  optional LDSpecialPointType special_point_types = 3;
  repeated uint32 related_lane_boundary_ids = 4;   // bind to laneline
  repeated uint32 related_lane_ids = 5;            // bind to centerline
}

message Lane {
  optional uint32 id = 1; // lane index id/track_id
  optional CenterLine centerline = 2;
  optional uint32 left_boundary_id = 3; // boundary index id/track_id
  optional uint32 right_boundary_id = 4; // boundary index id/track_id
  enum LaneType {
    VIR_LANE = 1;
    MOTORWAY = 2;
    BICYCLE_LANE = 3;
    MIXED_LANE = 4;
    MOTORCYCLE_LANE = 5;
    LANE_SIDEWALK = 6;
    VARIABLE_LANE = 7;
    HOV_LANE = 8;
    RIGHT_ACCE_LANE = 9;
    RIGHT_DECE_LANE = 10;
    LEFT_ACCE_LANE = 11;
    LEFT_DECE_LANE = 12;
    SPEED_CHANGE_LANE = 13;
    TOLL_LANE = 14;
    CHECKPOINT_LANE = 15;
    BUS_LANE = 16;
    CLIMBING_LANE = 17;
    ROAD_SHOULDER = 18;
    EMERGENCY_LANE = 19;
    EMERGENCY_STOP_AREA = 20;
    PARNKING_LANE = 21;
    HAZARDOUS_LANE = 22;
    CUSTOMS_SUPER_LANE = 23;
    AVOID_LANE_APPRO = 24;
    PASSING_TRACK = 25;
    NON_DRIVING_ZONE = 26;
    BORROWING_ZONE = 27;
    TRAMCAR_LANE = 28;
    ETC_LANE = 29;
    BUS_HARBOR_LANE = 30;
    SPECIAL_CAR_LANE = 31;
    REVERSE_LANE = 32;
    TURNING_WAITING_AREA = 33;  // 待转区
    ROUNDABOUT_LANE = 34;     // 环岛车道
    TIDAL_LANE = 35;          // 潮汐车道
    OTHERS = 99;
  }
  optional LaneType lane_type = 5;
  enum Turn {
    INVALID = 0;
    STRAIGHT = 1;
    LEFT = 2;
    RIGHT = 4;
    U_TURN_LEFT = 8;
    U_TURN_RIGHT = 16;
    SKEW_LEFT = 32;
    SKEW_RIGHT = 64;
  }
  repeated Turn turns = 6;
  optional bool is_on_nav = 7; // true means this lane is on the nav direction
  optional double maximum_limit_speed = 8;                 // for planner
  // bellows speed-limit releated are for debuging
  optional SpeedSource maximum_limit_speed_source = 9;     // 优先级: min(经验, 电子眼) > 法规 > 默认
  repeated SpeedLimitElement maximum_limit_elements = 10;
  optional float lane_type_confidence = 11;                // 车道类别置信度，范围[0 - 1]

  enum Direction {
    UNKNOWN = 0;
    SAME_SIDE = 1;
    OPPOSITE_SIDE = 2;
  }
  optional Direction direction = 12;

  message SpeedLimitElement {
    optional SpeedSource speed_source = 1;
    optional double speed_limit = 2;
  }

  enum SpeedSource {
    DEFAULT = 0;             // 所有限速值都缺失情况下,采用默认40
    CAMERA = 1;              // 电子眼
    ADVISORY = 2;            // 经验
    LAW_AND_REGULATION = 3;  // 法规
    DISPLAY_SET_SETSPEED = 4;// 用户设置
    // scenario based speed limit
    LANE_CHANGE = 10;        // 换道/防偏航减速
    OCCLUSION = 11;          // 遮挡限速
  }

  repeated TimeLimitInfo time_limit_info = 13;  // 通行时段信息
  optional uint32 time_limit_data = 14;         // 限行日期信息
  optional float on_route_confidence = 15;      // centerline on route confidence

  message TimeLimitInfo {
    optional float time_limit_start_time_stamp = 1;  // 限行起始时间
    optional float time_limit_end_time_stamp = 2;    // 限行结束时间
  }
}

message LaneLink {
  message Dis2Turn {
    optional float dis = 1;    // distance as meter
    optional Lane.Turn turn = 2;
  }
  optional uint32 id = 1; // track_id or index_id 
  repeated uint32 lane_ids = 2; // The lane ids which related to this link. the sequence of lanes is the dirction of the link.
  repeated MannerPoint_3D stop_points = 3; // the intersection of stoplines with lanelink gemotry
  optional int32 lc_times = 4; // LC times with direction, positive if need left LC, negative if need right LC, and 0 if not need LC (means this nav_lane is the target one). 
  repeated Dis2Turn turns = 6; // end distance of turn type to the corresponding turn type.
  optional NavLaneSource source = 7;
  optional PathSemantic path_semantic = 8;
  optional float least_lc_dist = 9;
  optional PathLCType path_lc_type = 10;
  optional float passing_prob = 11;  // passing probability
}

message NaviPath {
  message RefineInfo {
    enum RefineSource {
      CENTERLINE = 1;
      GOAL_POINT = 2;
      STATIC_COLLISION = 3;
      REVERSE_SPACE = 4;
      NONMOTOR_SPACE = 5;
      BUS_LANE = 6;
      TARGETLINE = 7;
    }
    repeated RefineSource refine_source = 1;
  }
  message LaneChangeInfo {
    optional int32 lc_number = 1; // The number of lane changes
  }

  message PathDecisionInfo{

    enum PathDecisionType {
      AVOID = 1;
      LANE_SELECT = 2;
      NUDGE = 3;
    }

    repeated PathDecisionType path_decision_type = 1;

    message PathAvoidInfo {
      repeated uint32 relation_space_id = 1;
    }

    optional PathAvoidInfo path_avoid_info = 2;
  }


  optional uint32 id = 1; // track_id or index_id 
  optional uint32 lane_id = 2; // The lane id which related to this path.
  repeated MannerPoint_3D stop_points = 3; // the intersection of stoplines with path gemotry
  optional PathSemantic path_semantic = 4;
  optional float least_lc_dist = 5;
  optional PathLCType path_lc_type = 6;
  optional float score = 7;
  optional uint32 source = 8;
  optional uint32 source_id = 9;
  optional RefineInfo refine_info = 10;
  optional LaneChangeInfo lane_change_info = 11;
  optional PathDecisionInfo path_decision_info = 12;
}

message NavLane {
  optional uint32 id = 1;
  repeated Lane nav_lane_segments = 2;
}

message MannerRoadedge {
    optional uint32 id = 1;
    enum MannerLDREClass{
        LDREClass_Unknown = 0;
        LDREClass_Cement_Block = 1; //指代固定矮路沿
        LDREClass_Fence = 2; //指代固定高路沿
        LDREClass_Cone=3;    //锥桶
        LDREClass_Barrel=4;  //圆桶
        LDREClass_Barrier=5; //水马
        LDREClass_Parked_Vehicle=6;//deprecated
        LDREClass_Parked_Cycle=7;//deprecated
        LDREClass_Grass=8;//deprecated，草地
        LDREClass_gravel=9;//deprecated，碎石
        LDREClass_ShortPole=10;//deprecated
        LDREClass_WallFlat=11; //deprecated，墙面
        LDREClass_Other=12; //deprecated，其他固定类路沿
    }
    message RoadedgePointProperty {
        optional MannerLDREClass LD_RE_Class = 1;  //point class
    }
    optional MannerLDREClass LDRE_Class = 2;//路沿细分类
    repeated MannerPoint_3D points = 3; // geometric path
    repeated RoadedgePointProperty properties = 4; 
    optional float score = 5;
    optional OnRouteProperty on_route_property = 6;
}

message MannerStopLine {
    optional uint32 id = 1;
    optional float Long_Dist_L = 2;
    optional float Long_Dist_R = 3;
    optional float Lat_Dist_L = 4;
    optional float Lat_Dist_R = 5;
    optional float confidence = 6;
    repeated uint32 lane_ids = 7;
    enum Type {
      Unknown = 0;
      Normal = 1;
      WaitingZoneStopLine = 2;
    }
    optional Type type = 8;
}

message BevBox3D {
    optional float x = 1;
    optional float y = 2;
    optional float z = 3;
    optional float h = 4;
    optional float w = 5;
    optional float l = 6;
    optional float alpha = 7; 
}

message WMStopline {
  optional MannerPoint_3D stop_points = 1;
  optional uint32 stopline_id = 2;
}

message TrafficLightJunction {
  optional uint32 id = 1;
  repeated VirtualTrafficLightStatus virtual_traffic_lights = 2;
  repeated uint32 stopline_ids = 3;
  repeated Panel panels = 4;
  repeated MonoBox mono_boxes = 5;
  optional TLDRawDLBObject tld_raw_dlb_buf = 6;
  optional uint32 source = 7;
  optional bool is_controlled_by_traffic_light = 8;
  optional float distance_to_entry = 9;
  optional uint32 trafficlight_info_source = 10;
  repeated WMStopline wm_stoplines = 11;
  optional PathSemantic path_semantic = 12;
  optional TldCenter tld_center = 13;
  optional uint32 binded_junction_id = 14;  // binded junction id, maybe from road_scene_area or manner scene_info

  message TldCenter {
    optional bool is_valid = 1;  // if false, you can ignore this TrafficLight
    optional uint32 panel_id = 2; // if > 0, indicates related panel id, else maybe inferred by sd light
    optional float x = 3;
    optional float y = 4;
  }

  message MonoBox {
      optional uint32 sensor_id = 1;  // refer https://ad-gitlab.nioint.com/ad/perception/engineering/internal/argus_post_common/-/blob/master/include/argus_post_common/data_structure/common/sensors.h
      optional uint32 TLD_Status = 2; //0：亮 1：熄灭
      optional float Width_2d = 3;//图像2d宽
      optional float Height_2d = 4;//图像2d高
      optional float Pos_x_2d = 5;//图像2d中心点
      optional float Pos_y_2d = 6;//图像2d中心点
      optional uint32 panel_id = 7;           // panel ids  
      repeated Panel.BlubStatus blub_statuses = 8;     // 灯头属性: 非常规灯头可复用
      optional float confidence = 9; // 检测框置信度 0～1
      optional uint32 id = 10;
      optional float depth = 11;
      optional float theta = 12;
  }

  message VirtualTrafficLightStatus {
    optional uint32 id = 1;
    optional TLDirection direction = 2;
    optional TLColor color = 3;
    optional uint32 color_status = 4;        // 0 normal, 1 blink, 2 broken
    repeated uint32 lane_ids = 5;            // all the lane ids corresponding to this vtl
    optional uint32 occlusion_status = 6;    // occlusion status: 0 normal, 1 occluded by dynamic object
    optional uint32 timer = 7;               // 65535 for undetected countdown  
    repeated uint32 panel_ids = 8;           // panel ids
    optional uint32 failure_status = 9;      // wti status: 0 normal
    optional uint32 timer_progress = 10;     // for progress bar timer, 0: 不亮, 1: 1/4亮, 2: 2/4亮, 3: 3/4亮, 4: 4/4亮
    optional uint32 has_direction_related_blub = 11;  // if direction is TLDIRECTION_LEFT_TURN, then 1 indicates has TLTYPE_LEFT Blub
    optional uint32 is_virtual_countdown_valid = 12; // is duration valid
    optional uint32 virtual_countdown_duration_time = 13; // green blink duration or yellow duration
    repeated uint32 full_panel_ids = 14;     // panel ids given by e2e model
    optional uint32 is_ped_timer_valid = 15;  // is pedestrain timer valid
    optional uint32 ped_timer = 16;  // pedestrain timer
    enum TLDirection {
      TLDIRECTION_U_TURN = 0;
      TLDIRECTION_LEFT_TURN = 1;
      TLDIRECTION_STRAIGHT = 2;
      TLDIRECTION_RIGHT_TURN = 3;
    }
  }

  message Panel {
    optional uint32 id = 1;
    optional BevBox3D bev_box = 2;         // 灯框3D
    repeated BlubStatus blub_statuses = 3;     // 灯头属性: 非常规灯头可复用
    optional uint32 tl_usage = 4;              // 灯框属性: 0 normal, 1 bus, 2 vru
    optional uint32 color_status = 5;          // 灯框亮灯状态: 0 normal, 1 broken
    optional uint32 occlusion_status = 6;      // 灯框遮挡状态: 0 normal, 1 occluded by dynamic object
    optional float confidence = 7; // 检测置信度 0～1
    repeated int32 associate_mono3d_ids = 8;  // 关联Mono框ID
    
    message BlubStatus {
      optional uint32 id = 1;
      optional TLType type = 2;          // 灯头形状
      optional TLColor color = 3;        // 灯头颜色
      optional uint32 timer = 4;         // 倒计时数字,65535为默认无效值
      optional uint32 color_status = 5;  // 颜色状态, 0 normal, 1 blink, 2 broken
      optional uint32 timer_progress = 6;  // 进度条数字, 0: 不亮, 1: 1/4亮, 2: 2/4亮, 3: 3/4亮, 4: 4/4亮
      optional float type_confidence = 7; // 灯头形状置信度 0～1
      optional float color_confidence = 8; // 灯头颜色置信度 0～1
      optional float timer_confidence = 9; // 倒计时置信度 0～1
      repeated float type_confidence_distribution = 10; // 灯头形状置信度分布 num_type * 0～1
      repeated float color_confidence_distribution = 11; // 灯头颜色置信度分布 num_color * 0~1
      repeated float timer_confidence_distribution = 12; // 倒计时置信度分布 num_timer * 0～1
    }
  }
  enum TLColor{
    TLCOLOR_UNKNOWN = 0;
    TLCOLOR_RED = 1;
    TLCOLOR_YELLOW = 2;
    TLCOLOR_GREEN = 3;
    TLCOLOR_GRAY = 4;
  }

  enum TLType {
    TLTYPE_UNKNOWN = 0;
    TLTYPE_CIRCLE = 1;
    TLTYPE_LEFT = 2;
    TLTYPE_RIGHT = 3;
    TLTYPE_UP = 4;
    TLTYPE_U_TURN = 5;
    TLTYPE_PEDESTRIAN = 6;
    TLTYPE_BICYCLE = 7;
    TLTYPE_DOWN = 8;          // 下箭头
    TLTYPE_TIMER = 9;         // 倒计时
    TLTYPE_FORBID = 10;       // 红叉
    TLTYPE_BUS = 11;          // 公交
    TLTYPE_LEFT_UTURN = 12;   // 左转+掉头
    TLTYPE_PROGRESS_BAR = 13; // 进度条
    TLTYPE_OTHERS = 14;
  }
}

