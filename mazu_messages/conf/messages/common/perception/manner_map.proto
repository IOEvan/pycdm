message RoadSceneArea {
  message RoadAreaBox {
    repeated MannerPoint_3D polygon_points = 1;
    optional float confidence = 2;
    optional float heading = 3;
    optional float center_x = 4;
    optional float center_y = 5;
    optional float center_z = 6;
    optional float length = 7;
    optional float width = 8;
  }

  message GoalRegion {
    message GoalRegionInterface {
      // 两个点构成的截面线段，线段的法向量方向代表goal点的heading = (end - start).heading() + M_PI / 2
      optional MannerPoint_3D start = 1;
      optional MannerPoint_3D end = 2;
    }
 
    optional GoalRegionInterface goal_region_interface = 1; // 截面
    repeated MannerPoint_3D goal_points = 2; // 导航点
  }

  message NaviGoalRegion {
    enum RoadAreaType {
      ROAD_AREA_JUNCTION = 1;
      ROAD_AREA_ENTRANCE = 2;
      ROAD_AREA_NO_ENTRY = 3;
      ROAD_AREA_CONSTRUCTION = 4;
      ROAD_AREA_ZONE = 5;
      ROAD_AREA_DYNAMIC_OD = 10;
    }
    optional RoadAreaType type = 1;
    optional uint32 id = 2; // RoadJunction/RoadEntrance等结构中的id， 可通过type + id唯一检索
  }

  message RoadJunction {
    enum RoadJunctionType {
      RoadJunctionType_Unknown = 0;
      RoadJunctionType_Cross = 1;
      RoadJunctionType_TShape = 2;
      RoadJunctionType_YShape = 3;
      RoadJunctionType_VRU = 4;
      RoadJunctionType_Roundabout = 5;
      RoadJunctionType_Multiple = 6;
      RoadJunctionType_Straight = 7;
    }
    optional uint32 id = 1;
    optional RoadJunctionType type = 2;
    optional RoadAreaBox area_box = 3;
    optional OnRouteProperty on_route_property = 4; // reserved
  }

  message RoadEntrance {
    enum RoadEntranceType {
      RoadEntranceType_Unknown = 0;
      RoadEntranceType_Straight = 1;
      RoadEntranceType_LeftTurn = 2;
      RoadEntranceType_RightTurn = 3;
      RoadEntranceType_UTurn = 4;
      RoadEntranceType_Ramp = 5;
      RoadEntranceType_UrbanTunel = 6;
      RoadEntranceType_Import = 7;
      RoadEntranceType_Export = 8;
      RoadEntranceType_SubPath_Left = 9;
      RoadEntranceType_SubPath_Right = 10;
      RoadEntranceType_OpeningUTurn = 11;
      RoadEntranceType_YellowdashUTurn = 12;
    }
    optional uint32 id = 1;
    optional RoadEntranceType type = 2;
    optional RoadAreaBox area_box = 3;
    optional GoalRegion goal_region = 4;
    optional OnRouteProperty on_route_property = 5;      // reserved
  }

  message RoadNoEntry {
    enum RoadNoEntryType {
      RoadNoEntryType_Unknown = 0;
      RoadNoEntryType_JunctionWrongSideStopline = 1;
      RoadNoEntryType_VehicleMergeWay = 2;
      RoadNoEntryType_NonmotorLane = 3;
    }
    optional uint32 id = 1;
    optional RoadNoEntryType type = 2;
    optional RoadAreaBox area_box = 3;
  }

  message RoadConstruction {
    enum RoadConstructionType {
      RoadConstructionType_Unknown = 0;
      RoadConstructionType_Isolation = 1;
      RoadConstructionType_ConstructionSign = 2;
    }
    optional uint32 id = 1;
    optional RoadConstructionType type = 2;
    optional RoadAreaBox area_box = 3;
  }

  message RoadZone {
    enum RoadZoneType {
      RoadZoneType_Unknown = 0;
      RoadZoneType_WaitZone = 1;
      RoadZoneType_DiversionArea = 2;
      RoadZoneType_WaitZone_TurnLeft = 3;
      RoadZoneType_WaitZone_TurnRight = 4;
      RoadZoneType_WaitZone_Straight = 5;
      RoadZoneType_WaitZone_TurnAround = 6;
    }
    optional uint32 id = 1;
    optional RoadZoneType type = 2;
    optional RoadAreaBox area_box = 3;
    optional OnRouteProperty on_route_property = 4;     // 通过此字段 判断待转区是否位于路径上
  }

  message DynamicObjectRegion {
    optional uint32 id = 1;
    optional RoadAreaBox area_box = 2;
    optional float confidence = 3;
    optional OnRouteProperty on_route_property = 4;    
  }

  repeated RoadJunction junctions = 1;  // 路口场景：十字路口、丁字路口、环岛路口等
  repeated RoadEntrance entrances = 2;  // 豁口场景：直行/左转/右转/掉头方向入口、匝道口、右转专用道、城市隧道口、主路转无名支路
  repeated RoadNoEntry no_entries = 3;  // 禁驶场景：逆行口、他车合入口等
  repeated RoadConstruction constructions = 4;  // 施工场景：占道施工、现实变更
  repeated RoadZone zones = 5;          // 特殊区场景：待转区、下客区等。
  repeated DynamicObjectRegion od_regions = 10; // 动态车辆占据的region, 用于表达通行方向
  repeated NaviGoalRegion navi_goal_region = 20; // 按照导航经过顺序排序后的GoalRegion
}

message MannerDebug {
  repeated MannerPoint_3D nav_routing_points = 1;  // nav link process routing path, only tens of points << 3 * 100 * 4B = 1.2kB
  optional NaviPathInputDebug nav_input = 2;

  map<string, string> module_debug = 10000 [deprecated = true]; // 无法保证顺序，不推荐使用
  
  message DebugString {
    optional string key = 1;
    optional string value = 2;
  }
  repeated DebugString debug_strings = 10001;
}

