enum ClassGeneral{
  SubClass_GOUndefined = 0;
  SubClass_GOGuardrail = 1;
  SubClass_GOCone = 2;
  SubClass_GOBillboard = 3; //ObsType_OverheadObject
  SubClass_GOManholeCover = 4;
  SubClass_GOBarrier = 5; //deprecated
  SubClass_GOObstLeft = 6;//ObsType_ObstructionLeft
  SubClass_GOObstRight = 7;//ObsType_ObstructionRight
  SubClass_GOObstUP = 8;//ObsType_ObstructionUP
  SubClass_GOObstDown = 9;//ObsType_ObstructionBW
  SubClass_GOFishBoneLeft = 10;//ObsType_FishboneLeft
  SubClass_GOFishBoneRight = 11;//ObsType_FishboneRight
  SubClass_GOObstInvalid = 12;
  SubClass_GOShortPole = 13;//short pole
  SubClass_GOBarrel = 14;
  SubClass_GORedWarningSign= 15;
  SubClass_GOIndicatorArrowLeft= 16;
  SubClass_GOIndicatorArrowRight= 17;
  SubClass_GOIndicatorArrowBoth= 18;
  SubClass_GOIndicatorArrowLeftUp= 19;
  SubClass_GOIndicatorArrowLeftDown= 20;
  SubClass_GOIndicatorArrowRightUp= 21;
  SubClass_GOIndicatorArrowRightDown= 22;
  SubClass_GOMetalFence= 23;
  SubClass_GOWarningPole= 24;
  SubClass_GOCircularColumn= 25;
  SubClass_GOStoneColumn= 26;
  SubClass_GOOtherImpermanentObject= 27;
  SubClass_GOOtherPermanentObject= 28;
}

