syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;

import "common/map_engine/map_geometry.proto";
import "common/map_engine/hd_common.proto";


message HdCrosswalk {
  optional uint64 id = 1;

  // The surface marking of crosswalk.
  optional MapPolygon surface = 2;

  // The lane ids which touch this crosswalk.
  repeated uint64 lane_id = 3;
  optional GeometryConfidenceScore geometry_confidence = 4;
  enum CrosswalkType{
    CROSSWALK = 9;
    CROSSWALK_JUNCTION_BICYCLE = 52010;
  }
  optional CrosswalkType crosswalk_type = 5;
}

message HdCrosswalkList {
  repeated HdCrosswalk crosswalk_list = 1;
}
