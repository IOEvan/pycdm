syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;

import "common/map_engine/map_geometry.proto";

message NadSdLinkLaneInfo {
  optional uint64 sd_link_id = 1;
  repeated uint32 lane_seq_number = 2;
}

message NadSdTrafficLightInfo {
  optional string id = 1;
  // coordinate of the geometric center
  optional MapPoint center = 2;
  // horizontal length
  optional double width = 3;
  // vertical length
  optional double length = 4;
  // The heading of front surface
  // e.g. 0° stand for north
  //      90° stand for east
  optional double relative_height = 5;
  optional double heading = 6;
  repeated NadSdLinkLaneInfo sd_link_lanes = 7;
}
