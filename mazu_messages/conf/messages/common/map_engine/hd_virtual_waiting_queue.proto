syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;

import "common/map_engine/map_geometry.proto";

message HdVirtualWaitingQueue {
  optional string event_id = 1;
  optional MapPolyline points = 2; // 多个点组成的 一个 poly_line

  message RefLane {
    optional uint64 lane_id = 1;
    optional double offset_start = 2; // unit: m
    optional double offset_end = 3; // unit: m
  }
  repeated RefLane ref_lanes = 3; // 关联的laneid列表

  message RefLink {
    optional uint64 link_id = 1;
    optional double offset_start = 2; // unit: m
    optional double offset_end = 3; // unit: m
  }
  repeated RefLink ref_links = 4; // 关联的linkid列表
}

