syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;

import "common/map_engine/map_geometry.proto";
import "common/map_engine/hd_link_info.proto";


message HdWaitingZone {
  optional uint64 id = 1;

  // The surface of waiting zone.
  optional MapPolygon surface = 2;

  // 关联道路特征点
  repeated LinkFeaturePoint link_feature_points = 3;

  // The lane ids which touch this waiting zone.
  repeated uint64 lane_ids = 4;

  /*zone类型
  1：换电泊车等候区
  2：可行驶面（预留）
  3：行政区划面（预留）
  4：停车场地理围栏
  5：PSP地理围栏
  6：点云地理围栏
  7：匝道地理围栏
  8：园区地理围栏
  */
  optional uint32 zone_type = 5;
  // 标识局部地图的全局唯一id，应用于停车场、服务区
  optional string map_id = 6;
}
