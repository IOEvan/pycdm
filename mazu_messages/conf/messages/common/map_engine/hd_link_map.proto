// @owner: jianxiao.hu@nio.com

syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

import "common/map_engine/hd_link_info.proto";
import "common/map_engine/hd_road_geo_line.proto";
import "common/map_engine/hd_virtual_junction.proto";
import "common/map_engine/hd_parking_area.proto";
import "common/map_engine/hd_poi.proto";
import "common/map_engine/hd_trajectory.proto";

message HdLinkMap {
  repeated HdLinkInfo link_list = 1;
  repeated HdRoadGeoLine road_geo_line_list = 2;
  repeated HdVirtualJunction virtual_junction_list = 3;
  repeated HdParkingArea parking_area_list = 4;
  repeated HdPoi poi_list = 5;
  repeated HdExperienceTrajectory experience_trajectory = 6;

  optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin 
  optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
  optional uint64 publish_ptp_ts = 536870907; // publish ptp timestamp, uint in nanosec
  optional string publisher_id = 536870909;  // uuid of the publisher
  optional uint64 counter = 536870910;       // message counter
  optional uint64 publish_ts = 536870911;    // publish utc timestamp; unit : nanosecond
}
