syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";
import "common/vehicle_out/fourd_pred_events.proto";

message FourdHmiDisplay{
    optional uint32 ComfortIndexBefore = 1;
    optional uint32 ComfortIndexAfter = 2;
    optional uint32 ComfortIndexBeforeNumeric = 3;
    optional uint32 ComfortIndexAfterNumeric = 4;
    optional uint32 TripStatus = 5;
    optional uint32 FourdModReq = 6;
    optional uint32 FourdLvlModReq = 7;
    optional uint32 FourdDampModReq = 8;
    optional uint32 FourdSrcModReq = 9;
    optional uint32 FourdDampgIndexFrntReb = 10;
    optional uint32 FourdDampgIndexFrntCmps = 11;
    optional uint32 FourdDampgIndexReReb = 12;
    optional uint32 FourdDampgIndexReCmps = 13;
    repeated uint32 FourdTripStc = 14;
    repeated FourdEventInfo FourdEvent = 15;
    // @begin segscope: NT3
    optional bool   HmiDispEnbl = 16;
    optional uint32 FourdFctSts = 17;
    repeated bytes FourdHighlightDisp = 18;
    optional uint32 FourdCtrlSts = 19;
    // @end segscope: NT3    
    
    optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts = 536870907;               // publish ptp timestamp, uint in nanosec
    optional string publisher_id = 536870909;                 // uuid of the publisher
    optional uint64 counter = 536870910;                      // message counter
    optional uint64 publish_ts = 536870911;                   // publish timestamp; unit : nanosecond
}
