    enum PowStation_OutReq_e{
        PowStation_OutReq_no_request       = 0;//no request
        PowStation_OutReq_request       = 1;//request
    }
    optional PowStation_OutReq_e PowStation_OutReq    = 12;                           //@Channel:CHASSIS @Message:0x151 @Signal:PowStation_OutReq
                                                                                      //@Channel:CHASSIS2 @Message:0x154 @Signal:PowStation_OutReq_s
