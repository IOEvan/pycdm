    optional VLC_Fctseln_e VLC_Fctseln =10;                            //@Channel:CHASSIS @Message:0x151 @Signal:VLC_Fctseln
                                                                       //@Channel:CHASSIS2 @Message:0x154 @Signal:VLC_Fctseln_s
    optional float VLC_xTarA        = 11;                              //@Channel:CHASSIS @Message:0x151 @Signal:VLC_xTarA
