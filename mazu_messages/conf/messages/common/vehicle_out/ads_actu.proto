    reserved 9 ;
    enum VlcReqFctType_e{
        VlcReqFct_Off       = 0;//Off
        VlcReqFct_DA        = 1;//Drive Assist
        VlcReqFct_FCTA      = 2;//FCTA_B
        VlcReqFct_RCTA      = 3;//RCTA_B
        VlcReqFct_SSD       = 4;//NAD_SSD
