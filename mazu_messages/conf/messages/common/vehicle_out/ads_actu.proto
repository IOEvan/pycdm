        VLCShtDwn_Fast = 1;//Fast Off
        VLCShtDwn_Imdt = 2;//Immediate Off
        VLCShtDwn_Init = 3;//No request
    }
    required VLCShtDwnModType_e VLCShutdownModReq = 8;      //@Channel:CHASSIS @Message:0x151 @Signal:VLC_ShutdownModReq
                                                                //@Channel:CHASSIS2 @Message:0x154 @Signal:VLC_ShutdownModReq_s
    enum VLC_Fctseln_e{
        VLC_Fctseln_Off       = 0;//Off
        VLC_Fctseln_DA        = 1;//Drive Assist
        VLC_Fctseln_FCTA      = 2;//FCTA_B
        VLC_Fctseln_RCTA      = 3;//RCTA_B
        VLC_Fctseln_SSD       = 4;//NAD_SSD
        VLC_Fctseln_USD       = 5;//NAD_USD
        VLC_Fctseln_EAS       = 6;//EAS
        VLC_Fctseln_PSP       = 7;//PSP
        VLC_Fctseln_SAPA      = 8;//SAPA
        VLC_Fctseln_VPPS      = 9;//PSAP VPPS
        VLC_Fctseln_NBS       = 10;//NBS
        VLC_Fctseln_RPA_in    = 11;//RPA_in RPSAP_out
        VLC_Fctseln_ODS       = 12;//ODS
        VLC_Fctseln_RPSAP_in  = 13;//RPSAP_in
        VLC_Fctseln_RCM       = 14;//RCM
