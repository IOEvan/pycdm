//AD Actuator control request to Vehicle
syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;

import "common/vehicle_in/veh_enum_type.proto";
import "common/vehicle_out/fourd_chs3_opt.proto";

message LngLwSpdCtrlIf{
    reserved 11;
    enum LlcActvIfType_e{
        LlcActvIf_Default= 0 ;//Default
        LlcActvIf_SAPA   = 1 ;//SAPA
        LlcActvIf_VPPS   = 2 ;//VPPS
        LlcActvIf_NBS    = 3 ;//NBS
        LlcActvIf_RPA_In = 4 ;//RPA-in
        LlcActvIf_Rsrvd5 = 5 ;//Reserved
        LlcActvIf_Rsrvd6 = 6 ;//Reserved
        LlcActvIf_Rsrvd7 = 7 ;//Reserved
        LlcActvIf_Rsrvd8 = 8 ;//Reserved
        LlcActvIf_Rsrvd9 = 9 ;//Reserved
        LlcActvIf_Rsrvd10= 10;//Reserved
        LlcActvIf_Rsrvd11= 11;//Reserved
        LlcActvIf_Rsrvd12= 12;//Reserved
        LlcActvIf_Rsrvd13= 13;//Reserved
        LlcActvIf_Rsrvd14= 14;//Reserved
        LlcActvIf_Rsrvd15= 15;//Reserved
    }
    required LlcActvIfType_e FctSeln   = 1;                 //@Channel:CHASSIS @Message:0x6D @Signal:ADC1_LLC_FctSeln

    enum CtrlModType_e{
        CtrlMod_NoReq = 0;//No request
        CtrlMod_Dstnc = 1;//Distance control
        CtrlMod_Spd   = 2;//Speed control
        CtrlMod_Rsrvd3= 3;//Reserved
    }
    required CtrlModType_e CntrlModReq = 2;                 //@Channel:CHASSIS @Message:0x6D @Signal:ADC1_LLC_CntrlModReq

    enum LlcStType_e{
        LlcSt_Init   = 0;//Init
        LlcSt_Stdby  = 1;//Standby
        LlcSt_Actv   = 2;//Active
        LlcSt_Suspend= 3;//Suspend
        LlcSt_Abort  = 4;//Abort
        LlcSt_Rsrvd5 = 5;//Reserved
        LlcSt_Rsrvd6 = 6;//Reserved
        LlcSt_Rsrvd7 = 7;//Reserved
    }
    required LlcStType_e LLCSt = 3;                         //@Channel:CHASSIS @Message:0x6D @Signal:ADC1_LLC_FctSt

    enum TarGrReqType_e{
        TarGr_NoReq = 0;//No request
        TarGr_Drv   = 1;//Driving
        TarGr_Rvrs  = 2;//Reverse
        TarGr_Park  = 3;//Parking
    }
    required TarGrReqType_e TarGearReq = 4;                 //@Channel:CHASSIS @Message:0x6D @Signal:ADC1_TarGearReq
    required float TarSpdKph           = 5;                 //@Channel:CHASSIS @Message:0x6D @Signal:ADC1_LLC_TarSpd
    required float StopDst             = 6;                 //@Channel:CHASSIS @Message:0x6D @Signal:ADC1_LLC_StopDst

    enum LlcShtDwnModType_e{
       LlcShtDwn_NoReq   = 0;//No request
       LlcShtDwn_CmftBrk = 1;//Comfort brake
       LlcShtDwn_HardBrk = 2;//Emergency brake
       LlcShtDwn_RlsTkOvr= 3;//Release to take over
       LlcShtDwn_NormalBrk = 4;//Normal brake
    }
    required LlcShtDwnModType_e ShutdownModReq = 7;         //@Channel:CHASSIS @Message:0x6D @Signal:ADC1_LLC_ShutdownModReq
    enum EpbReqType_e{
        EpbReq_UnDtrmnd = 0;//Undetermined
        EpbReq_NoReq    = 1;//No request
        EpbReq_Apply    = 2;//Apply request
        EpbReq_Rsrvd3   = 3;//Reserved
    }
    required EpbReqType_e EPBReq = 8;                       //@Channel:CHASSIS @Message:0x6D @Signal:ADC1_EPBReq
                                                                //@Channel:CHASSIS2 @Message:0x6E @Signal:ADCs_EPBReq
    optional float VehDstToVSlot=9;                        //@Channel:CHASSIS @Message:0x190 @Signal:VehDstToVSlot
    optional float SlopeDstOffset=10;                      //@Channel:CHASSIS @Message:0x190 @Signal:SlopeDstOffset

    enum VCU_ObjModTyp_e {
        VCU_ObjModTyp_off=0;
        VCU_ObjModTyp_Vslot=1;
        VCU_ObjModTyp_Speed_bump=2;
        VCU_ObjModTyp_pit=3;
        VCU_ObjModTyp_up_hill=4;
        VCU_ObjModTyp_down_hill=5;
        VCU_ObjModTyp_reserved1=6;
        VCU_ObjModTyp_reserved2=7;
    }
    optional VCU_ObjModTyp_e VCU_ObjModTyp=12;  //@Channel:CHASSIS @Message:0x190 @Signal:VCU_ObjModTyp
    optional float VCU_ObjModLonDst=13;      //@Channel:CHASSIS @Message:0x190 @Signal:VCU_ObjModLonDst
    optional float VCU_ObjModLatDst=14;   //@Channel:CHASSIS @Message:0x190 @Signal:VCU_ObjModLatDst

    enum PowerStationGen_e{
        none= 0;
        generation_one    = 1;
        generation_two    = 2;
        generation_three  = 3;
        generation_four   = 4;
    }
    optional PowerStationGen_e PowerStationGen = 15;             //@Channel:CHASSIS @Message:0x190 @Signal:PowerStationGen

    enum ADC_VehAutoHoldReq_e{
        No_request = 0;
        Request = 1;
    }
    optional ADC_VehAutoHoldReq_e ADC_VehAutoHoldReq = 16;      //@Channel:CHASSIS @Message:0x190 @Signal:ADC_VehAutoHoldReq
}

message LatCtrlIf{
reserved 11,12;
    optional QfZeroAsVld_e ACIReqVld    = 1;                //@Channel:CHASSIS @Message:0x70 @Signal:ADC1_EPSACIReqVal
                                                                //@Channel:CHASSIS2 @Message:0x54 @Signal:ADCs_EPSACIReqVal
    optional float  ACIReqSAE           = 2;                //@Channel:CHASSIS @Message:0x70 @Signal:ADC1_EPSACIReq
                                                            //@Comment:ADC1_EPSACIReq * -1
                                                                //@Channel:CHASSIS2 @Message:0x54 @Signal:ADCs_EPSACIReq
                                                                //@Comment:ADCs_EPSACIReq * -1
    optional float  ACISafLimAngDyn     = 3;                //@Channel:CHASSIS @Message:0x70 @Signal:ADC1_EPSACISafLim_AngDyn
                                                                //@Channel:CHASSIS2 @Message:0x54 @Signal:ADCs_EPSACISafLim_AngDyn
    optional uint32 ACISafLimAngRM      = 4;                //@Channel:CHASSIS @Message:0x70 @Signal:ADC1_EPSACISafLim_AngRM
                                                                //@Channel:CHASSIS2 @Message:0x54 @Signal:ADCs_EPSACISafLim_AngRM
    optional float ACISafLimAngDynOffs  = 5;                //@Channel:CHASSIS @Message:0x70 @Signal:ADC1_EPSACISafLim_AngDynOffs
                                                                //@Channel:CHASSIS2 @Message:0x54 @Signal:ADCs_EPSACISafLim_AngDynOffs
    optional uint32 ACISafLimRate       = 6;                //@Channel:CHASSIS @Message:0x70 @Signal:ADC1_EPSACISafLim_Rate
                                                                //@Channel:CHASSIS2 @Message:0x54 @Signal:ADCs_EPSACISafLim_Rate
    optional uint32 ACIRampRate         = 7;                //@Channel:CHASSIS @Message:0x70 @Signal:ADC1_EPSACIRampRate
                                                                //@Channel:CHASSIS2 @Message:0x54 @Signal:ADCs_EPSACIRampRate
    optional uint32 ACISafLimAngLM      = 8;                //@Channel:CHASSIS @Message:0x70 @Signal:ADC1_EPSACISafLim_AngLM
                                                                //@Channel:CHASSIS2 @Message:0x54 @Signal:ADCs_EPSACISafLim_AngLM
    optional uint32 ACISafLimMode       = 9;                //@Channel:CHASSIS @Message:0x70 @Signal:ADC1_EPSACISafLim_Mode
                                                                //@Channel:CHASSIS2 @Message:0x54 @Signal:ADCs_EPSACISafLim_Mode
    optional QfZeroAsVld_e CTIReqVal    = 10;               //@Channel:CHASSIS @Message:0x71 @Signal:ADC1_EPSCTIReqVal
                                                                //@Channel:CHASSIS2 @Message:0x55 @Signal:ADCs_EPSCTIReqVal
    optional float  CTIReqSAE           = 13;               //@Channel:CHASSIS @Message:0x71 @Signal:ADC1_EPSCTIReq
                                                            //@Comment:ADC1_EPSCTIReq * -1
                                                                //@Channel:CHASSIS2 @Message:0x55 @Signal:ADCs_EPSCTIReq
                                                                //@Comment:ADCs_EPSCTIReq * -1

    enum StrIfReqType_e{
        StrIf_NoReq     = 0;//no request
        StrIf_AciOvrL   = 1;//ACI with overlay request
        StrIf_AciOvrLHvi= 2;//ACI with overlay request & HVI request
        StrIf_AciOvrD   = 3;//ACI with override request
        StrIf_AciOvrDHvi= 4;//ACI with override request & HVI request
        StrIf_Cti       = 5;//CTI request
        StrIf_VmcMti    = 6;//MTI request (VMC)
        StrIf_Hvi       = 7;//HVI request
    }
    optional StrIfReqType_e StrIFReq    = 14;                //@Channel:CHASSIS @Message:0x71 @Signal:ADC1_EPSReqTyp
                                                                //@Channel:CHASSIS2 @Message:0x55 @Signal:ADCs_EPSReqTyp
    optional uint32 HVIReq              = 15;                //@Channel:CHASSIS @Message:0x71 @Signal:ADC1_EPSHVIReq
                                                                //@Channel:CHASSIS2 @Message:0x55 @Signal:ADCs_EPSHVIReq
    optional QfZeroAsVld_e HVIReqVld    = 16;                //@Channel:CHASSIS @Message:0x71 @Signal:ADC1_EPSHVIReqVal
                                                                //@Channel:CHASSIS2 @Message:0x55 @Signal:ADCs_EPSHVIReqVal
    enum ACITsuSup_e{
        ACITsuSup_set1=0;
        ACITsuSup_set2=1;
        ACITsuSup_set3=2;
        ACITsuSup_set4=3;
        ACITsuSup_set5=4;
        ACITsuSup_set6=5;
        ACITsuSup_set7=6;
        ACITsuSup_set8=7;
    }
    optional  ACITsuSup_e ACITsuSup           = 17;               //@Channel:CHASSIS @Message:0x71 @Signal:ADC1_EPSACITsuSup
                                                                      //@Channel:CHASSIS2 @Message:0x55 @Signal:ADCs_EPSACITsuSup
    enum ACIOvrdThr_e{
        ACIOvrdThr_threshold_1 =0;
        ACIOvrdThr_threshold_2 =1;
        ACIOvrdThr_threshold_3 =2;
        ACIOvrdThr_threshold_4 =3;
        ACIOvrdThr_threshold_5 =4;
        ACIOvrdThr_threshold_6 =5;
        ACIOvrdThr_threshold_7 =6;
        ACIOvrdThr_threshold_8 =7;
    }
    optional ACIOvrdThr_e ACIOvrdThr          = 18;               //@Channel:CHASSIS @Message:0x71 @Signal:ADC1_EPSACIOvrThr
                                                                        //@Channel:CHASSIS2 @Message:0x55 @Signal:ADCs_EPSACIOvrThr
    // @begin segscope: NT3
    enum SrcTyp_e {
        ADF_Primary   = 0;
        ADF_Redundant = 1;
        Chassis_Main  = 2;
        Src_Not_Know  = 8;
    }
    optional SrcTyp_e SrcTyp              = 19;
    optional uint32 acp_req_typ           = 20;     //SbW 0:Full COPY 1:SMALL COPY 2:NO COPY 3:RESERVED  
    // @end segscope: NT3
}

message SafeStateInfo{
    required uint32 SafetyState1 = 1;                      //@Channel:CHASSIS @Message:0x6D @Signal:ADC1_SafeState1
                                                                //@Channel:CHASSIS2 @Message:0x6E @Signal:ADCs_SafeState1
}


