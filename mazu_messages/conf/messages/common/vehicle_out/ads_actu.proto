    required bool   EBADecelReq = 5 ;                       //@Channel:CHASSIS @Message:0x7D @Signal:EBADecelReq
    required bool   ABPReq      = 6 ;                       //@Channel:CHASSIS @Message:0x7D @Signal:ABPReq
    required uint32 AWBSnvtyLvl = 7 ;                       //@Channel:CHASSIS @Message:0x7D @Signal:AWBSnvtyLvl
    required bool   AWBReq      = 8 ;                       //@Channel:CHASSIS @Message:0x7D @Signal:AWBReq
    required uint32 ABASnvtyLvl = 9 ;                       //@Channel:CHASSIS @Message:0x7D @Signal:ABASnvtyLvl
    required bool   ABAReq      = 10;                       //@Channel:CHASSIS @Message:0x7D @Signal:ABAReq
    optional bool   AEBDecelReq_DummyForDVR    =11;         //@Channel:CHASSIS @Message:0x7E @Signal:AEBDecelReq_DummyForDVR
