                                                                //@Channel:CHASSIS2 @Message:0x154 @Signal:VLC_MaxJerkA_s
    required bool VLCDrvOffReq    = 6;                      //@Channel:CHASSIS @Message:0x151 @Signal:VLC_DriveOffReq
                                                                //@Channel:CHASSIS2 @Message:0x154 @Signal:VLC_DriveOffReq_s
    required bool VLCDecToStopReq = 7;                      //@Channel:CHASSIS @Message:0x151 @Signal:VLC_DecelToStopReq
                                                                //@Channel:CHASSIS2 @Message:0x154 @Signal:VLC_DecelToStopReq_s
