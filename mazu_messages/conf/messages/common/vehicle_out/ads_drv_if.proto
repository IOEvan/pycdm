        CutInSt_False   = 0;//no cut-in detected
        CutInSt_LeSide  = 1;//object cutting in from left side became new longitudinal control target
        CutInSt_RiSide  = 2;//object cutting in from right side became new longitudinal control target
        CutInSt_BothSide= 3;//objects cutting in from both sides considered for longitudinal control
    }

    enum ObjectIntruType_e{
        ObjIntru_False = 0;//no free space intrusion detected
        ObjIntru_Left  = 1;//object intruding from left side
        ObjIntru_Right = 2;//object intruding from right side
