//AD function status and interaction interface to driver
syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;

import "common/vehicle_in/veh_enum_type.proto";

enum LnAsstStType_e{
    LnAstSt_Off     = 0;//Lane Assist off
    LnAstSt_Stdby   = 1;//Lane Assist standby
    LnAstSt_Actv    = 2;//Lane Assist active
    LnAstSt_Fail    = 3;//Lane Assist failure
    LnAstSt_CmrBlckd= 4;//Camera blocked
    LnAstSt_Rsrvd5  = 5;//Reserved
    LnAstSt_Rsrvd6  = 6;//Reserved
    LnAstSt_Rsrvd7  = 7;//Reserved
}

enum LnLineDispStType_e{
    LnLnDisp_NotDetected = 0;//line not detected
    LnLnDisp_Detected    = 1;//line detected
    LnLnDisp_LDWLKS2Warn = 2;//LDW warning or LKA stage2 warning
    LnLnDisp_LKA1Warn    = 3;//LKA stage1 warning
    LnLnDisp_Pilot       = 4;//line as L2 Pilot target
    LnLnDisp_AlcPrepar   = 5;//line active lane change-preparing
    LnLnDisp_AlcOngoing  = 6;//line active lane change-ongoing
    LnLnDisp_AlcAbort    = 7;//line active lane change-aborted
}

enum ESFWarningSts_e{
    NoRequest              = 0;//no request
    OncomingLeftWarn       = 1;//Oncoming warning left
    OvertakingLeftWarn     = 2;//Overtaking warning left
    OncomingRightWarn      = 3;//Oncoming warning right
    OvertakingRightWarn    = 4;//Overtaking warning right
}

message SpdDispAndCfgInfo{
    reserved 1,2,3,4,5,6;

    enum SAS_SLIFSts_e{
        Init           = 0;//INIT (default)
        GPS_Disabled   = 1;//GPS disabled
        TSR            = 2;//TSR-only
        Map            = 3;//Map-only
        Fusion         = 4;//MAP & TSR fusion
        Fault          = 5;//Fault
    }

    optional SAS_SLIFSts_e SAS_SLIF_State        = 7;           //@Channel:ADAS @Message:0x150 @Signal:SAS_SLIF_State

    enum SAS_SLIFWarnTrgSts_e{
        NoWarning           = 0;//no warning (default)
        Stg1_SpdWarning     = 1;//speed warning (stage 1)
        Stg2_SpdWarning     = 2;//speed warning (stage 2)
        Snow_SpdWarning     = 3;//speed warning (for condition snow)
    }
    optional SAS_SLIFWarnTrgSts_e SAS_SLWF_WarnTrigger        = 8;           //@Channel:ADAS @Message:0x150 @Signal:SAS_SLWF_WarnTrigger


    enum SAS_SpdLmtAttr_e{
        NoDisplay           = 0;//[default]no display
        Warning             = 1;//warning (color)
        HighConfidence      = 2;//high confidence (color)
        LowConfidence       = 3;//low confidence (gray)
    }

    optional SAS_SpdLmtAttr_e SAS_SpeedLimitAttribute        = 9;           //@Channel:ADAS @Message:0x150 @Signal:SAS_SpeedLimitAttribute

    enum SAS_SpdLmtTkOv_e{
        None          = 0;//no takeover possible [default]
        UpBtn_TkOv    = 1;//manual takeover possible via up button
        DownBtn_TkOv  = 2;//manual takeover possible via down button
        AutoAdjust    = 3;//auto set-speed adjustment ongoing
    }

    optional SAS_SpdLmtTkOv_e SAS_SpeedLimitTakeover        = 10;           //@Channel:ADAS @Message:0x150 @Signal:SAS_SpeedLimitTakeover
    optional bool SAS_SpeedLimitUnit        = 11;                           //@Channel:ADAS @Message:0x150 @Signal:SAS_SpeedLimitUnit
    optional uint32 SAS_SpeedLimitValue        = 12;                        //@Channel:ADAS @Message:0x150 @Signal:SAS_SpeedLimitValue
    optional bool SAS_SupSignAttribute        = 13;                         //@Channel:ADAS @Message:0x150 @Signal:SAS_SupSignAttribute
    optional uint32 SAS_SupSignType        = 14;                            //@Channel:ADAS @Message:0x150 @Signal:SAS_SupSignType

    optional uint32 SAS_LocalHzrd        = 15;                              //@Channel:ADAS @Message:0x228 @Signal:SAS_LocalHazards
    optional uint32 SAS_RdFtrWarnSign        = 16;                          //@Channel:ADAS @Message:0x228 @Signal:SAS_RoadFeatureWarningSign
    optional uint32 SAS_TrffcLghtSts        = 17;                           //@Channel:ADAS @Message:0x228 @Signal:SAS_TrafficLightSts

    enum SAS_SpeedLimitValue2_e {       // PNC app should later add logic to match this into an integer variable.
        SpeedLimitValue2_20     = 0;
        SpeedLimitValue2_25     = 1;
        SpeedLimitValue2_30     = 2;
        SpeedLimitValue2_35     = 3;
        SpeedLimitValue2_40     = 4;
        SpeedLimitValue2_45     = 5;
        SpeedLimitValue2_50     = 6;
        SpeedLimitValue2_55     = 7;
        SpeedLimitValue2_60     = 8;
        SpeedLimitValue2_65     = 9;
        SpeedLimitValue2_70     = 10;
        SpeedLimitValue2_75     = 11;
        SpeedLimitValue2_80     = 12;
        SpeedLimitValue2_85     = 13;
        SpeedLimitValue2_90     = 14;
        SpeedLimitValue2_95     = 15;
        SpeedLimitValue2_100    = 16;
        SpeedLimitValue2_105    = 17;
        SpeedLimitValue2_110    = 18;
        SpeedLimitValue2_115    = 19;
        SpeedLimitValue2_120    = 20;
        SpeedLimitValue2_125    = 21;
    }
    optional SAS_SpeedLimitValue2_e SAS_SpeedLimitValue2    = 91;           //@Channel:ADAS @Message:0x275 @Signal:SAS_SpeedLimitValue2

    enum SAS_SpeedLimitAttribute2_e {
        NoIndication    = 0;
        RampRight       = 1;
        RampLeft        = 2;
    }
    optional SAS_SpeedLimitAttribute2_e SAS_SpeedLimitAttribute2 = 92;      //@Channel:ADAS @Message:0x275 @Signal:SAS_SpeedLimitAttribute2
}



message NpIfInfo{
    reserved 1,2,3,4,5,6,7,8,10,15,18,19,20,21,22,23,24,25,26,29,30,31,32,33,34,35,37,38,47,49,50,52,53,60,63,72,78;

