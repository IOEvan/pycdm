    }

    enum AccDclVisType_e{
        AccDecl_NoDec   = 0;//no deceleration imminent
        AccDecl_AboutDec= 1;//decel imminent
        AccDecl_SoftDec = 2;//soft deceleration
        AccDecl_MidDec  = 3;//mid strength deceleration
