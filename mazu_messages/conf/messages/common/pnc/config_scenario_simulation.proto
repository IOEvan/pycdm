message EHYTppOutputsInfo {
  optional uint64 frame_id = 1;
  optional uint64 timestamp = 2;
  optional EHYTppOutputs tpp_outputs = 3;
}
message ScenarioEHYTppOutputs {
  repeated EHYTppOutputsInfo tpp_outputs_infos = 1;
