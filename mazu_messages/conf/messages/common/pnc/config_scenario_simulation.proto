import "common/pnc/planner_log.proto";
import "common/pnc/static_map.proto";
import "common/pnc/world_model_log.proto";
import "common/localization/global_localization.proto";
import "np/apps/ehy_obf_outputs.proto";
import "common/map_engine/hd_map.proto";
import "common/map_engine/global_hd_routes.proto";
