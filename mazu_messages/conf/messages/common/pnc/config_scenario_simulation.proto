message ArbOutInfo {
  optional uint64 frame_id = 1;
  optional uint64 timestamp = 2;
  optional FunctionRequestBook arb_out = 3;
}
message ScenarioArbOut {
  repeated ArbOutInfo arb_out_infos = 1;
