syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/pnc/geometry.proto";
import "common/pnc/driving_safety_mp_type.proto";

message LinearIntep_1D {
  repeated double bp_x = 1;
  repeated double data = 2;
}
message LinearIntep_2D {
  repeated double bp_x = 1;
  repeated double bp_y = 2;
  message row_data {
    repeated double row_data = 3;
  }
  repeated row_data data = 3;
}

message ComfortableMpConf {}

message EmergentMpConf {}

message MpScenarioConf {
  enum ScenarioType {
    COMFORTABLE_SCENENARIO = 0;  // default type

    EMERGENT_SCENENARIO = 1;
    ESCAPE_TOWER_SCENENARIO = 2;
  }
  optional ScenarioType scenario_type = 1;
  oneof scenario_config {
    ComfortableMpConf comfortable_conf = 2;
    EmergentMpConf emergent_conf = 3;
  };

  // start from 100
  repeated MpTaskConf task_list = 100;
}

// lon mpc config
message LonMPCConstraintManager {
  optional LinearIntep_2D ttc_table = 1;
  optional LinearIntep_2D thw_table = 2;
  optional double ttc_base_weight = 3 [default = 0.1];
  optional double thw_base_weight = 4 [default = 0.1];
  optional LinearIntep_1D drv_acc_limiter = 5;
  optional LinearIntep_1D drg_acc_limiter = 6;
  optional LinearIntep_1D neg_acc_inc_jerk_limiter = 7;
  optional LinearIntep_1D neg_acc_dec_jerk_limiter = 8;
  optional LinearIntep_1D pos_acc_inc_jerk_limiter = 9;
  optional LinearIntep_1D pos_acc_dec_jerk_limiter = 10;
  optional double jerk_stitch_weight = 11 [default = 0.1];
  optional double cutin_thw_add_speed = 12 [default = 0.08];
  optional double safety_weight = 13 [default = 1000.0];
  optional LinearIntep_1D soft_brake_acc_limiter = 14;
  optional double soft_brake_base_weight = 15 [default = 0.1];
  optional double s_buffer_offset_m = 16 [default = 0.0];
  optional double creep_max_ref_v_mps2 = 17 [default = 2.0];
  optional double creep_pose_loop_kp_gain = 18 [default = 0.5];
  optional double creep_ref_v_weight = 19 [default = 1.0];
  optional double bound_soft_buffer_m = 20 [default = 1.0];
  optional double anti_reverse_weight = 21 [default = 1.0];
  optional LinearIntep_1D refined_soft_constraint_s_buffer = 22;
  optional double cutin_thw_offset_sec = 23;
  optional LinearIntep_1D cutin_thw_add_speed_table = 24;
}

message LonMPCReferenceManager {
  optional double max_speed_limit_mps = 1;
  optional double ref_s_tar_accel_mps2 = 2;
  optional double ref_s_tar_decel_mps2 = 3;
  optional double ref_s_speed_loop_kp_gain = 4;
  optional double ref_s_tar_jerk_mps3 = 5;
  optional double ref_s_tar_fast_jerk_mps3 = 6;
  optional double follow_s_loop_kp_gain = 7;
  optional LinearIntep_1D follow_v_loop_target_decel_mps2 = 8;
  optional double reference_v_offset_kph = 9;
  optional double follow_s_error_bound_m = 10;
  optional double follow_target_decel_offset_mps2 = 11;
  optional double min_thw_sec = 12;
  optional double follow_ff_smooth_speed_mps = 13;
  optional double enter_const_decel_thres_mps2 = 14;
  optional double quit_const_decel_thres_mps2 = 15;
  optional LinearIntep_1D follow_v_loop_target_accel_mps2 = 16;
  optional double const_decel_target_v_offset_mps = 17;
  optional bool use_preview_speed_flg = 18;
}

message LonMPCConfig {
  optional double time_constant_tau_gain = 1 [default = 0.16];
  optional double mdl_ts_sec = 2 [default = 0.1];
  repeated double mpc_matrix_q = 3;
  optional double mpc_matrix_r = 4 [default = 0.1];
  optional uint32 np_cnt = 5 [default = 40];

  // constraint manager config
  optional LonMPCConstraintManager constraint_manager = 100;
  // reference manager config
  optional LonMPCReferenceManager reference_manager = 101;
}

// lat nmpc config
message LatNMPCConfig {
  optional double mdl_ts_sec = 1 [default = 0.1];
  repeated double mpc_matrix_q = 2;
  optional double mpc_matrix_r = 3 [default = 0.1];
  optional uint32 np_cnt = 4 [default = 10];
  optional uint32 nc_cnt = 5 [default = 10];
  optional double lat_acc_limit_mps2 = 6 [default = 1.5];
  optional double front_angle_rate_limit_radps = 7 [
    default = 0.21
  ];  // 0.21 is almost 200 deg/s for steering angle estimated with ratio 16.5
  optional uint32 nfe = 8 [default = 51];
  optional double tf = 9 [default = 5.0];
  optional uint32 corridor_max_iter = 10 [default = 1000];
  optional double corridor_expansion_limit = 11 [default = 20.0];
}

// mpc corridor config
message MPCCorridorConfig {
  optional double default_lane_width_m = 1 [default = 3.6];
  optional double lon_mdl_ts_sec = 2 [default = 0.1];
  optional uint32 lon_mpc_np_cnt = 3 [default = 40];
  optional double kappa_limited_speed_preview_time_sec = 4 [default = 10.0];
  optional double kappa_limited_speed_ay_mps2 = 5 [default = 3.0];
  optional double obs_prediction_decay_time_const_sec = 6 [default = 0.5];
  optional double obs_prediction_decay_pow = 7 [default = 1.0];
  optional bool enable_obstacle_prediction_flg = 8 [default = true];
}

// refline impc config
message ReflineIMPCConstraintManager {
  optional double comfort_lanechange_ay_limit = 1;
  optional double emergent_lanechange_ay_limit = 2;
  optional LinearIntep_1D comfort_steer_angle_rate_limit = 3;
  optional LinearIntep_1D emergent_steer_angle_rate_limit = 4;
}

message ReflineIMPCReferenceManager {
  optional double min_ego_speed_mps = 1;
}

message ReflineIMPCConfig {
  optional double mdl_ts_sec = 1 [default = 0.2];
  repeated double mpc_matrix_q = 2;
  repeated double mpc_matrix_r = 3;
  optional uint32 np_cnt = 4 [default = 50];
  // constraint manager config
  optional ReflineIMPCConstraintManager constraint_manager = 100;
  // reference manager config
  optional ReflineIMPCReferenceManager reference_manager = 101;
}

message MockDeciderConfig {
  optional MpReflineSource refline_source = 1 [default = TPP];
  optional bool enable_prediction_flg = 2 [default = true];
  optional bool is_raw_path_ego_frame_flg = 3 [default = true];
  optional bool enable_ego_prediciton_refline_flg = 4 [default = false];
}

message ReferenceLineSmootherConfig {
  // discretized points smoother
  message DiscretizedPointsSmootherConfig {
    // The output resolution for discrete point smoother reference line is
    // directly decided by max_constraint_interval
    optional double max_constraint_interval = 1 [default = 5];
    optional double longitudinal_boundary_bound = 2 [default = 1.0];
    optional double max_lateral_boundary_bound = 3 [default = 0.5];
    optional double min_lateral_boundary_bound = 4 [default = 0.2];
    // The output resolution for qp smoother reference line.
    optional uint32 num_of_total_points = 5 [default = 500];
    optional double curb_shift = 6 [default = 0.2];
    optional double lateral_buffer = 7 [default = 0.2];
    // The output resolution for spiral smoother reference line.
    optional double resolution = 8 [default = 0.02];

    message FemPosDeviationSmootherConfig {
      optional double weight_fem_pos_deviation = 2 [default = 1.0e10];
      optional double weight_ref_deviation = 3 [default = 1.0];
      optional double weight_path_length = 4 [default = 1.0];
      optional bool apply_curvature_constraint = 5 [default = false];
      optional double weight_curvature_constraint_slack_var = 6
          [default = 1.0e2];
      optional double curvature_constraint = 7 [default = 0.2];
      optional bool use_sqp = 8 [default = false];
      optional double sqp_ftol = 9 [default = 1e-4];
      optional double sqp_ctol = 10 [default = 1e-3];
      optional int32 sqp_pen_max_iter = 11 [default = 10];
      optional int32 sqp_sub_max_iter = 12 [default = 100];

      // osqp settings
      optional int32 max_iter = 100 [default = 500];
      // time_limit set to be 0.0 meaning no time limit
      optional double time_limit = 101 [default = 0.0];
      optional bool verbose = 102 [default = false];
      optional bool scaled_termination = 103 [default = true];
      optional bool warm_start = 104 [default = true];

      // ipopt settings
      optional int32 print_level = 200 [default = 0];
      optional int32 max_num_of_iterations = 201 [default = 500];
      optional int32 acceptable_num_of_iterations = 202 [default = 15];
      optional double tol = 203 [default = 1e-8];
      optional double acceptable_tol = 204 [default = 1e-1];
    }
    optional FemPosDeviationSmootherConfig fem_pos_deviation_smoothing = 9;
    optional bool is_enable_smoother = 10 [default = false];
  }

  oneof type {
    DiscretizedPointsSmootherConfig discretized_points_smoother = 1;
  }
}

message EscapeTowerConfig {}

message MpTaskConf {
  optional MotionTaskType task_type = 1;
  oneof type {
    LonMPCConfig lon_mpc = 2;
    LatNMPCConfig lat_nmpc = 3;
    MPCCorridorConfig mpc_corridor = 4;
    ReflineIMPCConfig refline_impc = 5;
    ReferenceLineSmootherConfig reference_line_smoother = 6;
    MockDeciderConfig mock_decider = 7;
    EscapeTowerConfig escape_tower = 8;
  }
}
