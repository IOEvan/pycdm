syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;

import "common/pnc/geometry.proto";
import "common/perf/sensor_ts_header.proto";

message Content {
    enum Type {
        TEXT = 0;
        IMAGE_TIMESTAMP = 1;
        IMAGE_B64STRING = 2;
        IMAGE_URL = 3;
    }
    optional Type type = 1; // type
    optional string text = 2; //text
    optional string image_url = 3; // image url
    optional string image_b64string = 4; //image base64 string
    optional uint64 image_timestamp = 5; // image timestamp
}

message PromptMessage {
    enum Role {
        USER = 0;
        SYSTEM = 1;
    }
    optional Role role = 1; // role
    repeated Content contents = 2;
}

message Prompt {
    enum FunctionInfo {
        DeadCar = 0;
        ConstructionArea = 1;
    }
    repeated PromptMessage prompt_messages = 1;  // 每个prompt包含多个message
    optional FunctionInfo function_info = 2;
}

message DasAgentRequest {
    repeated Prompt prompts = 1; // 每个request传递多个promt
    optional uint64 request_seq = 2; // 请求序号，模型返回时需要带上，方便Das匹配模型输入输出。

    optional uint64 timestamp = 536870905;     // ptp time, nanosec, for cosine bundle timestamp
    optional SensorTSHeader sensor_original_ts = 536870906;  // sensor original ts
    optional uint64 publish_ptp_ts = 536870907;  // publish ptp timestamp, uint in nanosec
    optional string publisher_id = 536870909;  // uuid of the publisher
    optional uint64 counter = 536870910;       // message counter
    optional uint64 publish_ts = 536870911;  // publish utc timestamp; unit : nanosecond
}