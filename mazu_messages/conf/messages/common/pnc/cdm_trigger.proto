syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";
import "common/pnc/path.proto";

message FeatureInfo {
  optional string scene_name = 1;
  optional uint64 ptp_timestamp = 2;
}

message CDMTrigger {
  optional uint64 time_meas = 1;         // trigger timestamp
  optional bool is_event_triggered = 2;  // 0: not trigger cdm 1: trigger cdm
  optional KeyObjectsInfo key_objects = 3;
  optional int32 trigger_type = 4;
  repeated int32 trigger_types = 5;
  repeated FeatureInfo feature_infos = 6;

  optional uint64 timestamp = 536870905;     // ptp time, nanosec, for cosine bundle timestamp
  optional SensorTSHeader sensor_original_ts = 536870906;  // sensor original ts
  optional uint64 publish_ptp_ts =
      536870907;  // publish ptp timestamp, uint in nanosec
  optional string publisher_id = 536870909;  // uuid of the publisher`
  optional uint64 counter = 536870910;       // message counter
  optional uint64 publish_ts =
      536870911;  // publish timestamp; unit : nanosecond
}
