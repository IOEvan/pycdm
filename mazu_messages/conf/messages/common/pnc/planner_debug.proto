    optional bool reachable_refline_unstable = 8; // 可达参考线不稳定
    repeated string extra_infos = 1001;
  }
  // 择优过程中的一些信息
  message Decision{
    optional CollisionCheckDebug collision_check_debug = 1; // 碰撞检测
    optional TriggerInfo trigger_info = 2; // triggers
  };
  optional Decision decision_debug = 7;

  optional GeoInfo last_refline = 8;  // 上一次参考线
  optional RouteInfo matched_route = 9;  // 匹配出的route
  repeated GeoInfo map_reflines = 10;    // 当前帧使用的map refline

  repeated string extra_infos = 1001;
  optional Vector3d car_state_map_to_ego_position = 1002; // 自车在图系下的位置
  optional Vector3d car_state_map_to_ego_rpy = 1003; // 自车在图系下的rpy

  repeated GeoInfo reserves = 2001;  // 预留用于临时调试用的
}

