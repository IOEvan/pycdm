syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;

import "common/pnc/geometry.proto";
import "common/pnc/car_state.proto";
import "common/pnc/decision.proto";
import "common/pnc/path.proto";
import "common/pnc/road_map.proto";
import "common/pnc/behavior_obstacle.proto";
import "common/pnc/planner_scheduler.proto";
import "common/pnc/hmi_state.proto";
import "common/pnc/state_restore_enum_routing.proto";
import "common/pnc/planner_speed.proto";
import "common/pnc/refpath_debug.proto";
import "common/pnc/attention_debug.proto";
import "np/apps/parking/par_pnc_point.proto";   // For SLPoint
import "common/pnc/ego_command_result_debug.proto";
import "common/pnc/planner_solver_debug.proto";
import "common/pnc/park_low_speed_debug.proto";
import "common/pnc/refline_debug.proto";
import "common/pnc/path_bound_debug.proto";
import "common/pnc/adms_debug.proto";
import "common/pnc/conpre_debug.proto";
import "common/perf/sensor_ts_header.proto";

message ObstacleFilterInfo {
  optional int32 obs_id = 1;
  optional string filter_strategy_name = 2;
}

message ObstacleFilterManagerInfo {
  optional string scene = 1;  // urban highway psp
  repeated ObstacleFilterInfo filter_info = 2;
}

// note: there is no much reusable structure
// reference line debug:s,x,y,theta,k,dk,calculated bound,offset_l
message ReferenceLinePoint {
  optional double s = 1;
  optional double x = 2;
  optional double y = 3;
  optional double heading = 4;
  optional double k = 5;
  optional double dk = 6;
  optional double lateral_bound = 7;
  optional double offset_l = 8;  // offset to center line point
}
message ReferenceLineDebug {
  repeated ReferenceLinePoint reference_line_point = 1;
}
// path bound(s,l)
message PathBound {
  optional string label = 1;
  repeated SLPoint left_bound = 2;
  repeated SLPoint right_bound = 3;
}

message TrajectoryConstraints{
  optional Vector3d traj_position = 1;
  repeated Polyline traj_constraints_polyline = 2;
  optional double obs_left_ratio = 3;
  optional double obs_right_ratio = 4;
  optional double god_left_ratio = 5;
  optional double god_right_ratio = 6;
  optional double shoulder_left_ratio = 7;
  optional double shoulder_right_ratio = 8;
}

// multiple path boundary
message PathBoundsDebug {
  repeated PathBound path_bound = 1;
}
// obstacle s l boundary
// obstacle s t boundary
// obstacle decision type
message ObstacleDebug {
  optional SLBoundary sl_boundary = 1;
  optional STBoundary st_boundary = 2;
  // obstacle decision tag
  optional ObjectDecisionType longitudinal_decision_type = 3;
  optional ObjectDecisionType lateral_decision_type = 4;
}
message ObstaclesDebug {
  map<string, ObstacleDebug> obstacle_debug_maps = 1;
}

// path result data
message PathDataDebug {
  // only position,k,theta,s,l related with path is used
  repeated PathPointNop path_points = 1;
}
// speed bound
// there could be better if we use some basic data structure like this in tasks
message SpeedLimitPoint {
  optional double s = 1;
  optional double v = 2;
  optional double t = 3;
}
enum RiskType {
  NO_TYPE = 0;
  BP_LANE_KEEP_RISK = 1;
  BP_CROSS_RISK = 2;
  MP_RISK = 3;
  BP_INTERFERENCE_RISK = 4;
  BP_VRU_RISK = 5;
  MP_ROADEDGE_RISK = 6;
  BP_MERGE_YIELD_RISK = 7;
  BP_MERGE_PROCESS_RISK = 8;
  BP_MERGE_OVERTAKE_RISK = 9;
  BP_RISK = 10;
}
message RiskSpeedLimitPoint {
  optional SpeedLimitPoint speed_limit = 1;
  optional RiskType type = 2;
}
message SpeedBoundDebug {
  repeated SpeedLimitPoint speed_limit_points = 1;
}
// st graph result with every point's cost
message StGraphPoint {
  optional STPoint st_point = 1;
  optional double obstacle_cost = 2;
  optional double spatial_potential_cost = 3;
  optional double edge_cost = 4;
  optional double total_cost = 5;
}
message StGraphDebug {
  repeated StGraphPoint st_graph_points = 1;
}
// st graph result
message StGraphResultDebug {
  repeated SpeedPointNop speed_points = 1;
}
// qp speed bound

// qp speed result
message SpeedDataDebug {
  repeated SpeedPointNop speed_points = 1;
  optional double current_map_speed_limit = 2 [default = 0.0];  // km/h
  repeated SLTTrajectory obs_slt_trajectories = 3;
  repeated double reference_speed = 4;
  repeated double cruise_speed_limit = 5;
  repeated double map_speed_limit = 6;
  repeated MMSLTTrajectorys mm_obs_slt_trajectories = 7;
  repeated MMSpeedPoints mm_speed_points = 8;
}

message MMSpeedPoints {
  optional int32 modal_id = 1;
  repeated SpeedPointNop speed_points = 2;
}

message SLTTrajectory {
  optional string obs_id = 1;
  repeated SLTPoint slt_points = 2;
}

message MMSLTTrajectorys {
  optional string obs_id = 1;
  repeated MMSLTTrajectory mm_obs_slt_trajectory = 2;
}

message MMSLTTrajectory {
  optional int32 modal_id = 1;
  repeated SLTPoint slt_points = 2;
}

message SLTPoint {
  enum MotionDecisionTypeDebug {
    LEFT_NUDGE = 1;
    RIGHT_NUDGE = 2;

    OOL_LEFT_NUDGE = 3;
    OOL_RIGHT_NUDGE = 4;

    YIELD = 5;
    NOT_YIELD = 6;
    SLOT_YIELD = 7;
    SLOT_NOT_YIELD = 8;
    MERGE_YIELD = 9;
    MERGE_NOT_YIELD = 10;
    ALIGN_YIELD = 11;
    ALIGN_NOT_YIELD = 12;

    CROSS_YIELD = 13;
    VRU_YIELD = 14;
    RISK = 15;

    IGNORE = 16;

    LANE_CHANGE_HOLD_YIELD = 17;
    INTERFERENCE_YIELD = 18;
    INTERFERENCE_RISK = 19;
    CROSS_OVERTAKE = 20;
    MP_YIELD = 21;

    UNKNOWN = 30;
  }
  optional double t = 1;
  optional double min_s = 2;
  optional double max_s = 3;
  optional double min_s_speed = 4;
  optional double max_s_speed = 5;
  optional double min_l = 6;
  optional double max_l = 7;
  optional double l_nearest = 8;
  optional double l_speed = 9;
  repeated MotionDecisionTypeDebug decision_vec = 10;
  optional double speed = 11;
  optional double path_s_lower = 12;
  optional double path_s_upper = 13;
  optional double path_l_nearest = 14;
  optional double path_heading_diff = 15;
  optional double path_ref_min_s = 16;
  optional double path_ref_max_s = 17;
  optional bool is_precise_path_projection = 18 [default = false];
}

message HmiLaneChangeReqStatus {
  enum TaskState {
    TASK_STATE_NONE = 0;
    TASK_STATE_REJECTED = 1;
    TASK_STATE_PREPARING = 2;
    TASK_STATE_RUNNING = 3;
    TASK_STATE_CANCELED = 4;
    TASK_STATE_FINISHED = 5;
  }
  enum TaskError {
    TASK_ERROR_NONE = 0;
    TASK_ERROR_INTENTION_NOT_READY = 1;
    TASK_ERROR_SPEED_OUT_OF_RANGE = 2;
    TASK_ERROR_LANE_NOT_EXIST = 3;
    TASK_ERROR_LANE_NOT_DRIVABLE = 4;
    TASK_ERROR_LANE_BOUNDARY_FORBID = 5;
    TASK_ERROR_LC_SPACE_NOT_ENOUGH = 6;
    TASK_ERROR_NOT_INTERRUPT_LANE_CHANGING = 7;
    TASK_ERROR_ON_LANE_CHANGING = 8;
    TASK_ERROR_CANCELED_BY_HMI = 9;
    TASK_ERROR_CANCELED_BY_SAFETY = 10;
  }
  optional TaskState task_state = 1;
  optional TaskError task_error = 2;
}

enum LaneChangeCanceledReason {
  CANCELED_NONE = 0;
  CANCELED_BY_NOT_AUTO_MODE = 1;
  CANCELED_BY_DRIVER = 2;
  CANCELED_BY_SAFETY = 3;
  CANCELED_BY_CURR_ROUTE_INVALID = 4;
  CANCELED_BY_TARGET_ROUTE_INVALID = 5;
  CANCELED_BY_DURATION = 6;
  CANCELED_BY_FCT_SURP_SIGNAL = 7;
  CANCELED_BY_OBSTACLE_SURP = 8;
  CANCELED_BY_OVERTAKE_CUT_OUT = 9;
  CANCELED_BY_BP_COLLISION = 10;
  CANCELED_BY_BP_SAFETY_COST = 11;
  CANCELED_BY_BP_SAFETY_AREA_CHECK = 12;
  CANCELED_BY_CONE = 13;
  CANCELED_BY_PERCEPTION_SOLID_LINE = 14;
  CANCELED_BY_TARGET_SLOW_VEHICLE = 15;
  CANCELED_BY_DA_INHIBIT = 16;
  CANCELED_BY_LANE_MAP_MODE = 17;
  CANCELED_BY_JUNCTION = 18;
  CANCELED_BY_OVER_PREPARE_TIME_IN_JUNCTION = 19;
  CANCELED_BY_STATIC_VEHICLE_MOVING = 20;
  CANCELED_BY_DRIVER_STEER_TORQUE = 21;
  CANCELED_BY_ROUTE_OBS_BLOCK = 22;
  CANCELED_BY_TARGET_ROUTE_WIDTH_INVALID = 23;
  CANCELED_BY_TARGET_ROUTE_GEOMETRY_INVALID = 24;
  CANCELED_BY_TARGET_ROUTE_TYPE_INVALID = 25;
  CANCELED_BY_ROUTE_PRIORITY_CHANGE = 26;
  CANCELED_BY_RAMP_RISK_SCENARIO = 27;
  CANCELED_BY_CURRENT_ROUTE_NOT_BLOCKED = 28;
  CANCELED_BY_ONE_MAP_JUNCTION = 29;
  CANCELED_BY_BUS_LANE_NOT_EXIST = 30;
  CANCELED_BY_LEADING_VEHICLE_SLOW_MOVING = 31;
}

message LaneChangeSlotAlignmentInfo {
  optional string id = 1;
  optional bool is_align_front = 2;
  optional bool is_acc_to_dec = 3;
  optional double aligned_s = 4;
  optional double acc_t = 5;
  optional double dec_t = 6;
  optional double aligned_v = 7;
  optional double aligned_space = 8;
  optional double acc = 9;
  optional double dec = 10;
}

message LaneChangeStatus {
  enum LaneChangeType {
    SUCCEEDING = 0;
    LEFT_FORWARD = 1;
    LEFT_REVERSE = 2;
    RIGHT_FORWARD = 3;
  }
  enum StatusType {
    NONE = 0;
    LANE_CHANGING = 1;
    CANCEL = 2;
    READY_TO_FINISH = 3;
    FINISH = 4;
    PREPARING = 5;
  }
  enum TriggerType {
    TRIGGER_TYPE_NONE = 0;
    TRIGGER_TYPE_PASSIVE = 1;
    TRIGGER_TYPE_INITIATIVE = 2;
  }
  optional LaneChangeType lane_change_type = 1;
  optional StatusType status_type = 2;
  optional TriggerType trigger_type = 3;
  optional HmiLaneChangeReqStatus hmi_lane_change_req_status = 4;
  optional LaneChangeCanceledReason lane_change_canceled_reason = 5;
  optional LaneChangeSlotAlignmentInfo slot_alignment_info = 6;
  optional int64 lane_change_canceled_reason_bit_flag = 7;
}

message LaneChangeTask {
  message LaneChangeInfo {
    optional double current_crossable_remain_s = 1;
    optional double crossable_remain_s = 2;
    optional double min_ave_speed = 3;
    optional double max_ave_speed = 4;
    optional int64 priority = 5;
  }
  enum TaskType {
    TASK_TYPE_HMI_REQ = 0;
    TASK_TYPE_ROUTING = 1;
  }
  enum LaneChangeTriggerType {
    DRIVER = 0;
    EMERGENCY_AVOIDANCE = 1;
    SPLIT = 2;
    OFF_RAMP = 3;
    RAMP_TO_ROAD = 4;
    MERGE = 5;
    PRIORITY = 6;
    SPEED = 7;
    OVERTAKE = 8;
    NONE = 9;
    PREFERED_LANE = 10;
    LANE_KEEP_SPLIT = 11;
    RISK_OBSTACLE = 12;
    AVOID_MERGE_LANE = 13;
    AVOID_CONSTRUCTION_ZONE = 14;
    AVOID_STATIC_VEHICLE = 15;
    AVOID_VEHICLE_IN_JUNCTION = 16;
    AVOID_BUS_LANE = 17;
  }
  optional LaneChangeStatus.LaneChangeType lane_change_type = 1;
  optional double remain_s = 2;
  optional LaneChangeInfo left_lane_change_info = 3;
  optional LaneChangeInfo right_lane_change_info = 4;
  optional TaskType task_type = 5;
  optional bool is_cancel_lane_change = 6;
  optional LaneChangeTriggerType trigger_type = 7;
  optional LaneChangeInfo current_route_info = 8;
  optional double user_set_speed = 9;
  optional double distance_to_odd_end = 10;
  optional double distance_to_split = 11;
}

message BehaviorPlanningEgoInput {
  optional LaneChangeStatus lane_change_status = 1;
  optional LaneChangeTask lane_change_task = 2;
  optional bool is_auto_mode = 3;
  optional BehaviorVehicle ego_vehicle = 4;
}

message ObstacleTraj {
  optional int64 obstacle_id = 1;
  repeated PathPointNop points = 2;
}

message ObstacleRelationSet {
  message ObstacleRelation {
    enum Type {
      DEFAULT = 0;
      SAME = 1 [deprecated = true];
      FRONT = 2 [deprecated = true];
      BACK = 3 [deprecated = true];
      LEFT = 4 [deprecated = true];
      RIGHT = 5 [deprecated = true];
      MERGE = 6;
      SAME_FRONT = 7;
      SAME_BACK = 8;
      LEFT_FRONT = 9;
      LEFT_BACK = 10;
      RIGHT_FRONT = 11;
      RIGHT_BACK = 12;
    };
    optional Type type = 1;
    repeated int64 relation_obstacle_ids = 2;
  }
  optional int64 obstacle_id = 1;
  repeated ObstacleRelation obstacle_relations = 2;
}

// several obstacles relation set
message FrameObstaclesRelationSet {
  repeated ObstacleRelationSet obstacles_relation_set = 1;
}

message ActionObstaclesRelationSet {
  repeated FrameObstaclesRelationSet frame_obstacles_relation_sets = 1;
}

message FrameIntention {
  message Intention {
    enum Type {
      LEADING = 0;
      VIRTUAL_LEADING = 1;
      MERGE_LEADING = 2;
    };
    optional Type type = 1;
    optional int64 obstacle_id = 2;
    optional int64 lane_id = 3;
  }
  repeated Intention intentions = 1;
}

message ActionIntentionSet {
  repeated FrameIntention frame_intentions = 1;
}


message CrossPoint {
  optional double x = 1;
  optional double y = 2;
}

message VruCrossDecision {
  enum VruCrossDecisionType {
    YIELD = 0;
    NOT_YIELD = 1;
    RISK = 2;
  }
  optional string id = 1;
  optional VruCrossDecisionType decision = 2;
  optional CrossPoint cross_point = 3;
  optional double prob = 4 [default = -1.0];
}

message LCSlotInfo {
  enum SlotType {
    LANE_CHANGE = 0;
    MERGE = 1;
    CROSS = 2;
  }
  optional string id = 1;
  optional SlotType slot_type = 2;
  repeated int32 front_obstacle_id = 3;
  repeated int32 back_obstacle_id = 4;
  optional uint64 target_lane_id = 5;
  optional bool is_safe_to_lane_change = 6;
  optional Vector3d conflict_point = 7;
  optional Vector3d merge_point = 8;
}

message WtiInMerge {
  optional bool wti_in_merge_for_motion = 1 [default = false];
  optional bool right_of_current_lane = 2 [default = false];
}
message DecisionStrategyOutput {
  optional double timestamp = 1;
  optional int32 leading_vehicle_id = 2;
  repeated ObsDecision lane_keep_decision = 3;
  repeated LCSlotInfo slot_info = 4;
  optional double ego_s_to_merge_point = 5;
  optional double ego_s_to_conflict_point = 6;
  optional WtiInMerge need_wti_in_merge = 7;
  repeated VruCrossDecision vru_cross_decision = 8;
  repeated ObsDecision uni_decision = 9;
}

message CrossingDecision {
  optional int32 cross_obs_id = 1;
  optional ObsDecision cross_obs_decision = 2;
}

// Next id: 4
message CrossSingleJunctionDecision {
  optional int32 junction_id = 1;
  optional int32 start_yield_obj_id = 2;
  optional Vector2d junction_stop_point = 3;
}
enum SourceTag {
  EXPERT_DRIVING = 0;
  DRIVINGGOAL_AS_REFLINE = 1;
  CONTINUE_AS_REFLINE = 2;
  ASTRA_AS_REFLINE = 3;
  ASTRA_AS_EGO_TRAJ = 4;
  ASTRA_AS_SCENE = 5;
}
enum LatCommandSource {
  LatCommandSource_NONE = 0; LatCommandSource_YILED = 1; LatCommandSource_NUDGE = 2;
  LatCommandSource_CHANGE = 3;
  LatCommandSource_HOLD = 4;
  LatCommandSource_DRIVE_LOSS = 5;
}
// Next id: 3
message CrossJunctionDecision {
  optional bool has_cross_yield = 1;
  repeated CrossSingleJunctionDecision single_junction_decision = 2;
}

// Next id: 15
message InteractiveScene {
  message InteractiveDecision {
    optional int32 obstacle_id = 1;
    optional int32 source_type = 2;
    optional int32 decision_type = 3;
    optional double prob = 4;
    optional bool is_have_virtual = 5;
    optional int32 interactive_type = 55;
    optional Vector2d virtual_point = 6;
    optional double virtual_speed = 7;
    optional Vector2d merge_point = 8;
    optional int32 risk_level = 9;
  }

  message ObstalceTrajGenCmd {
    optional float timestamp = 1 [default=-1.0];
    optional int32 leading_vehicle_id = 2 [default=-1];
    optional float desired_velocity = 3 [default=0.0];
  }

  message TrajectoryPoint {
    optional float relative_start_time = 1;  // unit is second
    optional float position_x = 2;
    optional float position_y = 3;
    optional float speed = 4;
    optional float acceleration = 5;
    optional float heading = 6;
    optional bool is_virtual = 7 [default = false];
    optional ObstalceTrajGenCmd obs_cmd = 8;
  }

  message InteractiveObstacle {
    optional int32 obstacle_id = 1;
    repeated TrajectoryPoint sim_point = 2;
  }

 message SingleAgentCostResult {
    optional int32 main_agent_id = 1;
    map<string, double> cost = 10;
    map<int32, double> simulate_result = 20;
    map<string, string> msg = 100;
  }

  message CostResult {
    optional double total_cost = 1;
    repeated SingleAgentCostResult data = 10;
  }

  message RefPath {
    optional string label = 1;

    message EgoLatCommand {
      optional double s = 1 [default = 0.0];
      optional double l = 2 [default = 0.0];
      optional double dl = 3 [default = 0.0];
      optional double t = 4 [default = 0.0];
      optional bool valid = 5 [default = false];
      optional LatCommandSource lat_command_source = 6 [default = LatCommandSource_NONE];
    };
    repeated EgoLatCommand ego_lat_command = 50;
    optional Polyline xy_points = 100;
    optional Polyline sl_points = 101;
    optional double start_s = 102;
    optional string msg = 200;
  }

  optional double reward = 1;
  optional double softmax_prob = 2;
  repeated int32 multimodal_obs_id = 3;
  repeated InteractiveDecision interactive_decision = 4;
  repeated InteractiveObstacle interactive_obstacle = 5;
  optional double scene_prob = 6;
  optional SourceTag source_tag = 7;
  optional CostResult cost_result = 10;
  optional RefPath refpath = 100;
  optional int32 scene_index = 101;
  optional int32 ego_traj_index = 102;
  optional bool ego_traj_changed = 103;
  optional EgoCommandResult ego_command_result = 120;
  optional CmdGeneratorInfo.CommandSource command_source = 121;
  optional LimitSeq cmd_limit = 122;
}

message OfflineEgoInfo {
  enum DecisionType {
    DEFAULT_DECISION = 0; YILED = 1; NOT_YILED = 2; ALIGN_YIELD = 3; ALIGN_NOT_YIELD = 4;
  }
  enum BehaviorType { DEFAULT_TYPE = 0; KEEP = 1; ALIGN = 2; }
  enum DriveIntention { 
    None = 0; 
    Keep = 1; 
    Align = 2; 
    Left_nudge = 3; 
    Right_nudge = 4;
    Left_change = 5;
    Right_change = 6;
  }
  enum DriveLossInvalidType {
    NONE = 0;
    CMD_PARSE = 1;
    INIT_STATE_DIFF = 2;
    INTENTION_ODD = 3;
    TRAJECTORY_PEAK_ACC = 4;
    TRAJECTORY_PEAK_JERK = 5;
    TRAJECTORY_DURATION = 6;
  }
  message ObsInfo {
    optional int32 obs_id = 1;
    optional DecisionType decision_type = 2;
  }
   message KeyPoint {
    optional Vector2d point_xy = 1;
    optional double s = 2;
    optional double v = 3;
    optional double a = 4;
    optional double t = 5;
  }
  message StaticCommand {
    optional Vector2d start_point = 1;
    optional Vector2d end_point = 2;
    optional double desired_velocity = 3;
    optional double desired_acceleration = 4;
  }
  message DynamicCommand {
    optional BehaviorType behavior_type = 1;
    repeated ObsInfo obs_info = 2;
    repeated KeyPoint key_point = 3;
  }
  message SimPoint {
    optional uint64 relative_start_time = 1;  // unit is nanosecond
    optional float position_x = 2;
    optional float position_y = 3;
    optional float speed = 4;
    optional float acceleration = 5;
    optional float heading = 6;
  }
    optional uint64 time = 1;
  optional StaticCommand static_command = 2;
  optional DynamicCommand dynamic_command = 3;
  repeated SimPoint sim_point_array = 4;
  optional DriveIntention drive_intention = 5;
  optional DriveLossInvalidType drive_loss_invalid_type = 6;
}
message RemoveReason {
  enum ReasonType {
    ACC = 1;                      // 加速度过大
    CENTRIPETAL_ACCEL = 2;        // 向心加速度超过阈值
    LANE_CHANGE_SAFETY = 3;       // 车道变道安全
    LANE_CHANGE_TASK = 4;         // 换道任务
    FRONT_OBS = 5;                // THW/TTC
    OVER_SPEED = 6;               // 超过限速
    DATA_VALID = 7;               // 数据无效
    KEEP_CENTERING = 8;           // 保持中心
    KEY_OBSTACLE = 9;             // 关键障碍物
    VECTOR_DIFF = 10;             // 序列向量夹角
    TLD = 11;                     // 红绿灯
    ASTRA_APPLY_SCENE = 12;       // ASTRA应用场景
    NONE = 10000;                 // 无
  }

  optional ReasonType reason_type = 1;
  optional SourceTag source_tag = 2;  // 数据来源
  optional string reason = 10000;
}

message BehaviorDebug {
  message ActionSequenceInfo {
    // NEXT ID: 13
    optional int64 seq_id = 1;
    optional string action = 2;
    repeated PathPointNop points = 3;
    optional double final_cost = 4;
    optional double efficiency_cost = 5;
    optional double safety_cost = 6;
    optional double navigation_cost = 7;
    optional double utility_cost = 8;
    repeated ObstacleTraj obstacle_trajs = 9;
    repeated ActionObstaclesRelationSet action_obstacles_relation_sets = 10;
    repeated ActionObstaclesRelationSet action_virtual_obstacles_relation_sets =
        11 [deprecated = true];
    repeated ActionIntentionSet ego_action_intentions = 12;
  }
  optional BehaviorPlanningEgoInput behavior_planning_ego_input = 1;
  optional BehaviorVehicleSet all_vehicle_set = 2;
  optional BehaviorVehicleSet virtual_vehicle_set = 3;
  optional VehicleSemanticInfoSet vehicle_semantic_info_set = 4
      [deprecated = true];
  repeated ActionSequenceInfo action_sequence_info = 8;
  optional Polyline best_behavior_target_lane_points = 9 [deprecated = true];
  repeated DecisionStrategyOutput strategy_output = 10;
  repeated Vector3d conflict_point = 11;
  repeated Vector3d merge_point = 12;
  repeated CrossingDecision crossing_decision = 13;
  optional CrossJunctionDecision cross_junction_decision = 14;
  repeated InteractiveScene interactive_scene = 15;
  optional OfflineEgoInfo offline_ego_info = 16;
  repeated RemoveReason invalid_scene_erase_info = 17;
  repeated CmdGeneratorDebug cmd_generator_debug = 18;
  repeated CmdTrajDebug cmd_traj_debug = 19;
}

message CmdGeneratorDebug {
  optional string refpath_label = 1;
  repeated CmdGeneratorInfo cmd_generator_info = 2;
}
message CmdGeneratorInfo {
  enum CommandSource {
    UNKNOWN = 0;
    KEEP = 1;
    MERGE = 2;
    CROSS = 3;
    ALIGN = 4;
    GOD = 5;
    STATIC = 6;
    DRIVE_LOSS = 7;
    FUSION = 8;
    VRU_CROSS = 9;
    LAST_FRAME = 10;
  }
  optional CommandSource command_source = 1;
  repeated LimitSeq limit_seq = 2;
  repeated int32 cmd_obs_id = 3; 
  repeated int32 key_obs_id = 4; 
}
message LimitSeq {
  repeated LimitPoint limit_point = 1;
}

