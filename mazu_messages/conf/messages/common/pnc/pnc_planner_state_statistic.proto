syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";
import "common/map_engine/sd_map.proto";
message PncPlannerStateInfo {
  enum PncStatisticMode {
    ALL = 0;
    AUTO = 1;
    NOP = 2;
    NOP_LANE_KEEP = 3;
    NOP_LANE_MERGE = 4;
    NOP_LANE_CHANGE = 5;
    NOP_PSP = 6;
    NP = 7;
    MANAL = 8;
  };

  optional uint64 time_meas = 1;        // unit: ns
  optional PncStatisticMode mode = 2;   //
  optional uint32 odometer = 3;         // unit: m
  optional uint32 timecost = 4;         // uint:s
  optional uint32 function_count = 5;   //
  optional uint32 take_over_count = 6;  //
  optional uint32 frame_num = 7;        // planner frame numbers

  // common details:
  optional uint32 medium_brake_num = 11;
  optional uint32 force_brake_num = 12;
  optional uint32 medium_acc_jerk_num = 13;
  optional uint32 force_acc_jerk_num = 14;

  optional double behavior_timecost = 21;  // uint: s
  optional double motion_timecost = 22;    // uint: s

  optional uint32 behavior_fallback_num = 23;
  optional uint32 motion_fallback_num = 24;

  // lane keep
  optional uint32 lat_offset_out_range_num = 31;

  // lane change
  optional uint32 auto_lane_change_num = 51;
  optional uint32 auto_lane_change_success_num = 52;
  optional uint32 trigger_lane_change_num = 53;
  optional uint32 trigger_lane_change_success_num = 54;
  optional uint32 road_to_ramp_num = 55;
  optional uint32 road_to_ramp_success_num = 56;
  optional uint32 left_lane_change_num = 57;
  optional uint32 left_lane_change_success_num = 58;
  optional uint32 right_lane_change_num = 59;
  optional uint32 right_lane_change_success_num = 60;

  // lane merge

  // planner_timecost
  optional double planner_timecost = 101;     // uint: s
  optional double planner_timecost_99 = 102;  // uint: s
}

message PncControlStateInfo {
  enum PncCtrlEventType {
    Undefined = 0;
    LonStartUp = 1;
    LonCruise = 2;
    LonSpeedUp = 3;
    LonSpeedDown = 4;
    LonFollowing = 5;
    LonStopping = 6;
    LatLaneCenter = 21;
    LatLaneChange = 22;
    LatCurve = 23;
  };

  enum PncCtrlStatisticMode {
    ALL = 0;
    AUTO = 1;
    NOP = 2;
    NOP_PSP = 6;
    NP = 7;
    MANAL = 8;
  };

  optional PncCtrlStatisticMode mode = 2;
  optional PncCtrlEventType event_type = 3;
  optional uint32 count = 4;
  optional uint32 pre_position_overrun_count = 5;
  optional uint32 position_overrun_count = 6;
  optional uint32 pre_speed_overrun_count = 7;
  optional uint32 speed_overrun_count = 8;
  optional uint32 pre_acc_overrun_count = 9;
  optional uint32 cmd_acc_overrun_count = 10;
  optional uint32 cur_acc_overrun_count = 11;

  optional uint32 lateral_overrun_count = 21;
  optional uint32 yaw_overrun_count = 22;
  optional uint32 yaw_rate_overrun_count = 23;
  optional uint32 steering_ratio_overrun_count = 24;
}

message PncExperienceFeature {
  optional string name = 1;
  optional uint32 score = 2;
  optional uint64 timestamp = 3;
  optional string info = 4;
  optional Point3d wgs84_position = 5;  // ego-car position in lon/lat/alt
}

message PncExperienceScene {
  optional string name = 1;
  optional uint64 start_ts = 3;
  optional uint64 end_ts = 4;
  optional Point3d wgs84_position = 5;  // ego-car position in lon/lat/alt
  optional uint64 lane_id = 6;
  repeated PncExperienceFeature features = 7;
  optional uint64 version = 8;
}

message PncPlannerState {
  optional uint64 time_meas = 1;  // uint: ns
  repeated PncPlannerStateInfo statistic_infos = 2;
  repeated PncControlStateInfo control_statistic_infos = 3;
  repeated PncExperienceScene scene_infos = 4;
  optional double planner_timecost_cur = 101;              // uint: s
  optional double planner_timecost_cur_99 = 102;           // uint: s

  optional uint64 timestamp = 536870905;     // ptp time, nanosec, for cosine bundle timestamp 
  optional SensorTSHeader sensor_original_ts = 536870906;  // sensor original ts
  optional uint64 publish_ptp_ts =
      536870907;  // publish ptp timestamp, uint in nanosec
  optional string publisher_id = 536870909;  // uuid of the publisher`
  optional uint64 counter = 536870910;       // message counter
  optional uint64 publish_ts =
      536870911;  // publish timestamp; unit : nanosecond
}