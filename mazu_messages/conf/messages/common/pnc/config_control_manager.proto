
syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;

import "common/pnc/config_car.proto";
import "common/pnc/config_control.proto";
import "common/pnc/config_observer_manager.proto";

message ConfigControlManager {
  optional ConfigCar config_car = 1;
  optional ConfigLateralControl config_lateral_control = 2;
  repeated ConfigLongitudinalControl config_longitudinal_control = 3;
  optional ConfigModeControl config_mode_control = 4;
  optional bool use_simulator = 5 [default = false];
  optional bool lon_trajectory_control_enable = 6 [default = false];
  optional ConfigSimulation config_simulation = 7;
  optional ConfigObserverManager config_observer_manager = 8;
  optional LonStatePara lon_state_para = 9;
}

message LonStatePara {
  optional double stopped_target_speed_thres_mps = 1 [default = 0.1];
  optional double stopped_ego_speed_psp_thres_mps = 2 [default = 0.1];
  optional double stopped_end_point_speed_thres_mps = 3 [default = 0.1];
  optional double startup_target_speed_thres_mps = 4 [default = 0.3];
  optional double driving_ego_speed_thres_mps = 5 [default = 1];
  optional double driving_follow_v_thres_mps = 6 [default = 0.3];
  optional double driving_ds_to_stop_thres_m = 7 [default = 7];
  optional double driving_end_point_speed_thres_mps = 8 [default = 0.3];
  optional double decel_to_stop_follow_v_thres_mps = 9 [default = 0.1];
  optional double decel_to_stop_ds_to_stop_thres_m = 10 [default = 5];
  optional double decel_to_stop_end_point_speed_thres_mps = 11 [default = 0.1];
  optional double decel_to_stop_target_speed_thres_mps = 12 [default = 0.3];
  optional double pre_decel_to_stop_ts = 13 [default = 0.2];
  optional double stopped_ego_speed_urban_thres_mps = 14 [default = 0.3];
  optional double path_startup_length_m = 15 [default = 3.5];

  // fs path length
  optional double fs_startup_path_length_m = 16 [default = 0.4];
  optional double fs_stopped_path_length_m = 17 [default = 0.2];
  optional bool is_fs_creep_mpc_flg = 18 [default = false];
}

message GainScheduler {
  repeated GainSchedulerInfo scheduler = 1;
}

message GainSchedulerInfo {
  optional double speed = 1;  // m/s
  optional double ratio = 2;
}

message ConfigLateralControl {
  message LateralControlPid {
    message PreviewPoint {
      optional double slope = 1;
      optional double slope_high_speed = 2;
      optional double vel_low = 3;
      optional double vel_up = 4;
    }

    optional double forward_len = 1;  // main to tune looking forward distance
    // feedback preview points
    repeated PreviewPoint fb_preview_points = 2;  // modify current
    // feedforward preview points
    repeated PreviewPoint ff_preview_points = 3;  // look future
    optional PidParam fb_pid_param = 4;
    optional double ff_gain = 5;
    optional double fb_gain = 6;
    optional double fb_gain_high_speed = 7;
    optional double slope_slew_rate = 8;
    optional double gain_slew_rate = 9;
    optional double speed_mode_threshold = 10 [default = 7.0];
    optional double speed_mode_deadzone = 11 [default = 1.0];
    optional bool enable_steer_fb_gain_scheduler = 12 [default = false];
    optional GainScheduler steer_fb_gain_scheduler = 13;
    optional bool enable_steer_rate_gain_scheduler = 14 [default = false];
    optional GainScheduler steer_rate_gain_scheduler = 15;
    optional bool pid_feedback_enable = 16 [default = true];
    // if disable pid,the param != 0
    optional double preview_distance_k = 17 [default = 0.1];
    optional double min_distance = 18 [default = 5.0];
    optional double max_distance = 19 [default = 20.0];
  }
  message ConfigYawRateObserver {
    repeated double noise_matrix_q = 1;
    repeated double noise_matrix_r_chassis = 2;
    repeated double noise_matrix_r_imu = 3;
    repeated double init_p = 4;
    optional double road_tire_friction_coefficient = 5 [default = 1.0];
    optional double lf = 6;
    optional double lr = 7;
  }

  message SteerRateLimiter {
    repeated SteerRateLimiterEle scheduler = 1;
  }

  message SteerRateLimiterEle {
    optional double speed = 1;
    optional double limit = 2;
  }

  message LateralControlLqr {
    optional int32 preview_window = 2;
    optional double cf = 3;
    optional double cr = 4;  // N/rad
    optional int32 mass_fl = 5;
    optional int32 mass_fr = 6;
    optional int32 mass_rl = 7;
    optional int32 mass_rr = 8;
    optional double eps = 9;        // converge threshold for lqr solver
    repeated double matrix_q = 10;  // matrix_q size = 4 + preview_window
    repeated double reverse_matrix_q =
        11;  // matrix_q size = 4 + preview_window for reverse gear
    optional int32 cutoff_freq = 12;              // cutoff frequency
    optional int32 mean_filter_window_size = 13;  // window size of mean filter
    // for a normal car, it should be in range[16, 18]
    optional int32 max_iteration = 14;  // maximum iteration for lqr solve
    optional double max_lateral_acceleration = 15;  // limit aggressive steering
    optional GainScheduler lat_err_gain_scheduler = 16;
    optional GainScheduler heading_err_gain_scheduler = 17;
    // optional LeadlagConf reverse_leadlag_conf = 18;
    optional bool enable_reverse_leadlag_compensation = 19 [default = false];
    optional bool enable_look_ahead_back_control = 20 [default = false];
    optional double lookahead_station = 21 [default = 0.0];
    optional double lookback_station = 22 [default = 0.0];
    optional double query_relative_time = 23;
    optional double minimum_speed_protection = 24;
    optional bool enable_gain_scheduler = 25;
    optional bool set_steer_limit = 26;
    optional bool reverse_heading_control = 27;
    optional double switch_speed = 28;
    optional bool path_move_forward_enable = 29 [default = false];
    optional int32 path_move_forward_point_num = 30;
    optional double path_move_delta_theta = 31;
    optional double steer_angle_cut_off_freq = 32 [default = 3.0];
    optional double lateral_error_cut_off_freq = 33 [default = 3.0];
    optional double heading_error_cut_off_freq = 34 [default = 3.0];
    optional double curvature_cut_off_freq = 35 [default = 3.0];
    optional double lateral_error_rate_cut_off_freq = 37 [default = 3.0];
    optional double heading_error_rate_cut_off_freq = 38 [default = 3.0];

    // use feedback gain scheduler
    optional GainScheduler lateral_error_integrator_scheduler = 39;
    optional GainScheduler lateral_error_scheduler = 40;
    optional GainScheduler lateral_error_dot_scheduler = 41;
    optional GainScheduler heading_error_scheduler = 42;
    optional GainScheduler heading_error_dot_scheduler = 43;

    // open integrator or not
    optional bool enable_lateral_error_integrator = 44;
  }

  message LateralControlKdc {
    message KDCGainScheduler {
      repeated KDCGainSchedulerInfo kdc_scheduler = 1;
    }

    message KDCGainSchedulerInfo {
      optional double speed = 1;  // m/s
      optional double kinematic_pole = 2;
      optional double kinematic_rho = 3;
      optional double kinematic_sigma = 4;
      optional double kinematic_epsion = 5;
      optional double dynamic_k = 6;
      optional double dynamic_pole = 7;
      optional double dynamic_zero = 8;
      optional double dynamic_ki = 9;
      optional double max_dynamic_integration_limit = 10;
    }

    message KdcKinematicConfGainTable {
      repeated KdcKinematicConf kdc_kinematic_conf = 1;
    }

    message KdcKinematicConf {
      optional double speed = 1;
      optional double kinematic_pole = 2;
      optional double kinematic_rho = 3;
      optional double kinematic_sigma = 4;
      optional double kinematic_epsion = 5;
      optional double kinematic_scale = 6;
    }

    // car physics parameters
    optional double cf = 1;
    optional double cr = 2;
    optional double mass_fl = 3;
    optional double mass_fr = 4;
    optional double mass_rl = 5;
    optional double mass_rr = 6;
    optional double wheel_base_length = 7;
    optional double steering_ratio = 8;

    // boundary parameters
    optional double min_speed_protection = 9 [default = 1.0];
    optional double max_speed_bound = 10 [default = 33.3];
    optional double min_k_protection = 11 [default = 0.3];
    optional double max_lateral_acc_bound = 12;
    optional double max_ref_kappa_bound = 13;
    optional double max_lateral_error_bound = 14;
    optional double max_heading_error_bound = 15;
    optional double max_yaw_rate_error_bound = 16;

    // control parameters
    optional double preview_time = 17 [default = 0.2];
    optional double min_preview_dist = 18 [default = 0.25];
    optional double max_preview_dist = 19 [default = 30];
    optional double vehicle_speed_cut_off_freq = 20 [default = 3.0];
    optional double yaw_rate_cut_off_freq = 21 [default = 3.0];
    optional double ref_yaw_rate_cut_off_freq = 22 [default = 3.0];
    optional double ref_kappa_cut_off_freq = 23 [default = 3.0];
    optional double lateral_error_cut_off_freq = 24 [default = 3.0];
    optional double heading_error_cut_off_freq = 25 [default = 3.0];
    optional double front_wheel_angle_cmd_cut_off_freq = 26 [default = 3.0];
    optional double kinematic_ff_gain = 27 [default = 1.0];
    optional double kinematic_pole = 28 [default = -0.5];
    optional double kinematic_rho = 29 [default = 0.0];
    optional double kinematic_sigma = 30 [default = 0.08];
    optional double kinematic_epsion = 31 [default = 0.05];
    optional double dynamic_ff_gain = 32 [default = 1.0];
    optional double dynamic_k = 33 [default = 1.0];
    optional double dynamic_pole = 34 [default = -1.0];
    optional double dynamic_zero = 35 [default = -1.0];
    optional bool use_observer_yawrate = 36;
    optional double dynamic_ki = 37 [default = 0.0];
    optional bool enable_kus_config = 38 [default = false];
    optional double kus_config = 39 [default = 0.0];
    optional bool enable_kdc_gain_scheduler = 40 [default = false];
    optional KDCGainScheduler kdc_gain_scheduler = 41;
    optional double max_dynamic_integration_limit = 42 [default = 0.01];
    optional bool enable_dynamic_integration = 43 [default = false];
    optional bool enable_data_record = 44 [deprecated = true];
    optional bool enable_kinematic_integration = 45 [default = false];
    optional double max_kinematic_integration_limit = 46 [default = 0.005];
    optional double hand_torque_limit = 47 [default = 0.6];
    optional double steer_protect_duration = 48;
    optional SteerRateLimiter steer_rate_limiter = 49;
    optional bool enable_steer_protection = 50 [default = false];
    optional double yawrate_error_band_radps = 51 [default = 0.01];
    // steering angle command rate limiter
    optional interpolation_1d steer_angle_cmd_rate_limiter = 52;
    optional double planner_request_steer_rate_limit = 53
        [default = 150];  // only avilable when planner requested in FS
    optional KdcKinematicConfGainTable kdc_kinematic_conf_gain_table = 54;
    optional bool enable_kdc_kinematic_conf_gain_table = 55 [default = false];
    optional double lateral_err_smooth_band = 56 [default = 0.01];
    optional double heading_err_smooth_band = 57 [default = 0.01];
    optional bool use_mpc_ref_yawrate = 60 [default = false];
  }

  oneof type {
    LateralControlLqr lateral_control_lqr = 1;
    LateralControlPid lateral_control_pid = 2;
    LateralControlKdc lateral_control_kdc = 3;
  }

  message SteerTorqueControl {
    optional double ts = 1 [default = 0.02];
    optional double torque_limit = 2 [default = 3];       // uinit nm
    optional double angle_err_limit = 3 [default = 0.2];  // unit rad
    optional PidParam torque_high_speed_pid_param = 4;
    optional double torque_dead_zone = 5
        [default = 0.5];  // min torque to move steer steer wheel
    optional bool torque_ff_enable = 6 [default = false];
    optional double torque_ff_gain = 7;
    optional double delta_torque_limit = 8 [default = 0.06];
    optional double torque_fb_gain = 9;
    optional double angle_delay_max_torque = 10
        [default = 1.0];  // must be < 1.0
    optional double angle_delay_min_torque = 11 [default = 0.1];
    optional double low_torque_n_root = 12 [default = 2.0];
    optional bool straighten_torque_compensation_en = 13 [default = false];
    optional double straighten_torque_compensation_gain = 14 [default = 1.0];
    optional double torque_compensation_limit = 15 [default = 0.5];
    optional double torque_ff_limit = 16 [default = 3.0];
    optional double torque_pid_param_switch_speed = 17
        [default = 13.8];  // unit m/s
    optional PidParam torque_low_speed_pid_param = 18;
  }
  optional SteerTorqueControl steer_torque_control = 4;
  optional bool steer_torque_enable = 5 [default = false];

  optional double angle_slew_rate = 9;
  optional double lateral_acc_limit = 10;
  optional double ts = 11
      [default = 0.02];  // sample time (dt) 0.02 now, configurable
  // preview window n, preview time = preview window * ts
  optional double heading_bias = 12 [default = 0.0];  // unit: deg
  optional ConfigYawRateObserver yaw_rate_observer = 13;
  optional bool enable_data_record = 14 [default = false];
  optional double hand_torque_cut_off_freq = 15 [default = 5.0];  // unit: hz

  // config
  message LateralControlParking {
    message SMCGainScheduler {
      repeated SMCGainSchedulerInfo scheduler = 1;
    }

    message SMCGainSchedulerInfo {
      optional double speed_mps = 1;  // m/s
      optional double kpole = 2;
      optional double krho = 3;
      optional double ksigma = 4;
      optional double kepsion = 5;
    }

    optional double wheel_base_length_m = 3;
    optional double max_steer_angle_rad = 4;
    optional double min_speed_protection_mps = 5;
    optional double max_speed_bound_mps = 6;
    optional SMCGainScheduler smc_gain_scheduler = 7;
  }

  optional double lateral_control_parking = 16;
  optional double comfort_k_cut_off_freq = 17;

  optional ConfigLatLmpcControl config_lat_lmpc_control = 18;
}

message ConfigLatLmpcControl {
  optional double ts_sec = 1 [default = 0.02];
  optional double model_discrete_time_sec = 2 [default = 0.1];
  repeated double mpc_matrix_q = 3;
  repeated double mpc_matrix_r = 4;
  optional uint32 np_gain = 5 [default = 15];
  optional uint32 nc_gain = 6 [default = 15];
  optional uint32 horizon = 7 [default = 15];
  optional double terminal_penality_coeff = 8 [default = 1.0];
  optional double max_acceleration_limit = 10 [default = 3.0];
  optional double max_deceleration_limit = 11 [default = 6.0];
  optional double max_jerk_limit = 12 [default = 10.0];
  optional double stopped_acc = 13 [default = -0.6];
  optional lookuptable_1d drive_acc_limiter = 14;
  optional lookuptable_1d steer_rate_limiter = 15;
  optional double max_lateral_acc_limit = 16 [default = 10.0];
  optional bool lmpc_active = 17 [default = false];
  optional uint32 lmpc_run_mode = 18 [default = 0];
  optional double heading_rate_cut_off_freq = 19 [default = 3.0];
  optional double front_wheel_angle_cut_off_freq = 20 [default = 3.0];
  message KeyValue {
    optional double speed = 1;
    repeated double coeff = 2;
  }
  message MatrixCoeffGain {
    repeated KeyValue key_value = 1;
  }
  optional MatrixCoeffGain matrix_q_coeff_gain = 21;
  optional MatrixCoeffGain matrix_r_coeff_gain = 22;
  optional double heading_cut_off_freq = 23 [default = 3.0];
  optional double front_wheel_angle_cmd_cut_off_freq = 24 [default = 3.0];
  optional double speed_cut_off_freq = 25 [default = 3.0];
  optional double ref_vy_decay_coeff = 26 [default = 1.0];
  optional double ref_heading_rate_decay_coeff = 27 [default = 1.0];
  optional bool use_estimate_heaing_rate = 28 [default = false];
  optional uint32 steer_preview_index = 29 [default = 0];
  optional int32 mpc_solver_max_iteration = 30 [default = 200];
  optional bool enable_steer_ff = 31 [default = false];
  optional double d_angle_smooth_epsion = 32 [default = 0.001];
  optional bool enable_steer_angle_smooth = 33 [default = false];
  // This value keep the same with KDC.
  optional double ref_min_spd_mps = 34 [default = 1.0];
  optional double min_path_left_threshold = 35 [default = 0.05];
  optional double lat_acc_hard_bound = 36 [default = 4.0];
  optional double lat_acc_soft_bound = 37 [default = 1.0];
  optional double lateral_doundray_hard_bound = 38 [default = 0.5];
  optional double lateral_doundray_soft_bound = 39 [default = 0.2];
  optional bool enable_affine_constrains = 40 [default = false];
  optional double lat_acc_soft_bound_weight = 41 [default = 1.0];
  optional double lateral_doundray_soft_bound_weight = 42 [default = 1.0];
  optional double lat_jerk_hard_bound = 43 [default = 10.0];
  optional double lat_jerk_soft_bound = 44 [default = 3.0];
  optional double lat_jerk_soft_bound_weight = 45 [default = 1.0];
  optional double lateral_doundray_hard_bound_weight = 46 [default = 1000.0];
  optional int32 osqp_max_iter = 47 [default = 200];
  optional double preview_time = 48 [default = 0.0];
  optional double lat_yawrate_actuator_lag_time = 49 [default = 0.2];
  optional double lat_yawrate_pure_delay_time = 50 [default = 0.2];
  optional lookuptable_1d lat_bound_weight_gain_table = 51;
  optional double lat_soft_bound_full_active_distace = 52 [default = 0.2];
}

message ConfigCalibration {
  message AutoCalibration {
    message CarModel {
      message Anchor {
        optional double speed = 1;
        optional double longi = 2;
      }
      message ThrotParam {
        message SpeedIndex {
          message LongiIndex {
            repeated double param = 1;
          }
          repeated LongiIndex longi_index = 1;
        }
        repeated SpeedIndex speed_index = 1;
      }
      message DzoneParam {
        repeated double lo_speed = 1;
        repeated double hi_speed = 2;
      }
      message BrakeParam {
        repeated double lo_speed = 1;
        repeated double hi_speed = 2;
      }

      optional double dzone_ssp = 1;
      optional double brake_ssp = 2;
      optional double speed_scale = 3;
      optional double longi_scale = 4;
      optional Anchor anchor0 = 5;
      optional Anchor anchor1 = 6;
      optional ThrotParam throt_param = 7;
      optional DzoneParam dzone_param = 8;
      optional BrakeParam brake_param = 9;
    }
    optional CarModel car_model = 1;
    optional double ts = 2 [default = 0.02];
  }

  message ManualCalibration {
    optional PidParam acc_throttle_pid_param = 1;
    optional PidParam acc_brake_pid_param = 2;
    optional CurveFittingParam throttle_fitting_param = 3;
    repeated CurveFittingParam brake_fitting_param = 4;
    repeated CoastFittingParam coast_fitting_param = 5;
    optional bool enable_acc_compensation = 6 [default = false];
    // Throttle/brake deadzone
    optional double throttle_deadzone_low = 7;
    optional double throttle_deadzone_up = 8;
    optional double brake_deadzone_low = 9;
    optional double brake_deadzone_up = 10;
    optional double ts = 11 [default = 0.02];
  }

  oneof type {
    AutoCalibration auto_calibration = 1;
    ManualCalibration manual_calibration = 2;
  }
}

message ConfigLongitudinalControl {
  message Cruise {
    optional PidParam vel_pid_param = 1;
    optional float acc_ff_gain = 2;
    optional float extra_stop_brake = 3 [default = 0.03];
    optional float stop_brake_time = 4 [default = 1.5];
  }

  message AdaptiveCruise {
    // determine the relative distance under dynamic case
    optional float headway_time = 1 [default = 1.5];
    // control parameters that determines the gain, cut-off frequency
    optional float k1 = 2 [default = 0.3];
    optional float k1_low_speed = 3 [default = 0.1];
    optional float k1_emergency = 4 [default = 0.4];
    optional float k2 = 5 [default = 0.042];
    optional float k3 = 6 [default = 12.0];
    optional float cd = 7 [default = 4.0];
    optional float cd_low_speed = 8 [default = 4.0];
    // the relative distance under stationary case
    optional float stand_still_vehicle = 9 [default = 4.0];
    optional float stand_still_stop_line = 10 [default = 1.0];
    // the emergency safety distance under stationary case
    optional float safety_region = 11 [default = 0.0];
    // the deceleration under emergency case
    optional float emergency_acc = 12 [default = -1.0];
    optional bool acc_function_on = 13 [default = false];
    optional float k1_slew_rate = 14 [default = 0.1];
    optional float cd_slew_rate = 15 [default = 0.5];
    optional float emergency_headway_time = 16 [default = 0.5];
    optional float emergency_headway_time_deadzone = 17 [default = 0.25];
    optional float extra_stop_brake = 18 [default = 0.03];
    optional float stop_brake_time = 19 [default = 1.5];
    optional float steep_stop_brake_time = 20 [default = 0.4];
  }

  message Acceleration {
    optional PidParam acc_throttle_pid_param = 1;
    optional PidParam acc_brake_pid_param = 2;
    optional CurveFittingParam throttle_fitting_param = 3;
    repeated CurveFittingParam brake_fitting_param = 4;
    repeated CoastFittingParam coast_fitting_param = 5;
  }

  message Trajectory {
    message Position {
      optional double fix_preview_window = 2;
      optional bool enable_position_preview = 3 [default = false];
      optional PidParam pos_pid_param = 4;
      optional double feedforward_gain = 5 [default = 1.0];
      optional double position_err_limit = 6 [default = 2.0];
      optional bool enable_dynamic_preview_window = 7 [default = false];
      optional double dynamic_preview_window_range = 8;
      // the value <= 0
      optional double dynamic_preview_dec_thrd = 9;
      optional double position_error_cut_off_freq = 10 [default = 3.0];
      optional double position_error_epsion = 11 [default = 3.0];
      optional double position_error_kc = 12 [default = 0.1];
    }

    message Speed {
      optional double speed_error_limit = 2;
      optional bool enable_acceleration_preview = 3 [default = false];
      optional PidParam speed_pid_param = 4;
      optional double acc_ff_gain = 5;
      optional double acc_cmd_cut_off_freq = 6 [default = 3.0];
      optional double speed_error_cut_off_freq = 7 [default = 3.0];
      optional double speed_error_epsion = 8 [default = 3.0];
    }

    optional Position position = 1;
    optional Speed speed = 2;
    optional double stopped_acc = 3 [default = -0.5];
    optional bool enable_hysteresis_regulator = 4 [default = false];
    optional double hysteresis_speed_limit = 5 [default = 3.0];
    optional double startup_acc_upperlimit = 6 [default = 0.6];
    optional double startup_release_spd = 7 [default = 0.5];
    optional double acclimit_release_spd = 8 [default = 1];
    repeated double soft_brake_acc_limit_X_mps = 9;
    repeated double soft_brake_acc_limit_mps2 = 10;
    optional bool enable_soft_brake_flg = 11 [default = false];
    optional double soft_brake_max_limit_gain_c = 12 [default = 2.0];
    optional double soft_brake_upper_limit_acc_mps2 = 13 [default = -1.0];
    optional double soft_brake_lower_limit_acc_mps2 = 14 [default = -4.0];
    repeated double soft_creep_acc_limit_X_mps = 15;
    repeated double soft_creep_acc_limit_mps2 = 16;
    optional bool enable_soft_creep_flg = 17 [default = false];
    optional double soft_creep_max_limit_gain_c = 18 [default = 2.0];
    optional double soft_creep_upper_limit_acc_mps2 = 19 [default = 2.0];
    optional double soft_creep_lower_limit_acc_mps2 = 20 [default = 0.8];
    optional double stopping_acc_limit_mps2 = 21 [default = -0.05];
    repeated double neg_acc_jerk_limit_X_mps = 22;
    repeated double neg_acc_inc_rate_limit_mps3 = 23;
    repeated double neg_acc_dec_rate_limit_mps3 = 24;
    repeated double pos_acc_jerk_limit_X_mps = 25;
    repeated double pos_acc_inc_rate_limit_mps3 = 26;
    repeated double pos_acc_dec_rate_limit_mps3 = 27;
    optional bool enable_jerk_limiter = 28 [default = true];

    // proto id: 29~50 are reserved for creep control
    // creep control calibration
    message Creep {
      // enable creep control
      optional bool enable_creep_control_flg = 1 [default = false];
      // filter cof
      optional double ego_spd_cof_hz = 2 [default = 3.0];
      optional double ego_s_cof_hz = 3 [default = 3.0];
      optional double fcar_spd_cof_hz = 4 [default = 3.0];
      optional double fcar_ds_cof_hz = 5 [default = 3.0];
      optional double vobj_spd_cof_hz = 6 [default = 3.0];
      optional double vobj_ds_cof_hz = 7 [default = 3.0];
      optional double max_creep_spd_cof_hz = 8 [default = 3.0];
      // tau gap setting
      optional double fcar_safe_distance_time_sec = 9
          [default = 1.5];  // related to taugap
      optional double fcar_min_safe_distance_m = 10
          [default = 2.0];  // min stop delta distance to front car
      // virtual object distance buffer
      optional double vobj_safe_distance_buffer_m = 11 [default = 0.5];
      optional double virtual_object_path_preview_time_sec = 12 [default = 3.0];
      // max creep speed setting
      optional double max_creep_speed_mps = 13 [default = 5.0];
      optional double path_max_speed_buffer_mps = 14 [default = 2.0];
      // kp multiplier
      optional double creep_pose_kp_multiplier_gain = 15 [default = 1.0];
      optional double creep_speed_kp_multiplier_gain = 16 [default = 1.0];
      // start stop arbitration condition
      optional double stop_speed_thre_lo_mps = 17 [default = 0.1];
      optional double stop_speed_thre_hi_mps = 18 [default = 0.3];
      optional double creep_start_quit_speed_thres_mps = 19 [default = 1.0];
      // acc arb jerk limit
      optional double creep_acc_arb_jerk_limit_mps3 = 20 [default = 2.0];
      // speed dead zone for target ds
      optional double target_ds_speed_dead_zone_mps = 21 [default = 0.5];
      // enable virtual object tracking
      optional bool enbl_vobj_flg = 22 [default = false];
      // creep start acc compensation
      optional bool use_path_preview_start_acc_flg = 23 [default = false];
      optional double start_acc_preview_time_sec = 24 [default = 0.2];
      // front object target acc lpf cof
      optional double fcar_acc_cof_hz = 25 [default = 3.0];
      optional double vobj_acc_cof_hz = 26 [default = 3.0];
      // error bound
      optional double creep_s_error_bound_m = 27 [default = 10.0];
      optional double creep_v_error_bound_mps = 28 [default = 5.0];
      // creep stop debounce time
      optional double set_stop_turn_on_delay_time_sec = 29 [default = 0.1];
      optional double reset_stop_turn_on_delay_time_sec = 30 [default = 0.2];
      // creep pose error smooth calibrations
      optional double creep_pose_error_smooth_time_sec = 31 [default = 0.2];
      optional double creep_pose_error_min_smooth_range_m = 32 [default = 0.1];
      // creep speed loop damping
      optional double speed_error_grad_cof_hz = 33 [default = 2.0];
      optional double speed_error_grad_dz_mps2 = 34 [default = 0.5];
      optional double creep_acc_damping_hi_bound_mps2 = 35 [default = 0.2];
      optional double creep_acc_damping_lo_bound_mps2 = 36 [default = -0.5];
      // creep acc bound
      optional double creep_brake_soft_distance_m = 37 [default = 0.0];
      optional double creep_brake_vcu_delay_sec = 38 [default = 0.4];
      optional double creep_brake_acc_bound_offset_mps2 = 39 [default = -0.2];
      optional double creep_brake_max_acc_bound_mps2 = 40 [default = -0.5];
      optional double creep_brake_min_acc_bound_mps2 = 41 [default = -5.0];
      optional double creep_drive_max_acc_bound_mps2 = 42 [default = 1.5];
      // creep acc damping use 2d look up table
      optional double creep_acc_damping_derate_gain = 43 [default = 1.0];
      optional bool creep_acc_damping_use_2d_table_flg = 44 [default = true];
      // creep drive acc limit
      optional double creep_drive_acc_limit_distance_m = 45 [default = 0.5];
      // creep arb jerk limit positive Acc
      optional double creep_acc_arb_jerk_limit_pos_acc_mps3 = 46
          [default = 3.0];
      // creep brake acc limit open loop
      optional double creep_enter_brake_max_acc_limit_mps2 = 47
          [default = -2.5];
      optional double creep_brake_acc_limit_mid_speed_mps = 48 [default = 2.0];
      // target s use min speed between ego car and front car
      optional bool use_min_speed_for_target_s_flg = 49 [default = false];
      // creep acc quality arbitration
      optional bool enable_creep_acc_quality_arbitration_flg = 50
          [default = false];
      optional double invalid_follow_s_thres_m = 51 [default = -2.0];
      optional double delta_v_thres_for_unwanted_accel_mps = 52 [default = 0.5];
      optional double path_a_thres_for_unwanted_accel_mps2 = 53
          [default = -0.5];
      optional double follow_s_thres_for_unwanted_accel_m = 54 [default = 6.0];
      optional double delta_v_thres_for_unwanted_decel_mps = 55
          [default = -0.5];
      optional double path_a_thres_for_unwanted_decel_mps2 = 56 [default = 0.5];
      optional double path_a_thres_for_harsh_brake_mps2 = 57 [default = -1.5];
      optional double delta_v_thres_for_harsh_brake_mps = 58 [default = 0.0];
      // ds to stop buffer for brake ff
      optional double ds_to_stop_s_buffer_m = 59 [default = 0.0];
      // creep max v rate limiter parameter
      optional double creep_max_v_rate_lmt_lo_mps2 = 60 [default = 0.2];
      optional double creep_max_v_rate_lmt_hi_mps2 = 61 [default = 1.5];
      // enable creep acc arbitration
      optional bool enable_unwanted_accel_arb_flg = 62 [default = false];
      optional bool enable_unwanted_decel_arb_flg = 63 [default = false];
      // enable creep target v gradient compensation
      optional bool enable_tar_v_grad_cmpsn_flg = 64 [default = false];
      optional double tar_v_grad_lpf_cof_hz = 65 [default = 1.0];

      // look up table 1d
      optional interpolation_1d pose_loop_kp_gain = 101;
      optional interpolation_1d speed_loop_kp_gain = 102;
      optional interpolation_1d pose_loop_kp_derate_gain = 103;
      optional interpolation_1d speed_loop_kp_derate_gain = 104;
      optional interpolation_1d start_up_acc_ol_mps2 = 105;
      optional interpolation_1d start_up_fcar_acc_ff_derate_gain = 106;
      optional interpolation_1d brake_fcar_acc_ff_derate_gain = 107;
      optional interpolation_1d speed_loop_kp_ds_to_stop_gain = 108;
      optional interpolation_1d brake_acc_ff_ds_to_stop_mps2 = 109;
      optional creep_speed_filter creep_target_speed_filter = 110;
      optional interpolation_1d speed_loop_kd_gain = 111;
      optional interpolation_1d follow_stop_limit_drive_acc = 112;
      optional interpolation_1d ds_to_stop_limit_target_v_inc_rate = 113;
      optional interpolation_1d quit_creep_jerk_limit = 114;
      optional interpolation_1d enter_creep_jerk_limit = 115;
      optional interpolation_1d follow_v_rate_limit = 116;
      optional interpolation_1d target_v_grad_jerk_limit = 117;
      optional interpolation_1d target_v_grad_derate_gain = 118;
      optional interpolation_1d delta_target_v_derate_gain = 119;
      optional interpolation_1d cutin_creep_brake_acc_limit = 120;
      optional interpolation_1d follow_v_inc_rate_limit = 121;
      optional interpolation_1d follow_v_dec_rate_limit = 122;
    }
    optional Creep creep = 50;
    // proto id: 29~50 are reserved for creep control

    // path brake  acc limit and compensation
    message Harsh_Brake_Limit {
      optional interpolation_1d path_soft_brake_limit = 1;
      optional double path_brake_capacity_mps2 = 2 [default = -5.0];
      optional bool enable_harsh_brake_limit_flg = 3 [default = true];
    }
    optional Harsh_Brake_Limit harsh_brake_limit = 51;
    // lane keep brake model for acc limit
    message LK_Brake_Model {
      optional double lk_brake_soft_distance_m = 1 [default = 0.0];
      optional double lk_brake_vcu_delay_sec = 2 [default = 0.4];
      optional double lk_brake_acc_bound_offset_mps2 = 3 [default = -0.2];
      optional double follow_v_pred_const_accel_time_sec = 4 [default = 0.5];
      optional double follow_v_pred_const_speed_time_sec = 5 [default = 0.5];
      optional double min_safe_follow_dist_time_const_sec = 6 [default = 0.3];
      optional interpolation_1d follow_a_inc_rate_limit = 7;
      optional double brake_model_acc_lvl1_mps2 = 8 [default = -1.0];
      optional double brake_model_acc_lvl2_mps2 = 9 [default = -1.5];
      optional double brake_model_acc_lvl3_mps2 = 10 [default = -2.0];
      optional double brake_model_acc_lvl4_mps2 = 11 [default = -3.0];
      optional double brake_model_acc_lvl5_mps2 = 12 [default = -4.0];
      optional double brake_model_acc_hysteresis_mps2 = 13 [default = 0.25];
      optional double brake_model_acc_jerk_limit_mps3 = 14 [default = 3.0];
    }
    optional LK_Brake_Model lk_brake_model = 52;
    // brake feedforward compensation
    message Brake_FeedForward_Compensation {
      optional bool enable_brake_ff_compensation_flg = 1 [default = false];
      optional interpolation_1d brake_ff_compensation = 2;
      optional double brake_ff_time_const_sec = 3 [default = 0.5];
    }
    optional Brake_FeedForward_Compensation brake_ff_compensation = 53;
    message TargetVAdaptor {
      optional interpolation_1d target_v_transit_rate_limit = 1;
      optional interpolation_1d ref_acc_transit_rate_limit = 2;
      optional double transit_lpf_cof_hz = 3;
      optional double stop_disable_dec_rate_limit_thres_mps = 4;
    }
    optional TargetVAdaptor target_v_adaptor = 54;
  }

  message Parking {
    optional double KPARK_stop_speed_limit_kph = 1 [default = 4];
    optional double KPARK_stop_dist_decease_limit_cm = 2 [default = 30];
    optional bool KPARK_dist_ctrl_flag = 3 [default = true];
    optional double KPARK_stop_dist_cutoff_freq_hz = 4 [default = 3];
  }
  message TrajectoryMpc {
    optional double stopped_acc = 1 [default = -0.5];

    optional bool enable_preview_control_flg = 20 [default = true];
    optional double preview_time_sec = 21 [default = 0.2];

    optional double max_position_error_bound_m = 22 [default = 5.0];
    optional double position_error_cut_off_freq_hz = 23 [default = 3.0];
    optional double position_controller_ff_gain = 24 [default = 1.0];
    optional double position_controller_kp_gain = 25 [default = 0.3];

    optional double max_speed_error_bound_m = 26 [default = 3.0];
    optional double speed_error_cut_off_freq_hz = 27 [default = 3.0];
    optional double speed_controller_ff_gain = 28 [default = 1.0];
    optional double speed_controller_kp_gain = 29 [default = 0.3];

    optional bool enable_hysteresis_regulator_flg = 30 [default = true];
    optional double hysteresis_speed_bound_mps = 31 [default = 2.78];
    optional double position_error_epsion_gain = 32 [default = 0.4];
    optional double position_error_kc_gain = 33 [default = 1.2];
    optional double speed_error_epsion_gain = 34 [default = 0.2];
    optional double speed_error_kc_gain = 35 [default = 1.2];

    optional double time_constant_tau_gain = 36 [default = 0.16];
    optional double speed_cut_off_freq_hz = 37 [default = 3.0];
    optional double acc_cut_off_freq_hz = 38 [default = 3.0];

    optional double dis_ts_sec = 40 [default = 0.1];
    repeated double mpc_matrix_q = 41;
    optional double mpc_matrix_r = 42;
    optional uint32 np_gain = 43 [default = 10];
    optional uint32 nc_gain = 44 [default = 10];
    message QKeyValue {
      optional double speed = 1;  // m/s
      repeated double q_coeff = 2;
    }
    message MatrixQCoeffGain {
      repeated QKeyValue key_value = 1;
    }
    optional MatrixQCoeffGain matrix_q_coeff_gain = 45;
    optional double s_error_bound_m = 46 [default = 3.0];
    message StartUpConf {
      optional double jerk_upper_bond_coff = 1 [default = 1.0];
      optional double acc_upper_bond_coff = 2 [default = 1.0];
    }
    optional StartUpConf start_up_conf = 47;
    optional double acc_cmd_cut_off_freq_hz = 48 [default = 2.0];
    message StopConf {
      optional double speed_threshold = 1 [default = 0.0];
      optional double acc_threshold = 2 [default = 0.0];
    }
    optional StopConf stop_conf = 50;
    optional lookuptable_1d drive_acc_limiter = 51;

    optional double terminal_penality_coff = 52 [default = 1.0];
    optional lookuptable_1d stopped_acc_jerk_limiter = 53;
    optional lookuptable_1d psp_drive_acc_limiter = 54;

    // creep calibrations
    optional lookuptable_1d creep_target_speed = 100;
    optional double ref_s_weight = 101 [default = 0.001];
    optional double delta_u_weight = 102 [default = 1.0];
    optional double soft_brake_weight = 103 [default = 0.1];
    optional double creep_speed_weight = 104 [default = 0.1];
    optional double soft_brake_jerk_mps3 = 105 [default = 2.0];
    optional bool use_follow_s_for_creep_flg = 106 [default = false];
    optional double creep_inc_jerk_mps3 = 107 [default = 1.0];
    optional double creep_dec_jerk_mps3 = 108 [default = -5.0];
    optional double enter_creep_end_speed_thres_mps = 109 [default = 0.25];
    optional double quit_creep_end_speed_thres_mps = 110 [default = 0.5];
    optional int32 jerk_stitch_np = 111 [default = 3];
    optional double jerk_stitch_weight = 112 [default = 0.1];
  }

  optional ConfigCalibration config_calibration = 1;
  oneof type {
    Cruise cruise = 2;
    AdaptiveCruise adaptive_cruise = 3;
    Trajectory trajectory = 4;
    Parking parking = 17;
    TrajectoryMpc trajectory_mpc = 18;
  }
  optional bool enable_gravity_compensation = 5 [default = false];
  optional double acceleration_limit = 6 [default = 1.0];
  optional double deceleration_limit = 7 [default = 3.0];
  optional double stop_line_acceleration_limit = 8 [default = 1.5];
  optional double stop_line_deceleration_limit = 9 [default = 5.0];
  optional double acceleration_jerk_limit = 10 [default = 1.5];
  optional double deceleration_jerk_limit = 11 [default = 2.5];
  optional double stop_line_acceleration_jerk_limit = 12 [default = 1.5];
  optional double stop_line_deceleration_jerk_limit = 13 [default = 4.0];
  optional double pitch_bias = 14 [default = 0.0];
  optional double ts = 15 [default = 0.02];
  optional bool enable_data_record = 16 [default = false];
  optional ControllerFunction controller_func = 25;
  enum ControllerFunction {
    DRIVING = 0;
    PARKING = 1;
  }
}

message lookuptable_1d {
  repeated double breakpoints = 1;
  repeated double tabledata = 2;
}

message interpolation_1d {
  message KeyValue {
    optional double bp = 1;
    optional double tb = 2;
  }
  repeated KeyValue key_value = 1;
}
message creep_speed_filter {
  message KeyValue {
    optional double follow_v_mps = 1;
    optional double target_v_inc_rate_limit_mps2 = 2;
    optional double target_v_dec_rate_limit_mps2 = 3;
    optional double follow_v_cof_hz = 4;
  }
  repeated KeyValue key_value = 1;
}
message ConfigModeControl {
  enum Type { DEMO_MKZ = 0; }
  optional Type type = 1;
  enum Mode {
    AUTO = 0;
    LONG_AUTO = 1;
    LAT_AUTO = 2;
    MANUAL = 3;
  }
}

message ConfigSimulation {
  enum Mode {
    DISABLE = 0;
    LONGITUDINAL_ONLY = 1;
    LATERAL_ONLY = 2;
    BOTH_AUTO = 3;
    NUM = 4;
  }
  optional Mode simulation_mode = 1;
  optional bool enable_log_file = 2;
}
