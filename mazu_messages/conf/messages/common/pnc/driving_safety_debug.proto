syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;

import "common/pnc/geometry.proto";
import "common/pnc/path.proto";
import "common/pnc/planner_debug.proto";
import "common/pnc/hmi_state.proto";
import "common/pnc/perception_object.proto";
import "common/function_arb/function_arb_in.proto";
import "common/vehicle_out/ads_actu.proto";
import "common/pnc/road_map.proto";

import "common/diagnostic/fim/fim_software.proto";
import "common/diagnostic/fim/fim_mcu_system.proto";
import "common/localization/relative_localization.proto";
import "common/pnc/driving_safety_observer.proto";
import "common/pnc/driving_safety_mp_type.proto";
import "common/perf/sensor_ts_header.proto";

message NDSObserverDebug {
  optional NDSObserverOutput obs_out = 1;
  optional NDSObserverInput obs_in = 2;
}

message DrivingSafetyPath {
  // in ns
  optional uint64 time_meas = 1;

  message ReferencePose {
    optional Vector3d position = 1;
    optional Vector3d euler_angle = 2;
  }
  // reference cordinate
  optional ReferencePose reference_pose = 2;
  //
  optional ReplanType replan_type = 3 [default = NO_REPLAN];  // replan type
  // the whole path include several path points
  repeated PathPointNop path_points = 4;

  optional Transformation3d reference_frame = 5;
}

message Fim {
  optional McuSystemFimInfo mcu_sys_fim_info = 1;
  optional FimSoftwareInfo fim_software_info = 2;
}

message VehicleStateNop {
  optional uint64 time_meas = 1;
  // px,py,pz, meter
  optional Vector3d position = 2;
  // vx,vy,vz, meter/s
  optional Vector3d velocity = 3;
  // ax,ay,az, meter^2/s
  optional Vector3d linear_acc = 4;
  // wx,wy,wz, rad/s
  optional Vector3d angular_vel = 5;
  // roll,pith,yaw, radium
  optional Vector3d euler_angle = 6;

  optional double front_wheel_angle_rad = 7;

  // observer output
  optional NDSObserverOutput obs_out = 8;

  // localization status
  optional RelativeLocalization.Status status = 9;
  optional double disp_spd_mps = 10;

  optional double current_s_m = 11;

  optional uint64 timestamp = 536870905;     // ptp time, nanosec, for cosine bundle timestamp
  optional SensorTSHeader sensor_original_ts = 536870906;  // sensor original ts
  optional uint64 publish_ptp_ts = 536870907;  // publish ptp timestamp, uint in nanosec
  optional string publisher_id = 536870909;  // uuid of the publisher
  optional uint64 counter = 536870910;       // message counter
  optional uint64 publish_ts = 536870911;  // publish utc timestamp; unit : nanosecond
}

enum DrivingSafetyMode {
  EMERGENCY_BRAKE = 0;
  EMERGENCY_STEERING = 1;
  STITCH_NAD = 2;
  COMFORTABLE_PILOT = 3;
  MODE_NUM = 4;
}

message SmDebug {}

message McDebug {
  // lateral debug info [1000 ~ 2000]
  // lateral common debug info [1000 ~ 1499]
  optional double lat_nearest_lateral_error_raw_m = 1000;
  optional double lat_nearest_lateral_error_filt_m = 1001;
  optional double lat_nearest_heading_error_raw_rad = 1002;
  optional double lat_nearest_heading_error_filt_rad = 1003;
  optional double lat_preview_ref_kappa_raw_1pm = 1004;
  optional double lat_preview_ref_kappa_filt_1pm = 1005;
  optional PathPointNop lat_nearest_point = 1006;
  optional PathPointNop lat_preview_point = 1007;
  optional double lat_vehicle_speed_raw_mps = 1008;
  optional double lat_vehicle_speed_filt_mps = 1009;
  optional double lat_yaw_rate_raw_radps = 1010;
  optional double lat_yaw_rate_filt_radps = 1011;
  optional VehicleStateNop lat_vehicle_state = 1014;
  optional uint64 lat_start_cal_timestamp_ns = 1015 [default = 0];
  optional uint64 lat_end_cal_timestamp_ns = 1016 [default = 0];
  optional double lat_preview_dist_m = 1017;

  // lateral kin debug info [1500 ~ 1699]
  optional double lat_kin_c1_term = 1500;
  optional double lat_kin_c2_term = 1501;
  optional double lat_kin_c3_term = 1502;
  optional double lat_kin_lateral_error_integration_m = 1503;
  optional double lat_kin_s_value = 1504;
  optional double lat_kin_s_surface = 1505;
  optional double lat_kin_ueq_known_req_radps = 1506;
  optional double lat_kin_ueq_known_req_steer_deg = 1507;
  optional double lat_kin_feedforward_req_radps = 1508;
  optional double lat_kin_feedforward_req_steer_deg = 1509;
  optional double lat_kin_feedback_req_radps = 1510;
  optional double lat_kin_feedback_req_steer_deg = 1515;
  optional double lat_kin_total_req_radps = 1512;
  optional double lat_kin_total_req_steer_deg = 1513;

  // lateral dyn debug info [1700 ~ 1899]
  optional double lat_dyn_yaw_rate_req_raw_radps = 1700;
  optional double lat_dyn_yaw_rate_req_acc_limit_radps = 1711;
  optional double lat_dyn_yaw_rate_req_filt_radps = 1712;
  optional double lat_dyn_feedforward_req_rad = 1713;
  optional double lat_dyn_yaw_rate_error_raw_radps = 1714;
  optional double lat_dyn_yaw_rate_error_smooth_radps = 1715;
  optional double lat_dyn_yaw_rate_error_integration_radps = 1716;
  optional double lat_dyn_yaw_rate_error_limit_radps = 1717;
  optional double lat_dyn_feedback_req_zpk_rad = 1718;
  optional double lat_dyn_feedback_req_integral_rad = 1719;
  optional double lat_dyn_feedback_req_rad = 1720;
  optional double lat_dyn_total_req_rad = 1721;

  // lateral others debug info [1900 ~ 2000]
  optional double lat_front_wheel_angle_req_raw_rad = 1900;
  optional double lat_front_wheel_angle_acc_limit_rad = 1901;
  optional double lat_front_wheel_angle_cmd_filt_rad = 1903;
  optional double lat_front_wheel_angle_cmd_final_rad = 1904;

  // lon debug info [2001 ~ 3000]
  optional PathPointNop lon_cur_time_target_point = 2001;
  optional double lon_position_error_raw_m = 2002;
  optional double lon_speed_error_raw_mps = 2003;
  optional double lon_acc_error_raw_mps2 = 2004;
  optional double lon_speed_feedforward_raw_mps = 2005;
  optional double lon_speed_feedback_raw_mps = 2006;
  optional double lon_speed_request_raw_mps = 2007;
  optional double lon_accel_feedforward_raw_mps2 = 2008;
