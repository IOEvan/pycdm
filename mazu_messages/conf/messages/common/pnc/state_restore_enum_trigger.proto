syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages.trigger;

enum DcpLonAction {
  kAccelerate = 0;
  kDecelerate = 1;
  kFallBack = 2;
  kMaxIndex = 3;
}

