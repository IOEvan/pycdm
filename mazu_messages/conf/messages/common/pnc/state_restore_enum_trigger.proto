  EMERGENCY_AVOIDANCE = 1;
  SPLIT = 2;
  OFF_RAMP = 3;
  LANE_KEEP_SPLIT = 4;
  RAMP_TO_ROAD = 5;
  PRIORITY = 6;
  MERGE = 7;
