syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;

import "common/perf/sensor_ts_header.proto";
import "np/apps/parking/par_base.proto";


message ParkStateMachine {
    optional NodeInfo node_info = 1;

    optional ParkFeatureStatus feature_status = 2;

    optional SlotBase target_slot = 3; // only has target_slot.slot_index (send when into Preguidance)
    enum SapaModType_e{
        SapaMode_Off    = 0;//Off
        SapaMode_Fusion = 1;//Fusion
        SapaMode_USS    = 2;//USS only
        SapaMode_VISION = 3;//Vision only
        SapaMode_Rsrvd4 = 4;//Reserved
        SapaMode_Rsrvd5 = 5;//Reserved
        SapaMode_Rsrvd6 = 6;//Reserved
        SapaMode_Rsrvd7 = 7;//Reserved
    }
    optional SapaModType_e operation_mode = 4;

    enum PsapModeType_e{
        PsapModeType_Unknown    = 0;
        PsapModeType_Vehicle    = 1;//vehicle-based perception
        PsapModeType_Station    = 2;//station-based perception
        PsapModeType_Rsrvd3     = 3;//Reserved
        PsapModeType_Rsrvd4     = 4;//Reserved
    }
    optional PsapModeType_e psap_mode = 5;

    enum StartRegionModType_e{
        StartRegionModType_Unknown    = 0;
        StartRegionModType_LocBox     = 1;
        StartRegionModType_SwitchRgn  = 2;
        StartRegionModType_PrkLot     = 3;
        StartRegionModType_Rsrvd4     = 4;//Reserved
    }
    optional StartRegionModType_e start_region_mode = 6;

    enum DriveToStartRgnModType_e{
        DriveToStartRgnModType_Unknown  = 0;
        DriveToStartRgnModType_HumanDrv = 1;
        DriveToStartRgnModType_PspDrv   = 2;
        DriveToStartRgnModType_Rsrvd3   = 3;//Reserved
        DriveToStartRgnModType_Rsrvd4   = 4;//Reserved
    }
    optional DriveToStartRgnModType_e drv_to_start_region_mode = 7;

    enum ParkFeatureStatus {
        PARKINGFEATURE_Off = 0;
        PARKINGFEATURE_Standby = 1;
        PARKINGFEATURE_Search = 2; // Localization in PSAP,equal to Search On in SAPA.
        PARKINGFEATURE_Preguidance = 3;
        PARKINGFEATURE_GuidanceActive = 4;
        PARKINGFEATURE_Suspend = 5;
        PARKINGFEATURE_Irreversible_Abort = 6;
        PARKINGFEATURE_TakeOver_Abort = 7;
        PARKINGFEATURE_Finish = 8;
        PARKINGFEATURE_Fault = 9;
        PARKINGFEATURE_RemotePrepare = 10;
    }
    optional string vid = 10000; // vid of source vehicle

    optional uint64 timestamp = 536870905;     // ptp time, nanosec, for cosine bundle timestamp
    optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts = 536870907;     // publish ptp timestamp, uint in nanosec
    optional string publisher_id = 536870909; // uuid of the publisher
    optional uint64 counter = 536870910; // message counter
    optional uint64 publish_ts = 536870911; // publish utc timestamp; unit : nanosecond
}
