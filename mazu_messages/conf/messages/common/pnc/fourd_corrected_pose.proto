syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";
import "common/localization/global_localization.proto";
// For 4D_dynamic

message FourdLaneLoc {
  optional uint32 lane_loc_from_left = 1;
  optional uint32 lane_loc_from_right = 2;
  optional uint32 total_lane_num = 3;
}

message FourdPose {
  optional uint64 time_meas = 1;
  optional double confidence = 2;

  enum PoseSource {
    FROM_GLOBAL_LOCALIZATION = 0;
    FROM_WM_FUSION = 1;
  }

  optional PoseSource pose_source = 3;

  enum WMConfidence {
    INVALID = 0;
    PERCEPTION_ONLY = 1;
    HDMAP_ONLY = 2;
    FUSION_MODE = 3;
  }

  optional WMConfidence wm_confidence = 4;
  optional FourdLaneLoc lane_loc = 5;  // lane loc from WM
  optional LaneLoc.LaneLocStatus lane_loc_status = 6;
  optional float cross_distance = 7;  // distance to next cross junction

  optional uint64 timestamp = 536870905;     // ptp time, nanosec, for cosine bundle timestamp
  optional SensorTSHeader sensor_original_ts = 536870906;  // sensor original ts
  optional uint64 publish_ptp_ts =
      536870907;  // publish ptp timestamp, uint in nanosec
  optional string publisher_id = 536870909;  // uuid of the publisher`
  optional uint64 counter = 536870910;       // message counter
  optional uint64 publish_ts =
      536870911;  // publish timestamp; unit : nanosecond
}
