syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

message SwitchConfig {
    optional bool tjp_switch_cloud              = 1;   //tjp feature switch, true: open, false: close
    optional bool mrm_bootup_valid              = 2;   //MRM上电循环内允许重复激活，true: 允许，false: 不允许，default: close 不允许
}

message PncParamConfig {
    optional double tjp_setspeed                = 1; //车速设置阈值, 单位kph  default 60kph, 调整范围 60~120kph, 小端模式
}


message NopParamConfig {
    optional SwitchConfig switch                = 1;  //开关类
    optional bool switch_update                 = 2;  //true: SwitchConfig needs updating  false: no changes with SwitchConfig
    optional PncParamConfig param               = 3;  //pnc参数类
    optional bool param_update                  = 4;  //true: PncParamConfig needs updating  false: no changes with PncParamConfig

    optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
    optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts   = 536870907;   //publish ptp timestamp, uint in nanosec
    optional string publisher_id     = 536870909;   // uuid of the publisher
    optional uint64 counter          = 536870910;  // message counter
    optional uint64 publish_ts       = 536870911;  // publish timestamp; unit : nanosecond
}