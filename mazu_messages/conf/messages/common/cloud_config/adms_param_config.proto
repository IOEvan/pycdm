syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";
import "common/cloud_config/adms_sensetime_config.proto";
import "common/cloud_config/adms_operation_config.proto";
import "common/cloud_config/adms_minieye_config.proto";


message ADMSConfig {
    optional ADMSSenseTimeConfig sensetime_config       = 1;
    optional bool sensetime_config_update               = 2;    //true: sensetime_config needs updating  false: no changes with sensetime_config
    optional ADMSMinieyeConfig minieye_config           = 3;
    optional bool minieye_config_update                 = 4;    //true: minieye_config needs updating  false: no changes with minieye_config
    optional ADMSOperationConfig operation_config       = 5;
    optional bool operation_config_update               = 6;    //true: operation_config needs updating  false: no changes with operation_config

    optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
    optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts   = 536870907;   //publish ptp timestamp, uint in nanosec
    optional string publisher_id     = 536870909;   // uuid of the publisher
    optional uint64 counter           = 536870910;  // message counter
    optional uint64 publish_ts      = 536870911;  // publish timestamp; unit : nanosecond
}
