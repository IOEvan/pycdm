syntax = "proto2"; 
option cc_enable_arenas = true;
       

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

message PowerFimInfo{
    optional PrimaryPowerFimInfo primary_power_fim_info = 1;
    optional SecondaryPowerFimInfo secondary_power_fim_info = 2;

    optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
    optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts = 536870907;   // publish ptp timestamp, uint in nanosec
    optional string publisher_id   = 536870909; // uuid of the publisher
    optional uint64 counter        = 536870910;         // message counter
    optional uint64 publish_ts     = 536870911;    // publish utc timestamp; unit : nanosecond
}

message PrimaryPowerFimInfo{
    optional bool FIM_Primary_Battery_Input_Overvoltage = 1;
    optional bool FIM_Primary_Battery_Input_Undervoltage = 2;
    optional bool FIM_MISC_Battery_Abnormal = 3;
    optional bool FIM_S1_Battery_Input_Overvoltage = 4;
    optional bool FIM_S1_Battery_Input_Undervoltage = 5;
    optional bool FIM_GNSSA_Battery_Input_Overvoltage = 6;
    optional bool FIM_GNSSA_Battery_Input_Undervoltage = 7;
    optional bool FIM_GNSSB_IMU_Battery_Input_Overvoltage = 8;
    optional bool FIM_GNSSB_IMU_Battery_Input_Undervoltage = 9;
    optional bool FIM_GNSS_IMU_Battery_Input_Overvoltage = 10;
    optional bool FIM_GNSS_IMU_Battery_Input_Undervoltage = 11;
    optional bool FIM_S2_Battery_Input_Overvoltage = 12;
    optional bool FIM_S2_Battery_Input_Undervoltage = 13;
    optional bool FIM_Primary_Cameras_Battery_Overvoltage = 14;
    optional bool FIM_Primary_Cameras_Battery_Undervoltage = 15;
    optional bool FIM_BAT_IN21_VSENSE_Overvoltage = 16;
    optional bool FIM_BAT_IN21_VSENSE_Undervoltage = 17;
    optional bool FIM_P3V3_MCU21_VSENSE_Overvoltage = 18;
    optional bool FIM_P3V3_MCU21_VSENSE_Undervoltage = 19;
}

message SecondaryPowerFimInfo{
    optional bool FIM_Secondary_Battery_Input_Overvoltage = 1;
    optional bool FIM_Secondary_Battery_Input_Undervoltage = 2;
    optional bool FIM_MISC_Battery_Abnormal = 3;
    optional bool FIM_S3_Battery_Input_Overvoltage = 4;
    optional bool FIM_S3_Battery_Input_Undervoltage = 5;
    optional bool FIM_S4_Battery_Input_Overvoltage = 6;
    optional bool FIM_S4_Battery_Input_Undervoltage = 7;
    optional bool FIM_BAT_IN12_VSENSE_Overvoltage = 8;
    optional bool FIM_BAT_IN12_VSENSE_Undervoltage = 9;
    optional bool FIM_P3V3_MCU12_VSENSE_Overvoltage = 10;
    optional bool FIM_P3V3_MCU12_VSENSE_Undervoltage = 11;
    optional bool FIM_Secondary_Cameras_Battery_Overvoltage = 12 ;
    optional bool FIM_Secondary_Cameras_Battery_Undervoltage = 13 ;
}
