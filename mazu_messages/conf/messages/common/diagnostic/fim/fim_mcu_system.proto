syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

message McuSystemFimInfo {// Detected by FW
  optional bool FIM_MCU1_TEMP_ERROR = 1;
  optional bool FIM_MCU1_ERROR = 2;
  optional bool FIM_MCU2_TEMP_ERROR = 3;
  optional bool FIM_MCU2_ERROR = 4;
  optional bool FIM_S1_HW_ERROR = 5;
  optional bool FIM_S2_HW_ERROR = 6;
  optional bool FIM_S3_HW_ERROR = 7;
  optional bool FIM_S4_HW_ERROR = 8;
  optional bool FIM_S1_HW_Temporary_ERROR = 9;
  optional bool FIM_S2_HW_Temporary_ERROR = 10;
  optional bool FIM_S3_HW_Temporary_ERROR = 11;
  optional bool FIM_S4_HW_Temporary_ERROR = 12;
  optional bool FIM_MCU1_HW_ERROR = 13;
  optional bool FIM_MCU1_Temporary_ERROR = 14;
  optional bool FIM_MCU2_HW_ERROR = 15;
  optional bool FIM_MCU2_Temporary_ERROR = 16;

  optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
  optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
  optional uint64 publish_ptp_ts = 536870907;   // publish ptp timestamp, uint in nanosec
  optional string publisher_id   = 536870909; // uuid of the publisher
  optional uint64 counter        = 536870910;         // message counter
  optional uint64 publish_ts     = 536870911;    // publish utc timestamp; unit : nanosecond
}