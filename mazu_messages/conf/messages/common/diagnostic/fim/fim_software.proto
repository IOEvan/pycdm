syntax = "proto2"; 
option cc_enable_arenas = true;
       

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

message FimSoftwareInfo{// Detected by MW
        optional ProcessFimInfo s1_process_fim_info = 1;
        optional ProcessFimInfo s2_process_fim_info = 2;
        optional ProcessFimInfo s3_process_fim_info = 3;
        optional ProcessFimInfo s4_process_fim_info = 4;            
        
        optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
        optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
        optional uint64 publish_ptp_ts = 536870907;   // publish ptp timestamp, uint in nanosec
        optional string publisher_id   = 536870909; // uuid of the publisher
        optional uint64 counter        = 536870910;         // message counter
        optional uint64 publish_ts     = 536870911;    // publish utc timestamp; unit : nanosecond

} 

message ProcessFimInfo{
        optional bool FIM_CAN_RX_Exited_Abnormal = 1;
        optional bool FIM_CAN_TX_Exited_Abnormal = 2;
        optional bool FIM_Radar_APP_Exited_Abnormal = 3;
        optional bool FIM_Camera_SAL_Exited_Abnormal = 4;
        optional bool FIM_Position_APP_Exited_Abnormal = 5;
        optional bool FIM_AA_APP_Exited_Abnormal = 6;
        optional bool FIM_EHY_APP_Exited_Abnormal = 7;
        optional bool FIM_FCT_APP_Exited_Abnormal = 8;
        optional bool FIM_FCTs_APP_Exited_Abnormal = 9;
        optional bool FIM_FAM_Extied_Abnoraml = 10;
        optional bool FIM_CDM_APP_Exited_Abnormal = 11;
        optional bool FIM_DLB_APP_Exited_Abnormal = 12;
        optional bool FIM_Desensitization_APP_Exited_Abnoraml = 13;
        optional bool FIM_Launcher_Exited_Abnormal = 14;
        optional bool FIM_Rel_Loc_APP_Exited_Abnoraml = 15;
        optional bool FIM_NOPDelta_Planner_Exited_Abnoraml = 16;
        optional bool FIM_NOPDelta_Control_Exited_Abnoraml = 17;
        optional bool FIM_NOPDelta_Canbus_Exited_Abnoraml = 18;
        optional bool FIM_NOPDelta_WM_Exited_Abnoraml = 19;
        optional bool FIM_ADHMI_Exited_Abnormal = 20;
        optional bool FIM_DMS_Exited_Abnormal = 21;
        optional bool FIM_Parking_ENV_Exited_Abnormal = 22;
        optional bool FIM_Parking_Process__Exited_Abnormal = 23;
        optional bool FIM_Parking_Planning_Exited_Abnormal = 24;
        optional bool FIM_Map_Loc_App_Exited_Abnormal = 25;
        optional bool FIM_Uss_App_Exited_Abnormal = 26; // @linescope: NT3

        // 0: no fault, 1: has fault;
}