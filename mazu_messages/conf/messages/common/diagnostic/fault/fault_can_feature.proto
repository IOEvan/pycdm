syntax = "proto2"; 
option cc_enable_arenas = true;
       

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

message CanFeatureFaultInfo{// Detected by MW       
        optional ACMFeatureFaultInfo acm_feature_fault_info = 1;
        optional APAFeatureFaultInfo apa_feature_fault_info = 2;
        optional BCUFeatureFaultInfo bcu_feature_fault_info = 3;
        optional BCMFeatureFaultInfo bcm_feature_fault_info = 4;
        optional BGWFeatureFaultInfo bgw_feature_fault_info = 5;
        optional CCUFeatureFaultInfo ccu_feature_fault_info = 6;
        optional CDCFeatureFaultInfo cdc_feature_fault_info = 7;
        optional EPB1FeatureFaultInfo epb1_feature_fault_info = 8;
        optional EPB2FeatureFaultInfo epb2_feature_fault_info = 9;
        optional EPS1FeatureFaultInfo eps1_feature_fault_info = 10;
        optional EPS2FeatureFaultInfo eps2_feature_fault_info = 11;
        optional SCMFeatureFaultInfo scm_feature_fault_info = 12;
        optional SWCFeatureFaultInfo swc_feature_fault_info = 13;
        optional VCUFeatureFaultInfo vcu_feature_fault_info = 14;        
        
        optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
        optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
        optional uint64 publish_ptp_ts = 536870907;   // publish ptp timestamp, uint in nanosec
        optional string publisher_id   = 536870909; // uuid of the publisher
        optional uint64 counter        = 536870910;         // message counter
        optional uint64 publish_ts     = 536870911;    // publish utc timestamp; unit : nanosecond

} 

message ACMFeatureFaultInfo{
        optional bool CHS1_ACM_YawRateValSts_Invalid = 1;
        optional bool CHS1_ACM_LatAValSts_Invalid = 2;
        optional bool CHS1_ACM_LgtAValSts_Invalid = 3;
        optional bool CHS1_ACM_AxAyYrsCalSts_Invalid = 4;
        // 0: no fault, 1: has fault;
}

message APAFeatureFaultInfo{
        optional bool ADAS_APA_UpaSysSts_F_Invalid = 1;
        optional bool ADAS_APA_UpaSysSts_R_Invalid = 2;
        optional bool ADAS_APA_FrntSnsrFltSt_Invalid = 3;
        optional bool ADAS_APA_ReSnsrFltSt_Invalid = 4;
        optional bool ADAS_APA_UpaSysDrv_Service = 5;
        optional bool ADAS_APA_ApaSts_Failure = 6;
        optional bool ADAS_APA_MapObjSts_invalid = 7;
        optional bool ADAS_APA_SDWSts_invalid = 8;
        optional bool ADAS_APA_UpaSysDi_SystemDisabled = 9;
        // 0: no fault, 1: has fault;
}

message BCUFeatureFaultInfo{
        reserved 17;
        optional bool CHS1_BCU_WhlSpdMovgDir_Invalid = 1;
        optional bool CHS1_BCU_WhlSpdSts_invalid = 2;
        optional bool CHS1_BCU_WhlPlsCntr_Invalid = 3;
