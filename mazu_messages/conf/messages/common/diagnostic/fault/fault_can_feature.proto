        optional bool CHS1_BCU_BrkPressValid_Invalid = 5;
        optional bool CHS1_BCU_BrkPedlSts_Invalid = 6;
        optional bool CHS1_BCU_VehMovgDir_Invalid = 7;
        optional bool CHS1_BCU_BrkPressOffsetValid_Invalid = 8;
        optional bool CHS1_BCU_HDCSts_Invalid = 9;
        optional bool CHS1_BCU_AVHSts_Invalid = 10;
        optional bool CHS1_BCU_AutoBrkAvl_NotAvailable = 11;
        optional bool CHS1_BCU_VehSpdSts_ASILD_Invalid = 12;
        optional bool CHS1_BCU_ABSFailLampReq_LampOn = 13;
        optional bool CHS1_VDCTCSFailLampReq = 14;
        optional bool CHS1_AutoBrkgAvl_Invalid = 15;
        optional bool CHS1_AWBAvl_Invalid = 16;
        // optional bool OBSOLETE_CHS1_ABAAvl_NotAvailable = 17;
        optional bool CHS1_ABPAvl_NotAvailable = 18;
        optional bool CHS1_BrkOverHeat = 19;
        // 0: no fault, 1: has fault;
}

message BCMFeatureFaultInfo{
        optional bool ADAS_BCM_HiBeamSts_Invalid = 1;
        optional bool ADAS_BCM_LoBeamSts_Invalid = 2;
