syntax = "proto2"; 
option cc_enable_arenas = true;
       

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

message PEFaultInfo{// Detected by MW
    optional bool GNSS1_GPSMSM7_Error = 1;
    optional bool GNSS1_GalileoMSM7_Error = 2;
    optional bool GNSS1_QZSSMSM7_Error = 3;
    optional bool GNSS1_BeiDouMSM7_Error = 4;
    optional bool GNSS1_GPSEphemeris_Error = 5;
    optional bool GNSS1_BeiDouEphemeris_Error = 6;
    optional bool GNSS1_QZSSEphemeris_Error = 7;
    optional bool GNSS1_GalileoEphemeris_Error = 8;
    optional bool GNSS2_GPSMSM7_Error = 9;
    optional bool GNSS2_GalileoMSM7_Error = 10;
    optional bool GNSS2_QZSSMSM7_Error = 11;
    optional bool GNSS2_BeiDouMSM7_Error = 12;
    optional bool GNSS2_GPSEphemeris_Error = 13;
    optional bool GNSS2_BeiDouEphemeris_Error = 14;
    optional bool GNSS2_QZSSEphemeris_Error = 15;
    optional bool GNSS2_GalileoEphemeris_Error = 16;
    optional bool RTK_Data_MsgError = 17;
    optional bool Main_Antenna_Abnormal = 18;
    optional bool Sub_Antenna_Abnormal = 19;
    optional bool WheelSpd_Data_Error = 20;
    optional bool IMU_MsgError = 21;
    optional bool WheelSpd_IMU_Timestamp_Error = 22;
    optional bool GnssCal_IMU_Timestamp_Error = 23;
    // 0: no fault, 1: has fault;
    
    optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
    optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts = 536870907;   // publish ptp timestamp, uint in nanosec
    optional string publisher_id   = 536870909; // uuid of the publisher
    optional uint64 counter        = 536870910;         // message counter
    optional uint64 publish_ts     = 536870911;    // publish utc timestamp; unit : nanosecond
}