syntax = "proto2"; 
option cc_enable_arenas = true;
       

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

message DDSFaultInfo{ // Detected by Sub
        optional TopicLosFaultType Fct_Input_TopicLos               = 1;   
        optional TopicLosFaultType Fcts_Input_TopicLos              = 2;  
        optional TopicLosFaultType Ehy_Input_TopicLos               = 3;
        optional TopicLosFaultType FAM_Input_TopicLos               = 4;
        optional TopicLosFaultType Parking_Input_TopicLos           = 5;
        optional TopicLosFaultType NOPDelta_WM_Input_TopicLos       = 6;
        optional TopicLosFaultType NOPDelta_Planner_Input_TopicLos  = 7; 
        optional TopicLosFaultType NOPDelta_Control_Input_TopicLos  = 8;
        optional TopicLosFaultType NOPDelta_Canbus_Input_TopicLos   = 9;  
        
        optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
        optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
        optional uint64 publish_ptp_ts = 536870907;   // publish ptp timestamp, uint in nanosec
        optional string publisher_id   = 536870909; // uuid of the publisher
        optional uint64 counter        = 536870910;         // message counter
        optional uint64 publish_ts     = 536870911;    // publish utc timestamp; unit : nanosecond
}

message TopicLosFaultType{
        optional bool Veh_In_10ms          = 1;
        optional bool Veh_In_50ms          = 2;
        optional bool Vision_OD            = 3;
        optional bool Vision_Road          = 4;
        optional bool Vision_FreeSpace     = 5;
        optional bool Vision_FailSafe      = 6;
        optional bool Radar_Obj            = 7;
        optional bool MAP                  = 8;
        optional bool Ehy_Out              = 9;        
        optional bool Fct_Out              = 10;
        optional bool Fcts_Out             = 11;
        optional bool Parking_Out          = 12;
        optional bool Parking_Perception   = 13;
        optional bool Ads_Out              = 14;
        optional bool FM_Out               = 15;
        optional bool Global_Loc           = 16;
        optional bool Global_HD_Routes     = 17;
        optional bool Static_Map           = 18;
        optional bool Traffic_Info         = 19;
        optional bool Car_State            = 20;
        optional bool Ehy_TSE              = 21;
        optional bool Ehy_TSI              = 22;
        optional bool Ehy_TPP              = 23;
        optional bool Ehy_LPP              = 24;
        optional bool reloc                = 25;
        optional bool sdmap                = 26;
        optional bool road_perception_2d   = 27;
        optional bool reserved1            = 30;
        optional bool reserved2            = 31;
        optional bool reserved3            = 32;
        optional bool reserved4            = 33;
        optional bool reserved5            = 34;
        optional bool reserved6            = 35;
        optional bool reserved7            = 36;

        
        // 0: no fault, 1: has fault;
}