syntax = "proto2"; 
option cc_enable_arenas = true;
       

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

message FWCalibrationFaultInfo{ // Detected by FW
        optional bool Lidar_Calibration_File_NotExisted     = 1;
        optional bool Windshield_Remap_FIle_NotExisted      = 2;
        optional bool FW_Camera_Calibration_File_NotExisted = 3;
        optional bool FN_Camera_Calibration_File_NotExisted = 4;
        optional bool FL_Camera_Calibration_File_NotExisted = 5;
        optional bool FR_Camera_Calibration_File_NotExisted = 6;
        optional bool RL_Camera_Calibration_File_NotExisted = 7;
        optional bool RR_Camera_Calibration_File_NotExisted = 8;
        optional bool SVC_LEFT_Calibration_File_NotExisted  = 9;
        optional bool SVC_RIGHT_Calibration_File_NotExisted = 10;
        optional bool SVC_FRONT_Calibration_File_NotExisted = 11;
        optional bool SVC_REAR_Calibration_File_NotExisted  = 12;
        optional bool RN_Camera_Calibration_File_NotExisted = 13;
        optional bool Lidar_Archive_File_Fail               = 14;
        optional bool Windshield_Archive_File_Fail          = 15;
        optional bool FW_Camera_Archive_File_Fail           = 16;
        optional bool FN_Camera_Archive_File_Fail           = 17;
        optional bool FL_Camera_Archive_File_Fail           = 18;
        optional bool FR_Camera_Archive_File_Fail           = 19;
        optional bool RL_Camera_Archive_File_Fail           = 20;
        optional bool RR_Camera_Archive_File_Fail           = 21;
        optional bool SVC_LEFT_Archive_File_Fail            = 22;
        optional bool SVC_RIGHT_Archive_File_Fail           = 23;
        optional bool SVC_FRONT_Archive_File_Fail           = 24;
        optional bool SVC_REAR_Archive_File_Fail            = 25;
        optional bool RN_Camera_Archive_File_Fail           = 26;

        optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
        optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
        optional uint64 publish_ptp_ts = 536870907;   // publish ptp timestamp, uint in nanosec
        optional string publisher_id   = 536870909; // uuid of the publisher
        optional uint64 counter        = 536870910;         // message counter
        optional uint64 publish_ts     = 536870911;    // publish utc timestamp; unit : nanosecond
}



    