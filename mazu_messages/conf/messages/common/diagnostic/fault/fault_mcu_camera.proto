syntax = "proto2"; 
option cc_enable_arenas = true;
       

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

message CameraFaultInfoFromMCU{ // Detected by MCU
        optional bool front120_sharing_ISP_fault_info = 1;   // 0: no fault, 1: has fault;
        optional bool front120_sharing_ser_fault_info = 2;   // 0: no fault, 1: has fault;
        optional SVCFaultType svc_front_fault_info = 3;
        optional SVCFaultType svc_rear_fault_info = 4;
        optional SVCFaultType svc_left_fault_info = 5;
        optional SVCFaultType svc_right_fault_info = 6;
        
        optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
        optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
        optional uint64 publish_ptp_ts = 536870907;   // publish ptp timestamp, uint in nanosec
        optional string publisher_id   = 536870909; // uuid of the publisher
        optional uint64 counter        = 536870910;         // message counter
        optional uint64 publish_ts     = 536870911;    // publish utc timestamp; unit : nanosecond
}

message SVCFaultType{
        optional bool CameraModule = 1;
        optional bool SerError = 2;
        optional bool DesError = 3;
        optional bool SharingSerError = 4;
        optional bool CameraInitialFailed = 5;
        optional bool VersionMismatch = 6;
        optional bool CameraUnlock = 7;
        // 0: no fault, 1: has fault;
}