syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";
message VehIn_Info {
    optional float Trvl = 1;    // common\vehicle_in\vehicle_10ms ->BrkSysInfo->BrkPdl->trvl
    optional float ActPosn = 2;    // common\vehicle_in\vehicle_10ms ->PtInfo->AccrPedal->ActPosn
    optional float StrWhlAgSAE = 3;    // common\vehicle_in\vehicle_10ms -> StrSys->StrWhlAgSAE
    optional float StrWhlAgSpdSAE = 4;    // common\vehicle_in\vehicle_10ms -> StrSys->StrWhlAgSpdSAE
    optional float TorsBarTqSAE = 5;    // common\vehicle_in\vehicle_10ms -> StrSys-> TorsBarTqSAE
    optional float LatSAEAg = 6;    // common\vehicle_in\vehicle_10ms ->VehDynInfo->LatSAEAg
    optional float LgtSAEAg = 7;    // common\vehicle_in\vehicle_10ms ->VehDynInfo->LgtSAEAg
    optional float VehDispSpd = 8;    // common\vehicle_in\vehicle_10ms ->veh_dyn->VehSpd->vehdispspd
    optional float VehSpdkph = 9;    // common\vehicle_in\vehicle_10ms ->veh_dyn->VehSpd->vehspdkph

    optional uint64 publish_ptp_ts      = 536870907;
    optional uint64 publish_ts          = 536870911; 
}
message Ads_Info {
    optional float ACIReqSAE = 1;    // common/vehicle_out/ads->Actuator->LatCtrl->ACIReqSAE
    optional float VLCTarA = 2;    // common/vehicle_out/ads->Actuator->LngCtrlCmfrt->VLCTarA

    optional uint64 publish_ptp_ts      = 536870907;
    optional uint64 publish_ts          = 536870911; 
}


message VehSnapshotList {
    repeated VehIn_Info vehInfo = 1;
    repeated Ads_Info   adsInfo = 2;

    optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
    optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts      = 536870907;     // publish ptp timestamp, uint in nanosec
    optional string publisher_id        = 536870909;     // uuid of the publisher
    optional uint64 counter             = 536870910;     // message counter
    optional uint64 publish_ts          = 536870911;     // publish utc timestamp; unit : nanosecond
}
