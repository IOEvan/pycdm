syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

// Owner: xin.yang1@nio.com
// For PN; 1Hz; request information from DC

message DcPnReqToAdc {

  optional string map_id = 1;

  optional uint32 pn_req_id = 2;

  optional string destination_id = 3;

  enum destination_type_e {
    DES_TYP_NONE = 0;
    DES_TYP_PARKING_SLOT = 1;
    DES_TYP_POI = 2;
  }

  optional destination_type_e destination_type = 4;

    enum pn_task_req_e {
    PN_TASK_NONE = 0;
    PN_TASK_REACH_DESTINATION = 1;
    PN_TASK_CANCEL = 2;
  }

  optional pn_task_req_e pn_task_req = 5;

    enum cdc_pn_sts_e {
    CDC_PN_STS_DEFAULT = 0;
    CDC_PN_STS_CLOSE = 1;
    CDC_PN_STS_PREPARE = 2;
    CDC_PN_STS_WAIT = 3;
    CDC_PN_STS_READY = 4;
    CDC_PN_STS_HD_NAVIGATION = 5;
    CDC_PN_STS_HD_CRUISE = 6;
  }

  optional cdc_pn_sts_e cdc_pn_sts = 6;

  optional uint32 cdc_pn_error_code = 7;

  enum PsapDriverOffVehModType_e{
    DriverOffVehMode_None = 0;
    DriverOffVehMode_In_Vehicle = 1;
    DriverOffVehMode_Out_of_Vehicle = 2;
}
  optional PsapDriverOffVehModType_e psap_driver_off_vehicle_mode = 8;

  optional bool is_parking_ready_clicked = 9;

  repeated string destination_ids = 10;

  optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin   
  optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
  optional uint64 publish_ptp_ts = 536870907; // publish ptp timestamp; unit : nanosecond
  optional string publisher_id = 536870909;   // uuid of the publisher
  optional uint64 counter = 536870910;        // message counter
  optional uint64 publish_ts = 536870911;     // publish utc timestamp; unit : nanosecond
}