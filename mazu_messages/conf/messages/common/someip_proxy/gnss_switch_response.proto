syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

message GNSSSwitchResponse {
  enum GNSSResp_e {
      GNSS_SWITCH_TO_OFF                = 0;
      GNSS_SWITCH_TO_ON_ENABLE_SHARING  = 1;
      GNSS_SWITCH_TO_ON_DISABLE_SHARING = 2;
      GNSS_SWITCH_FAIL_00               = 3;  // reserved
      GNSS_SWITCH_FAIL_01               = 4;  // reserved
      GNSS_SWITCH_FAIL_02               = 5;  // reserved
      GNSS_SWITCH_FAIL_03               = 6;  // reserved
      GNSS_SWITCH_FAIL_04               = 7;  // reserved
      GNSS_SWITCH_FAIL_05               = 8;  // reserved
      GNSS_SWITCH_FAIL_06               = 9;  // reserved
      GNSS_SWITCH_FAIL_07               = 10;  // reserved
      GNSS_SWITCH_FAIL_08               = 11;  // reserved
      GNSS_SWITCH_FAIL_09               = 12;  // reserved
      GNSS_SWITCH_FAIL_0A               = 13;  // reserved
      GNSS_SWITCH_FAIL_0B               = 14;  // reserved
      GNSS_SWITCH_FAIL_0C               = 15;  // reserved
      GNSS_SWITCH_FAIL_0D               = 16;  // reserved
      GNSS_SWITCH_FAIL_0E               = 17;  // reserved
      GNSS_SWITCH_FAIL_0F               = 18;  // reserved
  }

  optional uint32     swch_req_sequence   = 1; // sequece of request
  optional bool       swch_resp_success   = 2; // true or false
  optional GNSSResp_e swch_resp_status    = 3; // if response_switch == True, response_status === gnss_status; else response_status = Error_Code
  optional uint32     swch_resp_sequence  = 4; // +1 counter for E2E, of response
  optional uint32     swch_resp_timestamp = 5; // response time for E2E

  optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
  optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
  optional uint64 publish_ptp_ts = 536870907;     // publish ptp timestamp, uint in nanosec
  optional string publisher_id = 536870909; // uuid of the publisher
  optional uint64 counter           = 536870910;  // message counter
  optional uint64 publish_ts        = 536870911;  // publish utc timestamp; unit : nanosecond
}
