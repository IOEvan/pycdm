
syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";

message CalibrationSensorInfo {
    enum CalibSensorType {
        SENSOR_TYPE_FW = 0;
        SENSOR_TYPE_FN = 1;
        SENSOR_TYPE_FL = 2; 
        SENSOR_TYPE_FR = 3;
        SENSOR_TYPE_RN = 4;
        SENSOR_TYPE_RL = 5;
        SENSOR_TYPE_RR = 6;
        SENSOR_TYPE_SFW = 7;
        SENSOR_TYPE_SRCW = 8;
        SENSOR_TYPE_SLW = 9;
        SENSOR_TYPE_SRW = 10;
        SENSOR_TYPE_FALCON = 11;
        SENSOR_TYPE_NUMBER = 12;
    }
    optional CalibSensorType type = 1; // -- sensor type
    repeated double parameter = 2; // -- exparam: [rx,ry,rz,tx,ty,tz]
}

message OnlineCalibrationNotification {
    optional uint64 timestamp = 1; // -- time in nanosec that the calibration is done
    repeated CalibrationSensorInfo sensor_info = 2; // -- calibrated sensors' information
    optional string uuid = 3; // -- uuid of this notification
    optional string description = 4; // -- event description, record some info

    optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts = 536870907; // publish ptp timestamp, uint in nanosec
    optional string publisher_id = 536870909; // uuid of the publisher
    optional uint64 counter = 536870910; // -- message counter
    optional uint64 publish_ts = 536870911; // publish utc timestamp, unit in nanosec
}