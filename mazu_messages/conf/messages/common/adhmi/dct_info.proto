syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;

message DctInfo {
    enum DctType {
        DEFAULT = 0;
        AD_INTERACT_ZONE = 1;
    }
    optional string version    = 1;
    optional DctType type      = 2;
    optional string name       = 3;
    optional uint32 filesize   = 4;
    optional string md5        = 5;
}