// @filescope: NT3
syntax = "proto2";

option cc_enable_arenas = true;
package nio.ad.messages;
import "common/cfgclient/cfg_info.proto";
import "common/perf/sensor_ts_header.proto";

message ConfigItemRequest {
    optional FileType file_type        = 1;
    optional string version            = 2;
    optional string uuid               = 3;    // message uuid
} 

message UpgradeStatusReport {
enum UpgradeStatus {
    DEFAULT_STS        = 0;
    GET_FILE_SUCCESS   = 1;
    GET_FILE_UNSUCCESS = 2;
    PARSE_OK           = 3;
    PARSE_NOTOK        = 4;
    UPDATE_SUCEESS     = 5;
    UPDATE_UNSUCEESS   = 6;
    SWITCH_DEFAULT_SUCCESS   = 7;
    SWITCH_DEFAULT_UNSUCCESS = 8;
}
    optional FileType file_type = 1;
    optional UpgradeStatus status = 2;
}

message VersionReport {
    optional FileType file_type = 1;
    optional string version = 2;
}


message WtiClientRequest {
    optional ConfigItemRequest item_request                         = 1;
    optional UpgradeStatusReport status_report                      = 2;
    optional VersionReport version_report                           = 3;

    optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin
    optional SensorTSHeader sensor_original_ts                      = 536870906;   // sensor original ts
    optional uint64 publish_ptp_ts                                  = 536870907;   // publish ptp timestamp, uint in nanosec
    optional string publisher_id                                    = 536870909;   // uuid of the publisher
    optional uint64 counter                                         = 536870910;   // message counter
    optional uint64 publish_ts                                      = 536870911;   // publish utc timestamp; unit : nanosecond
}