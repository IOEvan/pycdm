// author: sebastian
syntax = "proto2";

option cc_enable_arenas = true;

package nio.ad.messages;
import "common/perf/sensor_ts_header.proto";
import "common/pnc/geometry.proto";
import "common/pnc/state_machine.proto";

message StateMachinetoWM {

  optional uint32 statemachine_maprequest =
      1; // 0 "perception only", 1 "map fusion"
  optional bool yawing_pre_check = 2;
  message ReferenceLineMsg {
    optional uint64 timestamp = 1;
    repeated Vector3d refline_line_points = 2; // for wm
  }
  optional ReferenceLineMsg reference_line_msg = 3;
  optional ALCFuncSts nop_alc_sts = 4 [default = ALC_NOT_ENGAGED];

  enum LateralBehaviorType {
    UNDEFINED = 0; LANE_KEEP = 1; OOL_NUDGE_LEFT = 2; OOL_NUDGE_RIGHT = 3;
    LANE_CHANGE_LEFT = 4;
    LANE_CHANGE_RIGHT = 5;
    LANE_CHANGE_HOLD = 6;
    LANE_CHANGE_PREPARE = 7;
    LANE_CHANGE_BIAS = 8;
    ACROSS_LANE_CHANGE = 9;
    ACROSS_LANE_CHANGE_BIAS = 10;
    FALLBACK = 11;
  };

  optional LateralBehaviorType lat_behavior_type = 5 [default = UNDEFINED];
  optional uint64 lc_target_lane_id = 6;

  repeated double statemachine_to_wm_reserved = 9999;

  optional uint64 timestamp = 536870905; // ptp timestamp, nanosecond，used for data bundle readin   
  optional SensorTSHeader sensor_original_ts = 536870906;   // sensor original ts
  optional uint64 publish_ptp_ts = 536870907; // publish ptp timestamp, uint in nanosec
  optional string publisher_id = 536870909; // uuid of the publisher`
  optional uint64 counter = 536870910; // message counter
  optional uint64 publish_ts = 536870911; // publish timestamp; unit : nanosecond
}
